# Coverage matrix — which registry sources back which workbook, and how
# strongly. This is derived from sources/registry.yaml's
# workbook_categories field; keep the two in sync (tests/test_registry.py
# checks that every source id referenced here exists in registry.yaml).
#
# coverage levels:
#   primary     - main technical backbone for this workbook
#   supporting  - used for specific chapters/sections, not the backbone
#   discovery   - used to find other sources, not cited directly for facts

workbooks:
  - id: "01-ml-foundations"
    sources:
      - id: "src-01"
        coverage: "supporting"

  - id: "02-ml-interviews"
    sources:
