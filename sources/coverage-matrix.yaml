      - id: "src-02"
        coverage: "supporting"
      - id: "src-03"
        coverage: "supporting"
      - id: "src-06"
        coverage: "supporting"
      - id: "src-01"
        coverage: "supporting"
      - id: "src-07"
        coverage: "discovery"
      - id: "src-08"
        coverage: "supporting"

  - id: "03-ml-systems-design"
