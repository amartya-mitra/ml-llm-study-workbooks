gaps_and_notes:
  - "Workbook 01 (ML Foundations) currently has only one supporting source (src-01, a cheat sheet). It needs primary technical sources (textbooks, canonical papers) before drafting — flagged for the next planning pass, not resolved in this bootstrap."
  - "Workbook 03 (ML Systems Design) leans entirely on Chip Huyen's two books (src-04/src-05 authors overlap with workbook 02) — consider adding an independent second source for triangulation."
  - "No source currently covers classic ML algorithm derivations in depth (workbook 01) — this is the main pre-drafting gap."
  - "Workbook 04: src-16 (Smol Training Playbook) was checked during Stage 5 and excluded — it's a workbook-05 pretraining source, and its body content is client-side-rendered and was not retrievable this session anyway (see its registry entry)."
  - "Workbook 04: src-17 (Ultra-Scale Playbook)'s body content is likewise client-side-rendered and was not retrievable this session; its workbook-04 role (systems_companion for ch. 5/ch. 7) is provisional on the meta-description alone until a render-capable fetch confirms the actual content."
  - "Workbook 04: the MoE load-balancing-loss lineage (src-28 -> src-29 -> src-30 -> src-33) is a genuine, unresolved disagreement across four non-equivalent formulations, not a citation redundancy — see reports/04_source_audit.md; do not collapse this into a single 'the load-balancing loss' claim when ch. 5 is drafted."
  - "Workbook 04: src-35 (Jamba) has a newer 'Jamba 1.5' report (arXiv:2408.12570) that was not verified this session — an open decision for ch. 4/ch. 6's drafter, not a silent substitution either way."
  - "Workbook 04: several secondary/explanatory sources surfaced during Stage 4 research (e.g. the EleutherAI RoPE blog post, Raschka's dedicated GQA gallery page) were only confirmed to exist via search, not fetched for content accuracy — do not cite specific claims from them until independently fetched."
