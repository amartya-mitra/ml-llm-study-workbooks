  - "Workbook 03 (ML Systems Design) leans entirely on Chip Huyen's two books (src-04/src-05 authors overlap with workbook 02) — consider adding an independent second source for triangulation."
  - "No source currently covers classic ML algorithm derivations in depth (workbook 01) — this is the main pre-drafting gap."
