# Coverage matrix — which registry sources back which workbook, and how
# strongly. This is derived from sources/registry.yaml's
# workbook_categories field; keep the two in sync (tests/test_registry.py
# checks that every source id referenced here exists in registry.yaml).
#
# coverage levels:
#   primary     - main technical backbone for this workbook
#   supporting  - used for specific chapters/sections, not the backbone
#   discovery   - used to find other sources, not cited directly for facts
#   excluded    - explicitly considered and ruled out for this workbook,
#                 recorded so the decision is visible rather than a
#                 silent omission (see the Stage 5 "out of scope" role)
#
# `role` (workbook-04 entries only, added in the Stage 5 source-discovery
# pass — see reports/04_source_audit.md) classifies a source's relevance
# to workbook 04 SPECIFICALLY, which is a narrower question than the
# source's general authority_type in registry.yaml. Allowed values:
#   core_narrative_source   - a main source the prose relies on to explain a mechanism
#   visual_reference_source - useful for scoping/figure inspiration, not prose claims
#   source_discovery_aid    - a pointer to other sources, not citable for facts
#   systems_companion       - relevant to systems/inference/training mechanics adjacent to architecture
#   out_of_scope            - not used by this workbook

