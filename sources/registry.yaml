    authority_type: "primary_technical"
    expected_use: "primary source for workbook 05 ch. 4: the original pipeline-parallelism formalism -- partitioning a sequence of L layers into K cells placed on K accelerators, splitting a mini-batch of size N into M micro-batches, and the paper's own coined term 'bubble overhead' with its stated rule of thumb (negligible once M >= 4xK). Cited directly by the Ultra-Scale Playbook (src-17) as the origin of the AFAB-style pipeline schedule that chapter 4 also teaches via src-17."
    last_verified: "2026-09-27"
    access_status: "verified via full-text PDF extraction (pdftotext against the downloaded arXiv PDF), not abstract-only. Confirmed the paper's own Section 2.2 wording: 'partitioning introduces some idle time per accelerator, which we refer to as the bubble overhead. This bubble time is O((M-1+K-1)) amortized over the number of micro-steps M. In our experiments, we found the bubble overhead to be negligible when M >= 4xK.'"
    license_or_reuse: "arXiv preprint -- standard arXiv terms; text synthesis/citation only, no figure reuse without checking the paper's own license"
    notes: "Google, 2018-11-16 (v5 2019-07-25). Introduces synchronous mini-batch gradient descent across micro-batches: gradients are accumulated across all M micro-batches and applied once at the end of a mini-batch, so gradient updates are numerically consistent regardless of the number of partitions -- workbook 05 ch. 4 uses this to justify why pipeline parallelism is not 'ordinary data parallelism across consecutive batches.'"

