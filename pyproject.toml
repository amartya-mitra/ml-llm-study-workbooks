[project]
name = "ml-llm-study-workbooks"
version = "0.1.0"
description = "Concise, visual, source-grounded ML and LLM study workbooks."
requires-python = ">=3.10"
readme = "README.md"

# Deliberately zero required runtime dependencies: this environment has no
# pip/ensurepip (see reports/bootstrap_environment.md), so all scripts/
# under scripts/ and figures/source/ are written against the Python 3.10
# standard library only, using scripts/_yaml_lite.py in place of PyYAML.
dependencies = []

[project.optional-dependencies]
# The base python3 on this host has no pip/ensurepip. If you need these
# packages, use the pip that ships inside the user-local `ml-workbooks`
# conda env (see README.md's "Development setup") rather than trying to
# bootstrap pip for the base interpreter. Nothing in this repo requires
# this group today — scripts/_yaml_lite.py covers every .yaml file here
# and tests/ needs no pytest — it only upgrades ergonomics if you want
# real YAML-edge-case handling or JSON Schema validation later.
full = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
