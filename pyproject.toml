[project]
name = "ml-llm-study-workbooks"
version = "0.1.0"
description = "Concise, visual, source-grounded ML and LLM study workbooks."
requires-python = ">=3.10"
readme = "README.md"

# Deliberately zero required runtime dependencies: this environment has no
# pip/ensurepip (see reports/bootstrap_environment.md), so all scripts/
# under scripts/ and figures/source/ are written against the Python 3.10
# standard library only, using scripts/_yaml_lite.py in place of PyYAML.
dependencies = []

[project.optional-dependencies]
# Install this group only after a user-local pip/uv bootstrap (see
# reports/bootstrap_report.md for the exact proposed steps). Nothing in
# this repo requires it today; it upgrades ergonomics if/when pip becomes
# available (real YAML edge cases, JSON Schema validation, tests).
full = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
