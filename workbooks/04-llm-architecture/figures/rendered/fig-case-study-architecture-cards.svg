  <rect x="857.0" y="130" width="16" height="16" rx="2" fill="#e6e6e6" stroke="#333333" stroke-width="1"/>
  <rect x="877.0" y="130" width="16" height="16" rx="2" fill="#e6e6e6" stroke="#333333" stroke-width="1"/>
  <rect x="897.0" y="130" width="16" height="16" rx="2" fill="#e6e6e6" stroke="#333333" stroke-width="1"/>
  <rect x="917.0" y="130" width="16" height="16" rx="2" fill="#e6e6e6" stroke="#333333" stroke-width="1"/>
  <text x="855.0" y="158" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555555" text-anchor="middle">2 of 16 routed active, no shared expert (schematic)</text>
  <rect x="718.0" y="164" width="40" height="33" rx="6" fill="#888888" stroke="#333333" stroke-width="1"/>
  <rect x="768.0" y="185" width="15" height="12" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <rect x="788.0" y="178" width="15" height="19" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <rect x="808.0" y="171" width="15" height="26" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <rect x="828.0" y="164" width="15" height="33" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <text x="855.0" y="212" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="middle">cache state: mostly fixed size,</text>
  <text x="855.0" y="228" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="middle">small growing part (attn layers only)</text>
  <rect x="20" y="258" width="16" height="16" rx="2" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="44" y="271" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">stored/active state or dense path</text>
  <rect x="20" y="284" width="16" height="16" rx="2" fill="#E69F00" stroke="#333333" stroke-width="1.5"/>
  <text x="44" y="297" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">computed/compressed or MoE-active path</text>
