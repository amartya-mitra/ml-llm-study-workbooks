  <rect x="512.0" y="130" width="16" height="16" rx="2" fill="#E69F00" stroke="#333333" stroke-width="1"/>
  <rect x="532.0" y="130" width="16" height="16" rx="2" fill="#E69F00" stroke="#333333" stroke-width="1"/>
  <rect x="552.0" y="130" width="16" height="16" rx="2" fill="#E69F00" stroke="#333333" stroke-width="1"/>
  <rect x="572.0" y="130" width="16" height="16" rx="2" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <text x="510.0" y="158" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555555" text-anchor="middle">8 of 256 routed active + 1 shared (schematic, not to scale)</text>
  <rect x="373.0" y="185" width="15" height="12" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <rect x="393.0" y="178" width="15" height="19" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <rect x="413.0" y="171" width="15" height="26" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <rect x="433.0" y="164" width="15" height="33" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <text x="510.0" y="212" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="middle">cache state: compressed latent,</text>
  <text x="510.0" y="228" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="middle">grows every layer, smaller per token</text>
  <text x="855.0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#111111" text-anchor="middle">Jamba</text>
  <text x="855.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555555" text-anchor="middle">hybrid, AI21, 2024-03-28</text>
  <rect x="708.0" y="48" width="294.0" height="26" rx="5" fill="#888888" stroke="#333333" stroke-width="1.5"/>
  <text x="855.0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">Mostly: Mamba (selective SSM)</text>
  <rect x="708.0" y="82" width="294.0" height="26" rx="5" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="855.0" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">Occasionally: Attn, GQA (32/8 heads)</text>
  <text x="855.0" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#555555" text-anchor="middle">1 attn : 7 Mamba layers x4 blocks (schematic)</text>
