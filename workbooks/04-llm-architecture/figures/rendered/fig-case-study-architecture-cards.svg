<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="348" viewBox="0 0 1020 348">
  <title>Three case-study architectures in one visual grammar</title>
  <defs></defs>
  <rect x="0" y="0" width="1020" height="348" fill="#ffffff"/>
  <text x="165.0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#111111" text-anchor="middle">Llama 3 405B</text>
  <text x="165.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555555" text-anchor="middle">dense, Meta, 2024-07-31</text>
  <rect x="18" y="48" width="294.0" height="26" rx="5" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="165.0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">Attn: full causal, GQA (8 KV heads)</text>
  <rect x="18" y="82" width="294.0" height="26" rx="5" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="165.0" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">FFN: dense (SwiGLU)</text>
  <text x="165.0" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#555555" text-anchor="middle">block repeated x126 (schematic)</text>
  <rect x="28" y="161" width="15" height="12" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <rect x="48" y="154" width="15" height="19" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <rect x="68" y="147" width="15" height="26" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <rect x="88" y="140" width="15" height="33" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  <text x="165.0" y="188" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="middle">cache state: full K/V,</text>
  <text x="165.0" y="204" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="middle">grows every layer/token</text>
  <text x="510.0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#111111" text-anchor="middle">DeepSeek-V3</text>
  <text x="510.0" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555555" text-anchor="middle">MoE + MLA, 2024-12-27</text>
  <rect x="363.0" y="48" width="294.0" height="26" rx="5" fill="#E69F00" stroke="#333333" stroke-width="1.5"/>
  <text x="510.0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">Attn: MLA (compressed latent)</text>
  <rect x="363.0" y="82" width="294.0" height="26" rx="5" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="510.0" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">FFN: 1 shared + 256 routed (8 active)</text>
  <text x="510.0" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#555555" text-anchor="middle">block repeated x58 of 61 (schematic)</text>
