<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="369" viewBox="0 0 1000 369">
  <title>Six resources, four lifecycles</title>
  <defs></defs>
  <rect x="0" y="0" width="1000" height="369" fill="#ffffff"/>
  <rect x="10" y="20" width="306.6666666666667" height="90" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="163.33333333333334" y="46" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Weights</text>
  <text x="163.33333333333334" y="68" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">persistent: training + inference</text>
  <rect x="346.6666666666667" y="20" width="306.6666666666667" height="90" rx="6" fill="#009E73" stroke="#333333" stroke-width="1.5"/>
  <text x="500.0" y="46" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Training activations</text>
  <text x="500.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">training only</text>
  <rect x="683.3333333333334" y="20" width="306.6666666666667" height="90" rx="6" fill="#009E73" stroke="#333333" stroke-width="1.5"/>
  <text x="836.6666666666667" y="46" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Gradients</text>
  <text x="836.6666666666667" y="68" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">training only</text>
  <rect x="10" y="130" width="306.6666666666667" height="90" rx="6" fill="#009E73" stroke="#333333" stroke-width="1.5"/>
  <text x="163.33333333333334" y="156" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Optimizer state</text>
  <text x="163.33333333333334" y="178" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">training only</text>
  <rect x="346.6666666666667" y="130" width="306.6666666666667" height="90" rx="6" fill="#E69F00" stroke="#333333" stroke-width="1.5"/>
  <text x="500.0" y="156" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Inference KV /</text>
  <text x="500.0" y="178" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">request-specific</text>
  <rect x="683.3333333333334" y="130" width="306.6666666666667" height="90" rx="6" fill="#888888" stroke="#333333" stroke-width="1.5"/>
  <text x="836.6666666666667" y="156" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Temporary workspace</text>
  <text x="836.6666666666667" y="178" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">implementation-dependent</text>
  <rect x="20" y="250" width="16" height="16" rx="2" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="44" y="263" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">persistent across training AND inference (weights)</text>
  <rect x="20" y="276" width="16" height="16" rx="2" fill="#009E73" stroke="#333333" stroke-width="1.5"/>
  <text x="44" y="289" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">training-only (vanishes at inference time)</text>
  <rect x="20" y="302" width="16" height="16" rx="2" fill="#E69F00" stroke="#333333" stroke-width="1.5"/>
  <text x="44" y="315" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">request-specific (grows/shrinks with active sequences)</text>
  <rect x="20" y="328" width="16" height="16" rx="2" fill="#888888" stroke="#333333" stroke-width="1.5"/>
  <text x="44" y="341" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">implementation-dependent (varies by kernel/allocator/serving engine)</text>
</svg>
