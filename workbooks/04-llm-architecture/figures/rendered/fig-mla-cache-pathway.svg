<svg xmlns="http://www.w3.org/2000/svg" width="700" height="395" viewBox="0 0 700 395">
  <title>MLA cache pathway: compression, cached latent, and decode-time use</title>
  <defs><marker id="arrow-333333" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
  <rect x="0" y="0" width="700" height="395" fill="#ffffff"/>
  <rect x="250.0" y="20" width="200" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="350.0" y="45.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#111111" text-anchor="middle">hidden state h_t</text>
  <line x1="350.0" y1="60" x2="350.0" y2="84" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <text x="360.0" y="78" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555555" text-anchor="start">compress (down-projection)</text>
  <rect x="145.0" y="90" width="220" height="44" rx="6" fill="#0072B2" stroke="#333333" stroke-width="2"/>
  <text x="255.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">latent c_t^KV (d_c)</text>
  <rect x="395.0" y="90" width="160" height="44" rx="6" fill="#0072B2" stroke="#333333" stroke-width="2"/>
  <text x="475.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">rope key k_t^R</text>
  <text x="475.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">(d_rope)</text>
  <text x="350.0" y="156" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555555" text-anchor="middle">cached during inference (per token, per layer)</text>
  <text x="350.0" y="174" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555555" text-anchor="middle">separate component needed: RoPE applied to the latent would break matrix absorption</text>
  <line x1="320.0" y1="199" x2="180.0" y2="224" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <line x1="380.0" y1="199" x2="520.0" y2="224" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-333333)"/>
  <text x="180.0" y="246" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">conceptual derivation</text>
  <rect x="70.0" y="254" width="220" height="46" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="180.0" y="275.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111111" text-anchor="middle">reconstruct per-head K/V</text>
  <text x="180.0" y="291.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555555" text-anchor="middle">(up-projection; not cached)</text>
  <text x="520.0" y="246" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">optional: matrix absorption</text>
  <rect x="410.0" y="254" width="220" height="46" rx="6" fill="#ffffff" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="520.0" y="269.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111111" text-anchor="middle">W^UK folded into W^Q,</text>
  <text x="520.0" y="283.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#111111" text-anchor="middle">W^UV folded into W^O</text>
  <text x="520.0" y="297.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555555" text-anchor="middle">(implementation-dependent)</text>
  <line x1="180.0" y1="300" x2="350.0" y2="330" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <line x1="520.0" y1="300" x2="350.0" y2="330" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-333333)"/>
  <rect x="240.0" y="330" width="220" height="40" rx="6" fill="#E69F00" stroke="#333333" stroke-width="2"/>
  <text x="350.0" y="355.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">attention score / output</text>
</svg>
