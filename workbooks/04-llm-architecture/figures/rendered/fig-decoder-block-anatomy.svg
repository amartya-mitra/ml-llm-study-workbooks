<svg xmlns="http://www.w3.org/2000/svg" width="560" height="445" viewBox="0 0 560 445">
  <title>Decoder block anatomy: residual stream with two sublayers</title>
  <defs><marker id="arrow-0072B2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="arrow-333333" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
  <rect x="0" y="0" width="560" height="445" fill="#ffffff"/>
  <text x="280.0" y="20" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555555" text-anchor="middle">residual stream (in)</text>
  <line x1="280.0" y1="30" x2="280.0" y2="50" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-0072B2)"/>
  <line x1="286.0" y1="74" x2="365.0" y2="74" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <rect x="375.0" y="60" width="70" height="28" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="410.0" y="78.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">norm</text>
  <line x1="410.0" y1="88" x2="410.0" y2="110" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <rect x="345.0" y="110" width="130" height="44" rx="6" fill="#E69F00" stroke="#333333" stroke-width="2"/>
  <text x="410.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">attention sublayer</text>
  <line x1="410.0" y1="154" x2="410.0" y2="170" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <circle cx="410.0" cy="180" r="11" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="410.0" y="184" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">+</text>
  <line x1="365.0" y1="180" x2="286.0" y2="180" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <line x1="280.0" y1="50" x2="280.0" y2="169" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-0072B2)"/>
  <line x1="286.0" y1="224" x2="365.0" y2="224" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <rect x="375.0" y="210" width="70" height="28" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="410.0" y="228.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">norm</text>
  <line x1="410.0" y1="238" x2="410.0" y2="260" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <rect x="345.0" y="260" width="130" height="44" rx="6" fill="#E69F00" stroke="#333333" stroke-width="2"/>
  <text x="410.0" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">MLP sublayer</text>
  <line x1="410.0" y1="304" x2="410.0" y2="320" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <circle cx="410.0" cy="330" r="11" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="410.0" y="334" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">+</text>
  <line x1="365.0" y1="330" x2="286.0" y2="330" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <line x1="280.0" y1="180" x2="280.0" y2="340" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-0072B2)"/>
  <line x1="280.0" y1="330" x2="280.0" y2="370" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-0072B2)"/>
  <text x="280.0" y="385" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555555" text-anchor="middle">residual stream (out) -- same width as (in)</text>
  <text x="30" y="20" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#777777" text-anchor="start">each box below reads a normalized COPY</text>
  <text x="30" y="34" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#777777" text-anchor="start">of the stream but adds its result back</text>
  <text x="30" y="48" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#777777" text-anchor="start">onto the ORIGINAL stream value at +</text>
  <rect x="30" y="415" width="16" height="4" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="52" y="423" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">residual stream (stored state, constant width)</text>
  <rect x="300" y="409" width="16" height="16" rx="6" fill="#E69F00" stroke="#333333" stroke-width="1.5"/>
  <text x="322" y="423" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">computation (a sublayer)</text>
</svg>
