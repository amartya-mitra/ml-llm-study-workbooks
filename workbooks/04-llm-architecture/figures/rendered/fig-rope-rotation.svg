<svg xmlns="http://www.w3.org/2000/svg" width="700" height="410" viewBox="0 0 700 410">
  <title>RoPE: relative angle is invariant to absolute position</title>
  <defs><marker id="arrow-0072B2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="arrow-E69F00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E69F00"/></marker></defs>
  <rect x="0" y="0" width="700" height="410" fill="#ffffff"/>
  <text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="start">Same relative offset, different absolute positions -&gt; same angle between q and k</text>
  <circle cx="190" cy="170" r="90" fill="none" stroke="#dddddd" stroke-width="1"/>
  <line x1="90" y1="170" x2="290" y2="170" stroke="#eeeeee" stroke-width="1"/>
  <line x1="190" y1="70" x2="190" y2="270" stroke="#eeeeee" stroke-width="1"/>
  <line x1="190" y1="170" x2="271.5677008332985" y2="131.96435644333707" stroke="#0072B2" stroke-width="2.5" marker-end="url(#arrow-0072B2)"/>
  <line x1="190" y1="170" x2="280.0" y2="170.0" stroke="#E69F00" stroke-width="2.5" marker-end="url(#arrow-E69F00)"/>
  <text x="279.5677008332985" y="125.96435644333707" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#0072B2" text-anchor="start">q (pos 1)</text>
  <text x="288.0" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#E69F00" text-anchor="start">k (pos 0)</text>
  <path d="M 222.6,154.8 L 223.2,156.0 L 223.6,157.2 L 224.1,158.4 L 224.5,159.7 L 224.8,160.9 L 225.1,162.2 L 225.4,163.5 L 225.6,164.8 L 225.8,166.1 L 225.9,167.4 L 226.0,168.7 L 226.0,170.0" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">positions (1, 0)</text>
  <text x="190" y="306" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#555555" text-anchor="middle">relative offset = 1 position(s)</text>
  <circle cx="510" cy="170" r="90" fill="none" stroke="#dddddd" stroke-width="1"/>
  <line x1="410" y1="170" x2="610" y2="170" stroke="#eeeeee" stroke-width="1"/>
  <line x1="510" y1="70" x2="510" y2="270" stroke="#eeeeee" stroke-width="1"/>
  <line x1="510" y1="170" x2="533.2937140592269" y2="83.06667563398385" stroke="#0072B2" stroke-width="2.5" marker-end="url(#arrow-0072B2)"/>
  <line x1="510" y1="170" x2="567.8508848717886" y2="101.05600011929198" stroke="#E69F00" stroke-width="2.5" marker-end="url(#arrow-E69F00)"/>
  <text x="541.2937140592269" y="77.06667563398385" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#0072B2" text-anchor="start">q (pos 3)</text>
  <text x="575.8508848717886" y="115.05600011929198" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#E69F00" text-anchor="start">k (pos 2)</text>
  <path d="M 519.3,135.2 L 520.6,135.6 L 521.8,136.0 L 523.0,136.4 L 524.3,136.9 L 525.5,137.5 L 526.6,138.1 L 527.8,138.7 L 528.9,139.4 L 530.0,140.1 L 531.1,140.8 L 532.1,141.6 L 533.1,142.4" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="510" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">positions (3, 2)</text>
  <text x="510" y="306" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#555555" text-anchor="middle">relative offset = 1 position(s)</text>
  <text x="20" y="335" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">Both panels: the angle traced between q and k is identical, because each vector</text>
  <text x="20" y="350" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">is rotated by its OWN position, so only the difference in position survives.</text>
  <text x="20" y="373" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#888888" text-anchor="start">Simplified model: real RoPE rotates several 2D subspaces at different frequencies</text>
  <text x="20" y="387" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#888888" text-anchor="start">at once; this figure shows one subspace at one frequency to keep the geometry checkable by eye.</text>
</svg>
