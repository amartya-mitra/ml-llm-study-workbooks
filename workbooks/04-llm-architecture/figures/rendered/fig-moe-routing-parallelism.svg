  <line x1="290.0" y1="83" x2="140.0" y2="212" stroke="#D55E00" stroke-width="1" marker-end="url(#arrow-D55E00)"/>
  <line x1="370.0" y1="83" x2="140.0" y2="212" stroke="#D55E00" stroke-width="1" marker-end="url(#arrow-D55E00)"/>
  <line x1="450.0" y1="83" x2="300.0" y2="212" stroke="#333333" stroke-width="1" marker-end="url(#arrow-333333)"/>
  <line x1="530.0" y1="83" x2="520.0" y2="212" stroke="#333333" stroke-width="1" marker-end="url(#arrow-333333)"/>
  <line x1="610.0" y1="83" x2="680.0" y2="212" stroke="#333333" stroke-width="1" marker-end="url(#arrow-333333)"/>
  <text x="20" y="326" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">Dispatch (router -&gt; expert) and return (expert -&gt; token) both cross the device boundary --</text>
  <text x="20" y="344" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">&quot;all-to-all&quot;: every device may need to send tokens to, and receive results from, every other device.</text>
  <rect x="20" y="371" width="16" height="16" rx="2" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="44" y="384" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111111" text-anchor="start">expert (stored on one device)</text>
  <rect x="320" y="371" width="16" height="16" rx="2" fill="#0072B2" stroke="#D55E00" stroke-width="2.5"/>
  <text x="344" y="384" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#111111" text-anchor="start">overloaded expert (this batch)</text>
</svg>
