  <rect x="0" y="0" width="820" height="411" fill="#ffffff"/>
  <text x="410.0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111" text-anchor="middle">6 tokens, top-1 routing, 4 experts split across 2 devices</text>
