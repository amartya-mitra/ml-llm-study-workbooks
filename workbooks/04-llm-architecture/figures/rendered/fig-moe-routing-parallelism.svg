  <text x="610.0" y="65" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#ffffff" text-anchor="middle">t6</text>
  <line x1="210.0" y1="75" x2="410.0" y2="110" stroke="#333333" stroke-width="1" marker-end="url(#arrow-333333)"/>
  <line x1="290.0" y1="75" x2="410.0" y2="110" stroke="#333333" stroke-width="1" marker-end="url(#arrow-333333)"/>
