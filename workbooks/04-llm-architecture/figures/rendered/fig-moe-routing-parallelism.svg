  <rect x="340.0" y="45" width="60" height="30" rx="4" fill="#0072B2" stroke="#333333" stroke-width="1.2"/>
  <text x="370.0" y="65" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#ffffff" text-anchor="middle">t3</text>
  <rect x="420.0" y="45" width="60" height="30" rx="4" fill="#0072B2" stroke="#333333" stroke-width="1.2"/>
  <text x="450.0" y="65" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#ffffff" text-anchor="middle">t4</text>
