  <text x="520.0" y="256" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#ffffff" text-anchor="middle">1 token(s)</text>
  <rect x="630.0" y="216" width="100" height="50" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="680.0" y="238" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">E4</text>
