  <line x1="450.0" y1="75" x2="410.0" y2="110" stroke="#333333" stroke-width="1" marker-end="url(#arrow-333333)"/>
  <line x1="530.0" y1="75" x2="410.0" y2="110" stroke="#333333" stroke-width="1" marker-end="url(#arrow-333333)"/>
  <line x1="610.0" y1="75" x2="410.0" y2="110" stroke="#333333" stroke-width="1" marker-end="url(#arrow-333333)"/>
  <rect x="330.0" y="110" width="160" height="36" rx="6" fill="#E69F00" stroke="#333333" stroke-width="2"/>
  <text x="410.0" y="134" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">router</text>
  <rect x="50.0" y="186" width="340" height="110" rx="8" fill="#ffffff" stroke="#CC79A7" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="220.0" y="178" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">device 1</text>
  <rect x="430.0" y="186" width="340" height="110" rx="8" fill="#ffffff" stroke="#CC79A7" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600.0" y="178" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">device 2</text>
