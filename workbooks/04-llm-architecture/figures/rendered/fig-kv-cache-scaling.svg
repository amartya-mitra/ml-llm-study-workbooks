<svg xmlns="http://www.w3.org/2000/svg" width="650" height="420" viewBox="0 0 650 420">
  <title>Logical KV-cache memory: MHA vs. GQA vs. MQA</title>
  <defs><marker id="arrow-888888" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker></defs>
  <rect x="0" y="0" width="650" height="420" fill="#ffffff"/>
  <text x="20" y="26" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="start">Logical KV-cache size per sequence (L=32, H_q=32, d_head=128, S=8192, B=1, bf16)</text>
  <text x="20" y="46" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">bar height is log2-scaled for visibility -- printed values are the actual linear byte counts</text>
  <rect x="60" y="144.0" width="110" height="156.0" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="115.0" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">4 GiB</text>
  <text x="115.0" y="324" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">MHA</text>
  <text x="115.0" y="344" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555555" text-anchor="middle">H_kv = 32</text>
  <rect x="240" y="170.0" width="110" height="130.0" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="295.0" y="158.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">1 GiB</text>
  <text x="295.0" y="324" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">GQA</text>
  <text x="295.0" y="344" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555555" text-anchor="middle">H_kv = 8</text>
  <rect x="420" y="209.0" width="110" height="91.0" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="475.0" y="197.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">128 MiB</text>
  <text x="475.0" y="324" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">MQA</text>
  <text x="475.0" y="344" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555555" text-anchor="middle">H_kv = 1</text>
  <line x1="40" y1="300" x2="40" y2="124.0" stroke="#888888" stroke-width="1" marker-end="url(#arrow-888888)"/>
  <text x="34" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#888888" text-anchor="end">larger</text>
  <text x="20" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">Logical minimum only -- excludes allocator overhead, page metadata, fragmentation,</text>
  <text x="20" y="395" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">attention workspaces, and framework buffers. Not a measured GPU-memory number.</text>
</svg>
