<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <title>Tensor shapes: MHA vs. GQA (Q unchanged, K/V&#x27;s head axis shrinks)</title>
  <defs></defs>
  <rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
  <text x="20" y="40" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111" text-anchor="start">MHA</text>
  <rect x="40" y="55" width="210" height="60" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="145.0" y="79.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#111111" text-anchor="middle">Q:</text>
  <text x="145.0" y="101.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#111111" text-anchor="middle">(B, T_q, H_q, d_head)</text>
  <rect x="300" y="55" width="210" height="60" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="405.0" y="68.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">K:</text>
  <text x="405.0" y="90.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">(B, S, H_kv, d_head)</text>
  <text x="405.0" y="112.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">H_kv = H_q</text>
  <rect x="560" y="55" width="210" height="60" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="665.0" y="68.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">V:</text>
  <text x="665.0" y="90.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">(B, S, H_kv, d_head)</text>
  <text x="665.0" y="112.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">H_kv = H_q</text>
  <text x="20" y="190" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111" text-anchor="start">GQA</text>
  <rect x="40" y="205" width="210" height="60" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="145.0" y="229.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#111111" text-anchor="middle">Q:</text>
  <text x="145.0" y="251.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#111111" text-anchor="middle">(B, T_q, H_q, d_head)</text>
  <rect x="300" y="205" width="210" height="60" rx="6" fill="#0072B2" stroke="#D55E00" stroke-width="3"/>
  <text x="405.0" y="218.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">K:</text>
  <text x="405.0" y="240.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">(B, S, H_kv, d_head)</text>
  <text x="405.0" y="262.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">H_kv &lt; H_q</text>
  <rect x="560" y="205" width="210" height="60" rx="6" fill="#0072B2" stroke="#D55E00" stroke-width="3"/>
  <text x="665.0" y="218.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">V:</text>
  <text x="665.0" y="240.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">(B, S, H_kv, d_head)</text>
  <text x="665.0" y="262.0" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">H_kv &lt; H_q</text>
  <text x="40" y="305" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555555" text-anchor="start">Q&#x27;s shape never changes between MHA and GQA -- only K/V&#x27;s head axis (outlined in red) shrinks.</text>
  <text x="40" y="331" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#555555" text-anchor="start">Group size = H_q / H_kv (e.g. H_q=8, H_kv=2 -&gt; each K/V head serves a group of 4 query heads).</text>
</svg>
