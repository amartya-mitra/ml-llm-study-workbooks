<svg xmlns="http://www.w3.org/2000/svg" width="920" height="431" viewBox="0 0 920 431">
  <title>End-to-end decoder data flow</title>
  <defs><marker id="arrow-333333" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
  <rect x="0" y="0" width="920" height="431" fill="#ffffff"/>
  <rect x="20" y="60" width="110" height="70" rx="6" fill="#0072B2" stroke="#333333" stroke-width="2"/>
  <text x="75.0" y="99.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">tokens</text>
  <rect x="154" y="60" width="110" height="70" rx="6" fill="#0072B2" stroke="#333333" stroke-width="2"/>
  <text x="209.0" y="99.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">embeddings</text>
  <rect x="288" y="60" width="110" height="70" rx="6" fill="#E69F00" stroke="#333333" stroke-width="2"/>
  <text x="343.0" y="92.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">N x decoder</text>
  <text x="343.0" y="105.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">block</text>
  <rect x="422" y="60" width="110" height="70" rx="6" fill="#E69F00" stroke="#333333" stroke-width="2"/>
  <text x="477.0" y="99.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">final norm</text>
  <rect x="556" y="60" width="110" height="70" rx="6" fill="#E69F00" stroke="#333333" stroke-width="2"/>
  <text x="611.0" y="99.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">output head</text>
  <rect x="690" y="60" width="110" height="70" rx="6" fill="#E69F00" stroke="#333333" stroke-width="2"/>
  <text x="745.0" y="99.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">logits</text>
  <line x1="130" y1="95.0" x2="154" y2="95.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <line x1="264" y1="95.0" x2="288" y2="95.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <line x1="398" y1="95.0" x2="422" y2="95.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <line x1="532" y1="95.0" x2="556" y2="95.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <line x1="666" y1="95.0" x2="690" y2="95.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <path d="M 288,38 L 288,56 M 398,38 L 398,56" stroke="#333333" stroke-width="1" fill="none"/>
  <line x1="288" y1="38" x2="398" y2="38" stroke="#333333" stroke-width="1"/>
  <text x="343.0" y="32" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#555555" text-anchor="middle">same block, applied N times, each with its own weights</text>
  <line x1="745.0" y1="130" x2="745.0" y2="181" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <rect x="665.0" y="185" width="160" height="50" rx="6" fill="#E69F00" stroke="#333333" stroke-width="2"/>
  <text x="745.0" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle">softmax</text>
  <line x1="745.0" y1="235" x2="745.0" y2="271" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-333333)"/>
  <text x="20" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">next-token probability distribution over the whole vocabulary:</text>
