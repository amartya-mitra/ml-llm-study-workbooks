  <rect x="88" y="291.0" width="50" height="60.00000000000001" rx="6" fill="#D55E00" stroke="#333333" stroke-width="1.5"/>
  <text x="113.0" y="367" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">cat</text>
  <text x="113.0" y="287.0" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" fill="#555555" text-anchor="middle">0.62</text>
  <rect x="156" y="341.3225806451613" width="50" height="9.67741935483871" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="181.0" y="367" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">dog</text>
  <text x="181.0" y="337.3225806451613" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" fill="#555555" text-anchor="middle">0.10</text>
  <rect x="224" y="333.5806451612903" width="50" height="17.419354838709676" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="249.0" y="367" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">sat</text>
  <text x="249.0" y="329.5806451612903" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" fill="#555555" text-anchor="middle">0.18</text>
  <rect x="292" y="348.0967741935484" width="50" height="2.9032258064516125" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="317.0" y="367" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">runs</text>
  <text x="317.0" y="344.0967741935484" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" fill="#555555" text-anchor="middle">0.03</text>
  <rect x="360" y="349.06451612903226" width="50" height="1.9354838709677418" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="385.0" y="367" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="middle">...</text>
  <text x="385.0" y="345.06451612903226" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" fill="#555555" text-anchor="middle">0.02</text>
  <text x="438" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#555555" text-anchor="start">one token is
sampled/chosen
from this
distribution</text>
  <rect x="20" y="391" width="16" height="16" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="42" y="403" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">stored (tokens/embeddings/vocabulary scores)</text>
  <rect x="300" y="391" width="16" height="16" rx="6" fill="#E69F00" stroke="#333333" stroke-width="1.5"/>
  <text x="322" y="403" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111111" text-anchor="start">computation (a stage that transforms the vector)</text>
</svg>
