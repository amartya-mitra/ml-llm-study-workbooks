# Notation used consistently across every chapter of workbook 04.
# Rule (Stage 9): no memory formula anywhere in this workbook may be
# stated without pinning down every symbol below that it uses, plus the
# assumptions listed in `formula_assumption_checklist`. A chapter/example
# that uses a symbol not defined here is a bug, not a stylistic choice.

symbols:
  - symbol: "B"
    name: "batch size"
    meaning: "number of independent sequences processed together"
    unit: "count"
  - symbol: "S"
    name: "sequence length"
    meaning: "number of tokens RETAINED in the KV-cache (prompt length during prefill; grows by 1 per step during decode). Distinct from T_q, the number of query positions being processed in the current step."
    unit: "tokens"
  - symbol: "T_q"
    name: "query positions in the current step"
    meaning: "number of new positions a forward pass is computing queries for right now (T_q = S during prefill, since every prompt position is a new query position; T_q = 1 for an ordinary one-token decode step; T_q can exceed 1 for prefill chunking or speculative-decoding verification, both introduced in ch. 3 only as forward references)"
    unit: "tokens"
  - symbol: "d_model"
    name: "hidden dimension"
    meaning: "width of the residual stream"
    unit: "elements"
  - symbol: "V"
    name: "vocabulary size"
    meaning: "number of distinct token ids the tokenizer can produce; also the width of the output-head logit vector"
    unit: "count"
  - symbol: "d_ff"
    name: "feed-forward expansion dimension"
    meaning: "width of a feed-forward sublayer's hidden projection (plain MLP: d_model -> d_ff -> d_model; gated/SwiGLU MLP: two d_model -> d_ff branches plus one d_ff -> d_model output projection)"
    unit: "elements"
  - symbol: "H_q"
    name: "query heads"
    meaning: "number of attention query heads"
    unit: "count"
  - symbol: "H_kv"
    name: "key/value heads"
    meaning: "number of attention key/value heads (H_kv = H_q for MHA, H_kv = 1 for MQA, 1 < H_kv < H_q for GQA; MLA replaces this axis entirely with a compressed representation — see d_c/d_rope, ch. 4)"
    unit: "count"
  - symbol: "d_head"
    name: "head dimension"
    meaning: "width of each individual attention head, typically d_model / H_q"
    unit: "elements"
  - symbol: "d_c"
    name: "MLA KV compression dimension"
    meaning: "width of MLA's shared, jointly-compressed latent vector for keys and values (one latent per token per layer, not one per head); per [@src-27], DeepSeek-V2 sets d_c = 4 * d_head"
    unit: "elements"
  - symbol: "d_rope"
    name: "MLA decoupled rotary dimension"
    meaning: "per-head width of MLA's separately-retained rotary key/query component, needed because RoPE applied directly to the compressed latent would break matrix absorption (ch. 4); per [@src-27], DeepSeek-V2 sets d_rope = 0.5 * d_head, and the decoupled key is shared across heads (not per-head), unlike the decoupled queries"
    unit: "elements"
  - symbol: "L"
    name: "number of layers"
    meaning: "count of decoder blocks stacked"
    unit: "count"
  - symbol: "bytes_per_elem"
    name: "bytes per element"
    meaning: "storage width of one stored number (e.g. 2 for fp16/bf16, 1 for int8/fp8, 4 for fp32) — must be stated explicitly per calculation, never assumed"
    unit: "bytes"
  - symbol: "E"
    name: "expert count"
    meaning: "total number of ROUTED experts in a mixture-of-experts layer (excludes any always-active shared expert -- see p_s)"
    unit: "count"
  - symbol: "k"
    name: "selected experts per token"
    meaning: "number of routed experts a router activates for a given token (top-k)"
    unit: "count"
  - symbol: "p_e"
    name: "parameters per routed expert"
    meaning: "parameter count of one routed expert (assumed equal-sized across all E experts, for the simple presentation in ch. 5)"
    unit: "count"
  - symbol: "p_s"
    name: "shared-expert parameters"
    meaning: "parameter count of an always-active shared-expert path, if the architecture has one (p_s = 0 if there is no shared expert)"
    unit: "count"
  - symbol: "p_base"
    name: "non-expert (base) parameters"
    meaning: "every parameter outside the routed-expert bank and shared-expert path -- attention, embeddings, normalization, the router itself, and any other dense components. Always active regardless of routing."
    unit: "count"
  - symbol: "P_total"
    name: "total parameters"
    meaning: "every parameter in the model, whether or not it is activated for a given token"
    unit: "count"
  - symbol: "P_active"
    name: "active parameters"
    meaning: "parameters actually touched in the forward pass for a single token (relevant for MoE models; P_active = P_total for dense models)"
    unit: "count"
  - symbol: "KV_bytes"
    name: "KV-cache size"
    meaning: "total bytes occupied by the key/value cache for one sequence, per the formula in ch. 3"
    unit: "bytes"
  - symbol: "L_distinct"
    name: "distinct transformer blocks"
    meaning: "the number of DIFFERENT sets of block weights actually stored (ch. 8) -- distinct from L (ch. 1's total layer count), which for a looped stack counts distinct blocks, not block applications"
    unit: "count"
  - symbol: "T_passes"
    name: "passes through the shared block/stack"
    meaning: "how many times a looped architecture applies its L_distinct blocks to the (evolving) hidden state, for a fixed full-stack loop (ch. 8)"
    unit: "count"
  - symbol: "L_effective"
    name: "effective block applications"
    meaning: "L_effective = L_distinct * T_passes for a fixed full-stack loop (ch. 8) -- the quantity that governs compute (every application still runs), NOT the quantity that governs distinct block-parameter storage (L_distinct governs that)"
    unit: "count"

formula_assumption_checklist:
  - "Is this a per-token, per-sequence, or per-batch quantity? State which."
  - "What is B (concurrency/batch size assumed)? A single-sequence calculation should say B=1 explicitly, not omit B."
  - "What is S (sequence length assumed)? State whether this is the current length or a stated maximum."
  - "What is L (layer count)?"
  - "What is H_kv (or d_c/d_rope for MLA)? This is what actually varies across MHA/MQA/GQA/MLA — never state a cache formula using H_q where H_kv is meant, and never conflate H_kv's per-head-sharing axis with MLA's per-token-compression axis (ch. 4) — they are different mechanisms, not the same knob."
  - "What is d_head?"
  - "What is bytes_per_elem, and what numeric format does it correspond to (fp16/bf16/int8/fp8/fp32)?"
  - "Are both keys AND values counted (the standard KV-cache definition counts both, hence the factor of 2 in ch. 3's formula)? State explicitly if only one is being counted for some other reason."
  - "Is allocator/runtime overhead (e.g. PagedAttention-style page fragmentation, framework reservation) included, or is this a logical/theoretical minimum? Per AGENTS.md, logical memory estimates and measured runtime memory must never be presented as the same number."

worked_example_instantiation_rule: "Every worked example in this workbook must instantiate every symbol it uses with a concrete stated number before computing anything — no formula should appear with unbound symbols and then jump straight to a numeric answer."
