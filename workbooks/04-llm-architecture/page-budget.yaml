      notes: "Unchanged since Chapter 4 was added -- Chapter 5's ~11 subsection entries fit within the existing 2-page table of contents without pushing it further, and the notation table's 5 new symbols (E, k, p_e, p_s, p_base -- E and k already existed, only the p_* symbols are new) fit on the existing notation page."
