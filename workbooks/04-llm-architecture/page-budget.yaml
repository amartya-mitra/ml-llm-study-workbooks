      notes: "Unchanged since Chapter 3 was drafted; begins mid-page on page 45."
    - name: "answer_key_chapter_4"
      description: "Answer Key: Chapter 4 only"
      pages: 1.0
      notes: "Unchanged since Chapter 4 was drafted; begins mid-page on page 47."
    - name: "answer_key_chapter_5"
      description: "Answer Key: Chapter 5 only"
      pages: 0.69
      notes: "Begins mid-page on page 48 (no forced break), ends well before the bottom of the same page. Lands well UNDER the 0.75-page preferred budget (hard maximum was 1.0) -- the tightest answer key in the pilot, achieved with a minimal Answer/Common-trap structure (most items have no 'Common trap' field at all) appropriate for a chapter with only 8 check-your-understanding-derived answer items, the fewest of any chapter so far."
    - name: "build_note_and_bibliography"
      description: "Build and Version Note (with its Provenance subsection) plus the auto-appended Bibliography"
      pages: 2.1
      notes: "The build note ends and the Bibliography begins on page 48; Typst's native (citeproc:false) bibliography does not force its own fresh page -- it continues wherever the build note ends, spilling from page 48 through page 50 here. Grew slightly from Chapter 4's 1.8 pages because of one new Provenance bullet (Chapter 5's DeepSeekMoE sourcing note) and 4 new bibliography entries (sources 12-15)."
  pre_ch5_reference:
    total_pages: 44
    instructional_pages_ch1_ch2_ch3_ch4: 32
    total_words: 20375
    note: "Chapters 1-4 pilot actuals immediately before Chapter 5 was drafted (see reports/04_ch04_draft_report.md). Chapter 5 added exactly 6 pages (5 instructional + 0.69 answer-key + a ~0.3-page build-note/bibliography growth from the new source), taking the total from 44 to 50."

full_workbook_projection:
  preferred_total_pages: [60, 68]
  hard_ceiling_total_pages: 72
  hard_ceiling_note: "Exceeding 72 requires explicit approval. Page growth must come from adding chapters, not from ever shrinking fonts, figures, margins, or writing space."
  chapters_6_to_8_provisional:
    - chapter: 6
      topic: "Case studies (architecture at real-model scale)"
      instructional_pages: [5, 5.5]
      estimated_answer_key_pages: [1, 1.2]
    - chapter: 7
      topic: "Architecture -> systems consequences"
      instructional_pages: [5, 5.5]
      estimated_answer_key_pages: [1, 1.2]
    - chapter: 8
      topic: "Synthesis / practice chapter"
      instructional_pages: [4, 4.5]
      estimated_answer_key_pages: [1, 1]
  provisional_revision_note: "Chapter 5 landed at 5.69 total pages (5 instructional + 0.69 answer-key), UNDER even its own already-tight 5.75-7.8 provisional range from reports/04_ch04_draft_report.md -- the best-fitting chapter yet, alongside Chapter 3's exact preferred-budget hit. This is strong evidence the chapters_6_to_8_provisional ranges below (carried over unchanged from the post-Chapter-4 revision) are achievable without further tightening; they are NOT loosened back up despite the good news, since the point of a budget is to hold regardless of any one chapter's good outcome."
  estimated_answer_key_pages_basis: "Scaled from the pilot's observed ratio of answer-key pages to instructional pages across Chapters 1-5 (actual). Chapter 5's own ratio (0.69 answer-key page per 5 instructional pages, ~0.14) matches Chapter 4's efficient ~0.14 ratio -- both inform the chapters 6-8 estimates above, which remain deliberately conservative relative to this observed efficiency."
  projection_arithmetic:
    pilot_actual_total: 50
    chapters_6_to_8_instructional_range: [14, 15.5]
    chapters_6_to_8_answer_key_range: [3, 3.4]
    projected_full_total_range: [67, 68.9]
  ceiling_status: "Within the 72-page hard ceiling on both ends (67-68.9), and now also within the 60-68 PREFERRED range at the low end. This depends on chapters 6-8 actually holding to the provisional ranges above; Chapter 5's strong result is encouraging but not a license to relax them."

chapter_3_specific:
  mla_deferral_note: "RESOLVED (2026-09-23): MLA's placement, left open when Chapter 3 was drafted, is Chapter 4 -- see outline.yaml's ch3.drafting_note and ch4.drafting_note, and reports/04_ch04_draft_report.md."

chapter_4_specific:
  mla_sourcing_note: "Chapter 4's MLA content (compression formula, decoupled-RoPE reasoning, KV-cache-per-token comparison table) was verified directly against DeepSeek-V2's full paper text ([@src-27], arXiv:2405.04434, Sections 2.1.1-2.1.4 and Table 1), fetched and read in full during drafting -- not inferred from an abstract or a search-result snippet, per this chapter's Stage 12 instruction."
  recurrent_family_sourcing_gap: "Chapter 4 names recurrent/SSM/linear-attention as a third efficiency-strategy family (learning objective 9) but does not teach its mechanics and does not cite a primary source for it -- consistent with source-coverage.yaml's pre-existing source_needed flag for this mechanism (see reports/04_source_audit.md). This is an intentional, disclosed scope boundary, not an oversight."

chapter_5_specific:
  scope_reduction_note: "Chapter 5 was scoped down from outline.yaml's original 8-page/4-figure plan to 5 preferred pages and 3 figures -- see outline.yaml's ch5.drafting_note. Systems-level material (distributed-training implementation, collective-communication algorithms, kernel optimization, inference-engine configuration, expert quantization, model-specific benchmark comparisons, post-training, routing-research surveys) is entirely deferred, not taught even briefly, except for one architecture-level paragraph on expert parallelism's all-to-all communication."
  shared_experts_sourcing_note: "Chapter 5's shared-experts claim (motivation and compute tradeoff) was verified directly against DeepSeekMoE's full paper text ([@src-36], arXiv:2401.06066, fetched and read in full), not DeepSeek-V3's report (a downstream user of the idea) and not a snippet or blog summary. src-36 was newly added to sources/registry.yaml, shared/bibliography.bib, and source-coverage.yaml this session."
