chapter_3_specific:
  mla_deferral_note: "RESOLVED (2026-09-23): MLA's placement, left open when Chapter 3 was drafted, is Chapter 4 -- see outline.yaml's ch3.drafting_note and ch4.drafting_note, and reports/04_ch04_draft_report.md."

chapter_4_specific:
  mla_sourcing_note: "Chapter 4's MLA content (compression formula, decoupled-RoPE reasoning, KV-cache-per-token comparison table) was verified directly against DeepSeek-V2's full paper text ([@src-27], arXiv:2405.04434, Sections 2.1.1-2.1.4 and Table 1), fetched and read in full during drafting -- not inferred from an abstract or a search-result snippet, per this chapter's Stage 12 instruction."
  recurrent_family_sourcing_gap: "Chapter 4 names recurrent/SSM/linear-attention as a third efficiency-strategy family (learning objective 9) but does not teach its mechanics and does not cite a primary source for it -- consistent with source-coverage.yaml's pre-existing source_needed flag for this mechanism (see reports/04_source_audit.md). This is an intentional, disclosed scope boundary, not an oversight."

chapter_5_specific:
  scope_reduction_note: "Chapter 5 was scoped down from outline.yaml's original 8-page/4-figure plan to 5 preferred pages and 3 figures -- see outline.yaml's ch5.drafting_note. Systems-level material (distributed-training implementation, collective-communication algorithms, kernel optimization, inference-engine configuration, expert quantization, model-specific benchmark comparisons, post-training, routing-research surveys) is entirely deferred, not taught even briefly, except for one architecture-level paragraph on expert parallelism's all-to-all communication."
  shared_experts_sourcing_note: "Chapter 5's shared-experts claim (motivation and compute tradeoff) was verified directly against DeepSeekMoE's full paper text ([@src-36], arXiv:2401.06066, fetched and read in full), not DeepSeek-V3's report (a downstream user of the idea) and not a snippet or blog summary. src-36 was newly added to sources/registry.yaml, shared/bibliography.bib, and source-coverage.yaml this session."

chapter_6_specific:
  case_study_selection_note: "Chapter 6 selects exactly three case-study model families -- Llama 3 405B (dense, src-32), DeepSeek-V3 (MoE + MLA, src-33), and Jamba (hybrid attention/Mamba, src-35) -- dropping Mixtral entirely as a fourth main case study (it remains registered only as ch. 5-adjacent supporting material). See outline.yaml's ch6.drafting_note and reports/04_ch06_draft_report.md."
  mamba_sourcing_gap_resolved_note: "Chapter 4 (see chapter_4_specific.recurrent_family_sourcing_gap above) deliberately deferred teaching recurrent/SSM mechanics pending a primary source. Chapter 6 resolves that gap: Gu and Dao's Mamba paper (src-37, arXiv:2312.00752) was added to sources/registry.yaml, shared/bibliography.bib, and source-coverage.yaml, verified via full-text PDF extraction, and confirmed (via Jamba's own reference [17]) to be the exact mechanism Jamba's non-attention layers use -- not Mamba-2 or Gated DeltaNet, which are not treated as synonyms."
  model_verification_note: "All three case-study models' architecture facts (Llama 3 405B's Table 3/Section 3.2.1; DeepSeek-V3's Section 4.2; Jamba's full text plus its non-gated Hugging Face config.json) were verified this session by downloading the primary-source PDF and extracting its full text (pdftotext + grep), not by trusting a search snippet or a fetch tool's own summary -- consistent with this workbook's established sourcing standard. The Llama 3 405B config.json on Hugging Face is gated (HTTP 401) and was not used."
  page_budget_miss_note: "Chapter 6 landed at its 5-page instructional hard maximum (not the 4-page preferred target) and 0.67 answer-key pages (within the 0.75 hard maximum, over the 0.5 preferred target) -- both disclosed misses, not silent scope creep. See the chapter_6/answer_key_chapter_6 section notes above for what was tightened (table merge, prose trims, figure spacing) and reports/04_ch06_draft_report.md for the full account."

chapter_7_specific:
  scope_note: "Chapter 7 rescoped from a quantization/paging/continuous-batching answer-key table (the pre-existing outline.yaml plan) to a resource ledger, a prefill-vs-decode contrast, an architecture-to-systems consequence map (with a one-row looped-depth PREVIEW only), a minimal parallelism overview, and a two-model diagnosis exercise -- see outline.yaml's ch7.drafting_note and reports/04_ch07_draft_report.md."
  looped_depth_preview_note: "Chapter 7's looped-depth row is explicitly a preview, not a teaching -- full mechanism-level treatment (depth-wise weight sharing, distinct-vs-effective parameters, fixed vs. adaptive loop counts, KV-cache implications) is deferred to Chapter 8, per config/series-topic-roadmap.yaml. The chapter's own text and both its figures state this explicitly, not just this tracking file."
  mtp_speculative_decoding_scope_fence: "Chapter 7 adds only a short cross-reference stating that an MTP module MAY become an inference-time draft mechanism for speculative decoding -- neither mechanism is taught. Both are assigned to future workbooks (05 for MTP's training-time treatment, 06 for speculative decoding) per config/series-topic-roadmap.yaml, registered this session alongside 12 new sources (src-38 through src-49)."
  diagnosis_exercise_sourcing_note: "Chapter 7's two-model diagnosis exercise (Model A: dense GQA; Model B: MoE + MLA) reuses ch. 3's GQA KV-cache formula and ch. 4's MLA cache formula and ch. 5's total/active-parameter formula VERBATIM -- no new formula was derived for this chapter, per that day's drafting task's own instruction to avoid another long arithmetic derivation. Both models are hypothetical/illustrative, not a real model's published config."
  page_budget_result_note: "Chapter 7 landed at exactly its 4-page instructional PREFERRED target (not just the 5-page hard maximum) and 0.68 answer-key pages (within the 0.75 hard maximum, over the 0.5 preferred target, tightened once from an initial ~0.95-page draft) -- the best-fitting chapter since Chapter 5's exact preferred-budget hit. Two visual bugs (a figure canvas-width overflow; two internal-path-leakage occurrences in learner-facing prose) were found only by rendering every page to PNG and inspecting them, not by any automated test, and were fixed before this chapter was considered complete."

chapter_8_specific:
  scope_note: "Chapter 8 was rescoped from a no-new-concepts review/practice capstone (the pre-existing outline.yaml plan) to this workbook's primary_home for recurrent depth/looped transformers (config/series-topic-roadmap.yaml), plus a compact synthesis framework and cumulative design exercise -- see outline.yaml's ch8.drafting_note and reports/04_ch08_draft_report.md. This is the LAST content chapter of workbook 04."
  looped_depth_full_treatment_note: "Chapter 8 gives looped depth/recurrent depth its full mechanism-level treatment, resolving the deferral both Chapter 4 (taxonomy-only mention) and Chapter 7 (one-row systems preview) had disclosed. L_distinct/T_passes/L_effective notation was added to notation.yaml; three new glossary terms were added to glossary.yaml. Two verified examples were used, deliberately chosen for contrasting loop policies: Mixture-of-Recursions (src-40, a RESEARCH PROPOSAL with adaptive per-token routing) and Nanbeige4.2-3B (src-42, a RELEASED, OPEN-WEIGHT model with a FIXED two-pass loop) -- these are not treated as the same design."
  astra_uncertainty_note: "Per this session's explicit instruction, Chapter 8 includes a visible callout stating that public reporting has associated recurrent depth with 'GPT-6 Astra,' but that no official technical source confirms this architecture, and that this workbook does not treat that proprietary architecture as verified. This exact language is also verified present by an automated test (tests/test_ch08_worked_examples.py's test_astra_uncertainty_language_present)."
  mtp_bridge_note: "Chapter 8's MTP bridge (a short callout, not a full teaching) reuses src-43 (already verified in the series-topic-roadmap session) and explicitly distinguishes MTP (a training-time design choice) from the complete speculative-decoding algorithm (acceptance/rejection, lossless-distribution guarantees, draft-model scheduling) -- assigned to workbooks 5 and 6 respectively, per config/series-topic-roadmap.yaml. No new sources were needed for this bridge."
  worked_example_sourcing_note: "Chapter 8's looped-vs-unrolled-depth worked example (L_distinct=22, T_passes=2) deliberately matches Nanbeige4.2-3B's own reported loop policy (src-42) for the LOOP-COUNT numbers, but uses illustrative (not Nanbeige's own verified) per-block/non-block parameter-size assumptions for the complete-model-ratio calculation -- this distinction is stated explicitly in the chapter text and the worked-example script's own docstring, so the real, verified loop-policy fact is not conflated with the illustrative arithmetic built on top of it."
  page_budget_miss_note: "Chapter 8 landed at its 5-page instructional hard maximum (not the 4-page preferred target, matching Chapter 6's pattern rather than Chapter 7's) and 0.65 answer-key pages (within the 0.75 hard maximum, over the 0.5 preferred target) -- both disclosed misses, not silent scope creep. The answer key needed a substantial compression pass: the initial draft's design-exercise answer alone spilled across two pages (~1.3 pages total for the whole answer key) before being cut roughly in half. A list-rendering bug (an attempted two-column 10-question list collapsed into one confusing line under Typst) was found only by visual inspection and fixed by using a single ordered list instead."
  workbook_completion_note: "Chapter 8 is workbook 04's final content chapter. The complete-workbook actual is 68 pages (33,415 words), within the general 72-page hard ceiling, within this release's own tighter 70-page ceiling, and at the top of the 60-68 preferred range. See reports/04_release_candidate_report.md for the full completion record."
