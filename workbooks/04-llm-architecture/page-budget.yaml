    - name: "chapter_4"
      description: "Chapter 4: Reducing Attention Cost: Windows, Sparsity, and Latent KV Representations, instructional content only"
      pages: 7
      notes: "Unchanged since Chapter 4 was drafted -- still at its 7-page hard maximum (disclosed miss against the 6-page preferred target)."
    - name: "chapter_5"
      description: "Chapter 5: Mixture of Experts: More Parameters, Selective Compute, instructional content only"
      pages: 5
      notes: "Starts fresh on page 37 (deliberate break), ends at the bottom of page 41 -- lands EXACTLY at the 5-page PREFERRED budget (hard maximum was 6), the best-fitting chapter in the pilot so far. Achieved by scoping tightly to the task's explicit exclusions (no distributed-training implementation, collective-communication algorithms, kernel optimization, inference-engine configuration, expert quantization, model-specific benchmarks, post-training, or routing-research surveys) and combining the routing and expert-parallelism figures into one (Figure C) rather than two separate figures."
