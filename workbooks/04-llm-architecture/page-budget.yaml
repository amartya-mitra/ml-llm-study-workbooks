full_workbook_projection:
  preferred_total_pages: [60, 68]
  hard_ceiling_total_pages: 72
  hard_ceiling_note: "Exceeding 72 requires explicit approval. Page growth must come from adding chapters, not from ever shrinking fonts, figures, margins, or writing space. For this specific release candidate, an additional, TIGHTER 70-page ceiling also applies (see release_candidate_v1 below) -- both are satisfied."
  chapter_8_provisional: []
  status: "COMPLETE (2026-09-25): Chapter 8 was workbook 04's final content chapter. No chapters remain provisional -- 'pilot_actual' above is now the complete-workbook actual, not a projection. This section is retained for historical traceability of the projection process across Chapters 5-8, not as a live estimate."
  provisional_revision_note: "Chapter 7 landed at 4.68 total pages (4 instructional, exactly at its PREFERRED target, + 0.68 answer-key). Chapter 8 then landed at 5.65 total pages (5 instructional, at its hard maximum like Chapter 6, + 0.65 answer-key) -- within its own final provisional range (chapter_8_instructional_range/chapter_8_answer_key_range below, both hit at or under the stated hard ends)."
  estimated_answer_key_pages_basis: "Scaled from the pilot's observed ratio of answer-key pages to instructional pages across Chapters 1-7 (actual, before ch. 8 was drafted). Chapter 8's own actual ratio (0.65/5 = 0.13) landed within the range this basis predicted."
  projection_arithmetic:
    pilot_actual_total: 68
    chapter_8_instructional_range: [4, 5]
    chapter_8_actual_instructional: 5
    chapter_8_answer_key_range: [1, 1]
    chapter_8_actual_answer_key: 0.65
    projected_full_total_range: [67, 68]
    actual_full_total: 68
  ceiling_status: "ACTUAL complete-workbook total is 68 pages -- within the 72-page general hard ceiling, within this release candidate's own tighter 70-page ceiling, and at the top edge of (not exceeding) the 60-68 PREFERRED range. No further projection is needed; workbook 04's content is complete as of Chapter 8."

