# Stage 6 claim-level coverage matrix for workbook 04.
# Finer-grained than sources/coverage-matrix.yaml: that file maps
# SOURCES to chapters; this file maps individual CLAIMS to the sources
# that support them, so a gap or disagreement is visible at the claim
# level, not hidden inside a chapter-level "supported" label.
#
# status values:
#   supported            - a primary/official source directly backs this claim
#   partially_supported  - some part of the claim is backed; a specific
#                           detail (often a "which real model does this"
#                           specific) still needs a source
#   source_needed         - no primary source registered for this claim yet
#   disputed              - sources genuinely disagree; do not flatten
#   fast_changing         - the claim itself is fine, but its specific
#                           numbers/details are model/version-specific and
#                           will likely be superseded
#   excluded              - considered and deliberately left out of scope
#
# `importance`: "core" (the chapter doesn't work without this) or
# "supporting" (strengthens the chapter but isn't load-bearing).

claims:
  - chapter: "ch1"
    topic: "decoder-only next-token objective"
    proposed_claim: "A decoder-only model conditions each token's prediction only on preceding tokens, unlike an encoder-decoder or masked-LM objective."
    importance: "core"
    primary_source_ids: ["src-19"]
    explanatory_source_ids: ["src-14"]
    status: "supported"
    freshness_risk: "stable — this is a definitional claim about model class, not a fact about any specific model"
    notes: "No disagreement found across any source consulted."

  - chapter: "ch1"
    topic: "residual stream"
    proposed_claim: "Each sublayer adds an update to a shared residual stream rather than replacing it, which is why the stream's dimensionality is constant across a model's depth."
    importance: "core"
    primary_source_ids: ["src-19"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable"
    notes: ""

  - chapter: "ch1"
    topic: "scaled dot-product attention"
    proposed_claim: "Attention computes softmax(QK^T / sqrt(d_head)) V, with the sqrt(d_head) scaling specifically to control the dot product's variance before the softmax."
    importance: "core"
    primary_source_ids: ["src-19"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable"
    notes: ""

  - chapter: "ch2"
    topic: "RoPE mechanism"
    proposed_claim: "RoPE rotates query/key vectors by an angle proportional to position, so their dot product depends only on relative offset, not absolute position."
    importance: "core"
    primary_source_ids: ["src-22"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "the rotation mechanism itself is stable; specific long-context extrapolation tricks built on top of RoPE (e.g. base/theta rescaling, YaRN) are newer and more likely to change — scope ch. 2 to the base mechanism, flag extrapolation tricks as a separate, more time-sensitive topic if included at all"
    notes: ""

  - chapter: "ch2"
    topic: "RMSNorm mechanism"
    proposed_claim: "RMSNorm rescales by root-mean-square magnitude only, dropping both mean-centering and the learnable bias that LayerNorm has."
    importance: "core"
    primary_source_ids: ["src-23"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable"
    notes: "No independent secondary explanatory source was verified this session for this topic — a real, if minor, sourcing gap (see reports/04_source_audit.md)."

  - chapter: "ch2"
    topic: "SwiGLU / gated MLP"
    proposed_claim: "A SwiGLU feed-forward layer uses three weight matrices (vs. two for a plain MLP) and reports lower perplexity than ReLU/GELU MLPs at matched parameter count."
    importance: "core"
    primary_source_ids: ["src-24"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable — the mechanism and the original paper's reported numbers are fixed facts; do not restate the specific perplexity numbers as if they'd hold for a modern, much larger model without re-checking"
    notes: ""

  - chapter: "ch2"
    topic: "pre-norm vs. post-norm vs. sandwich-norm tradeoff"
    proposed_claim: "Pre-norm placement favors training stability at large depth at some cost to representational capacity; some modern models use a sandwich (pre+post) hybrid specifically to recover some of that capacity."
    importance: "core"
    primary_source_ids: ["src-19"]
    explanatory_source_ids: ["src-14"]
    status: "partially_supported"
    freshness_risk: "fast_changing for the 'which real model uses sandwich-norm' specific — src-14 names specific models but is itself an actively-updated source (last updated 2026-04-02 per its own page)"
    notes: "The general pre-norm-vs-post-norm training-stability tradeoff is well established (src-19 is post-norm; the stability motivation for pre-norm is widely documented). The SANDWICH-norm claim specifically still needs its own dedicated primary source (e.g. a specific model's technical report that states why it adopted sandwich-norm) rather than relying on src-14's secondary description alone — flagged as a partial gap, not fabricated, in reports/04_source_audit.md."

  - chapter: "ch2"
    topic: "tied vs. untied embeddings"
    proposed_claim: "Tying input and output embeddings halves that parameter cost; some models tie, some don't, as a deliberate tradeoff rather than a universal default."
    importance: "supporting"
    primary_source_ids: []
    explanatory_source_ids: ["src-14"]
    status: "source_needed"
    freshness_risk: "stable claim, but currently has no primary source of its own — it's a widespread convention rather than the subject of one canonical paper"
    notes: "Genuine gap: no primary source specifically registered for this. A specific model's config/report that explicitly states its tying choice and reasoning would resolve this before drafting ch. 2."

  - chapter: "ch3"
    topic: "MHA KV-cache size formula"
    proposed_claim: "KV-cache size = 2 (K and V) x n_layers x n_kv_heads x d_head x seq_len x batch x bytes_per_element, for standard multi-head attention."
    importance: "core"
    primary_source_ids: ["src-19", "src-10"]
    explanatory_source_ids: ["src-11"]
    status: "supported"
    freshness_risk: "stable — this is a derived arithmetic fact given a config, not a claim about any specific model's reported number"
    notes: "src-19 defines the head structure the formula is built from; src-10 is the source that actually derives and states the memory formula explicitly."

  - chapter: "ch3"
    topic: "MQA cache reduction"
    proposed_claim: "MQA shares a single K/V head across all query heads, minimizing KV-cache memory at some measured quality cost."
    importance: "core"
    primary_source_ids: ["src-20"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable"
    notes: ""

  - chapter: "ch3"
    topic: "GQA cache reduction and uptraining cost"
    proposed_claim: "GQA uses G key/value heads shared across H_q/G query heads; converting an existing MHA checkpoint to GQA via uptraining costs roughly 5% of the original pretraining compute, per the GQA paper's own reported figure."
    importance: "core"
    primary_source_ids: ["src-21"]
    explanatory_source_ids: ["src-14"]
    status: "supported"
    freshness_risk: "the ~5% uptraining figure is specific to the GQA paper's own experiments — state it as their reported number, not a universal constant"
    notes: ""

  - chapter: "ch3"
    topic: "MLA latent compression"
    proposed_claim: "MLA compresses keys/values into a shared low-rank latent per token, reconstructing per-head K/V at attention time, and DeepSeek-V2 reports this matches or exceeds standard MHA quality while shrinking the KV-cache."
    importance: "core"
    primary_source_ids: ["src-27"]
    explanatory_source_ids: ["src-14"]
    status: "supported"
    freshness_risk: "fast_changing — the specific quality/memory numbers are from DeepSeek-V2 (2024-05); DeepSeek-V3 (src-33) refines the same mechanism further, so state which model's specific numbers are being cited"
    notes: ""

  - chapter: "ch4"
    topic: "sliding-window attention receptive field and cache reduction"
    proposed_claim: "Mistral 7B's sliding-window attention (window=4096) with a rolling-buffer cache gives roughly an 8x cache reduction at 32K context versus full attention, per the paper's own reported figures."
    importance: "core"
    primary_source_ids: ["src-25"]
    explanatory_source_ids: ["src-14"]
    status: "supported"
    freshness_risk: "fast_changing — these are Mistral 7B's specific reported numbers at a specific context length, not a general law; restate with the model and context length named"
    notes: ""

  - chapter: "ch4"
    topic: "sparse attention pattern complexity"
    proposed_claim: "Strided/fixed sparse attention factorizations reduce attention cost from O(n^2) to O(n sqrt(n))."
    importance: "core"
    primary_source_ids: ["src-26"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable — this is the original paper's asymptotic complexity result, not a model-specific number"
    notes: ""

  - chapter: "ch4"
    topic: "linear/recurrent (SSM-style) attention mechanism itself"
    proposed_claim: "Linear/recurrent attention (the SSM-style family, e.g. Mamba) replaces softmax attention with a fixed-size recurrent state, trading unbounded-context compute for bounded per-step cost."
    importance: "core"
    primary_source_ids: []
    explanatory_source_ids: ["src-35"]
    status: "source_needed"
    freshness_risk: "the general tradeoff claim is well-established territory, but this workbook currently has NO primary source for the mechanism itself — only src-35 (Jamba), which USES Mamba layers but is not Mamba's own defining paper"
    notes: "Genuine, honestly-flagged gap: the Stage 4 research pass covered MQA/GQA/MLA/sparse/sliding-window but did not separately verify a primary source for Mamba/SSM itself (e.g. Gu & Dao, 'Mamba: Linear-Time Sequence Modeling with Selective State Spaces'). Per ch. 4's own scope fence (outline.md: intuition-level treatment, not a from-scratch SSM derivation), a full primary-source deep-dive may not be required — but if ch. 4 states any specific claim about HOW the recurrent state update works (not just that one exists), a primary source must be added first. Flagged, not silently resolved, in reports/04_source_audit.md."

  - chapter: "ch5"
    topic: "top-k MoE routing origin"
    proposed_claim: "Modern sparse MoE routing descends from noisy top-k gating over expert feed-forward networks, first proposed for sequence models by Shazeer et al. (2017)."
    importance: "core"
    primary_source_ids: ["src-28"]
    explanatory_source_ids: ["src-14"]
    status: "supported"
    freshness_risk: "stable — a lineage/history claim, not a current-model fact"
    notes: ""

  - chapter: "ch5"
    topic: "GShard top-2 routing and expert-parallel sharding"
    proposed_claim: "GShard adapts top-2 gating to Transformer MoE layers and defines lightweight sharding annotations letting a compiler auto-partition experts across devices, demonstrated at 2048 TPU v3 cores."
    importance: "core"
    primary_source_ids: ["src-29"]
    explanatory_source_ids: ["src-17"]
    status: "supported"
    freshness_risk: "the 2048-core figure is GShard's own 2020 demonstration scale, not a current maximum — state it as a historical data point"
    notes: ""

  - chapter: "ch5"
    topic: "Switch Transformer top-1 routing"
    proposed_claim: "Switch Transformer simplifies routing to top-1 (one expert per token) and reports stable trillion-parameter training in bfloat16."
    importance: "core"
    primary_source_ids: ["src-30"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable — a specific paper's reported training result, dated 2021-2022"
    notes: ""

  - chapter: "ch5"
    topic: "MoE load-balancing loss — the mechanism's exact form"
    proposed_claim: "'The' MoE load-balancing auxiliary loss."
    importance: "core"
    primary_source_ids: ["src-28", "src-29", "src-30", "src-33"]
    explanatory_source_ids: []
    status: "disputed"
    freshness_risk: "not a freshness risk — a genuine, standing mechanism-level disagreement, not something that will resolve with time"
    notes: "DO NOT state this claim as written above — there is no single 'the' loss. Four non-equivalent formulations exist: Shazeer 2017 (src-28, coefficient-of-variation-based importance + load losses), GShard (src-29, aux_loss = (1/E) sum_e (c_e/S) m_e), Switch Transformer (src-30, restated as alpha * N * sum_i f_i * P_i, the form most open codebases implement), and DeepSeek-V3 (src-33, explicitly auxiliary-loss-free instead). Ch. 5 must present this as an evolving design space with a genuine disagreement point, per AGENTS.md's 'preserve source disagreements' rule, not flatten it into one formula."

  - chapter: "ch5"
    topic: "active vs. total parameters"
    proposed_claim: "A MoE model's inference compute per token tracks active parameters (shared-expert params + k x per-expert params), while total parameters still determine most of the serving memory footprint."
    importance: "core"
    primary_source_ids: ["src-28", "src-33"]
    explanatory_source_ids: ["src-34"]
    status: "supported"
    freshness_risk: "stable claim; use src-33/src-34's specific active/total numbers only when citing those specific models"
    notes: ""

  - chapter: "ch5"
    topic: "expert parallelism as a systems consequence"
    proposed_claim: "Distributing experts across devices requires an all-to-all communication step to dispatch tokens to their selected experts and combine results back."
    importance: "core"
    primary_source_ids: ["src-29", "src-31"]
    explanatory_source_ids: ["src-17"]
    status: "supported"
    freshness_risk: "stable mechanism-level claim; src-29 frames it as a compiler/sharding abstraction, src-31 as an end-to-end training+inference system — cite whichever framing ch. 5/ch. 7 actually uses, not both interchangeably"
    notes: ""

  - chapter: "ch5"
    topic: "shared experts: motivation and compute tradeoff"
    proposed_claim: "Shared experts are always-active experts intended to capture common knowledge and reduce redundancy across routed experts; to hold total active compute constant, adding shared experts is compensated by reducing the number of routed experts activated per token."
    importance: "core"
    primary_source_ids: ["src-36"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable mechanism-level claim, dated to this paper's specific configs (2B/16B/145B) if those specific numbers are ever cited"
    notes: "Verified 2026-09-23 directly from the DeepSeekMoE paper's full HTML text (Section on shared-expert isolation), not a snippet -- see sources/registry.yaml src-36 and reports/04_ch05_draft_report.md. This is the architecture-defining source for shared experts, distinct from src-33 (DeepSeek-V3), which is a downstream user of the idea, not its origin."

  - chapter: "ch6"
    topic: "Llama 3 (dense case study)"
    proposed_claim: "Llama 3 405B is a 126-layer, 16384-hidden-dimension dense decoder-only Transformer with GQA (8 KV heads), RoPE (theta=500,000), and a 128K context window."
    importance: "core"
    primary_source_ids: ["src-32"]
    explanatory_source_ids: []
    status: "fast_changing"
    freshness_risk: "explicitly model-specific and dated (2024-07-31 report); state the date whenever this figure is cited, per AGENTS.md's time-sensitivity rule"
    notes: "Verified 2026-09-23 directly against the arXiv PDF's Table 3 and Section 3.2.1 (full-text extraction, not a search snippet) -- see sources/registry.yaml src-32. Normalization (RMSNorm) is cited as inherited unchanged from Llama 2 per the paper's own statement that only GQA and cross-document masking changed, not independently re-stated in this paper's text."

  - chapter: "ch6"
    topic: "DeepSeek-V3 (MoE + MLA case study)"
    proposed_claim: "DeepSeek-V3 has 671B total / 37B activated parameters, 61 layers, hidden dimension 7168, combines MLA (d_c=512, d_c'=1536, decoupled-RoPE dim 64) with DeepSeekMoE (1 shared + 256 routed experts, 8 activated) and an auxiliary-loss-free balancing strategy, trained on 14.8T tokens."
    importance: "core"
    primary_source_ids: ["src-33"]
    explanatory_source_ids: ["src-27"]
    status: "fast_changing"
    freshness_risk: "explicitly model-specific and dated (report submitted 2024-12-27, revised 2025-02-18); this single model is used to exemplify BOTH the MoE and MLA case-study slots — a deliberate scope choice, see reports/04_source_audit.md"
    notes: "Verified 2026-09-23 directly against the arXiv PDF's Section 4.2 'Hyper-Parameters' (full-text extraction, not a search snippet) -- see sources/registry.yaml src-33."

  - chapter: "ch6"
    topic: "Jamba (hybrid case study)"
    proposed_claim: "Jamba interleaves Transformer-attention and Mamba (selective-SSM) layers, with MoE applied every other layer; 12B active / 52B total parameters, GQA (32 query / 8 KV heads), no RoPE/positional embeddings, up to 256K context."
    importance: "core"
    primary_source_ids: ["src-35"]
    explanatory_source_ids: ["src-37"]
    status: "fast_changing"
    freshness_risk: "explicitly model-specific and dated (2024-03-28, updated 2024-07-03); a newer Jamba 1.5 report (arXiv:2408.12570) exists but was deliberately NOT selected -- see src-35's notes for the resolved rationale (prefer the architecture-defining original over a later scaled-up successor)"
    notes: "Verified 2026-09-23 directly against the arXiv PDF's full text plus the Jamba-v0.1 Hugging Face config.json (not gated) -- see sources/registry.yaml src-35. The recurrent (Mamba) mechanism itself is now sourced separately via src-37 (Gu & Dao), resolving the gap flagged in reports/04_source_audit.md; src-35 remains the source for Jamba's own architecture facts."

  - chapter: "ch6"
    topic: "Mamba selective state-space mechanism (explanatory source for the hybrid case study)"
    proposed_claim: "Mamba's selective SSM maintains a fixed-size recurrent state per layer, updated each token via input-dependent (selective) Delta, B, and C parameters -- contrasted with attention's linearly-growing KV-cache."
    importance: "core"
    primary_source_ids: ["src-37"]
    explanatory_source_ids: []
    status: "stable"
    freshness_risk: "the mechanism itself is a stable, published result (2023-12-01); only its use in specific downstream models (e.g. Jamba) is fast-changing"
    notes: "Verified 2026-09-23 directly against the arXiv PDF's full text (Section 3.2, full-text extraction, not a search snippet) -- see sources/registry.yaml src-37. This is the source ch. 6 needed before it could responsibly claim HOW Jamba's Mamba layers work; only enough of the mechanism is used to interpret Jamba's architecture, not a full derivation (out of scope per outline.md's non-goals)."

  - chapter: "ch6"
    topic: "Mixtral (supporting, simpler MoE example)"
    proposed_claim: "Mixtral has 46.7B total / 12.9B active parameters via top-2 routing over 8 experts, released under Apache 2.0."
    importance: "supporting"
    primary_source_ids: ["src-34"]
    explanatory_source_ids: []
    status: "fast_changing"
    freshness_risk: "explicitly model-specific and dated (2024-01-08)"
    notes: "Used as a simpler contrast point to DeepSeek-V3 in the case-study table or a worked exercise, not as a fifth main case-study model."

  - chapter: "ch7"
    topic: "quantization/paging/continuous batching do not change the architecture"
    proposed_claim: "Quantization, KV-cache paging, and continuous batching change measured memory/latency/throughput without changing the model's architecture graph."
    importance: "core"
    primary_source_ids: ["src-11", "src-12"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable — a definitional/conceptual claim, not tied to a specific model or benchmark number"
    notes: "Both primary sources for this claim were fully accessed this session (unlike src-16/src-17, whose bodies were not retrievable)."

  - chapter: "ch7"
    topic: "arithmetic intensity and the compute-bound vs. memory-bandwidth-bound distinction"
    proposed_claim: "A step's arithmetic intensity (FLOPs per byte moved) determines whether it is compute-bound or memory-bandwidth-bound; single-request decode is usually memory-bandwidth-bound."
    importance: "core"
    primary_source_ids: ["src-10"]
    explanatory_source_ids: ["src-11"]
    status: "supported"
    freshness_risk: "stable — a hardware-arithmetic argument, not a model-specific benchmark claim"
    notes: ""

  - chapter: "ch7"
    topic: "training communication volume depends on architecture (MoE all-to-all)"
    proposed_claim: "MoE layers incur an all-to-all communication step during training that dense models do not, making training communication volume an architecture-dependent quantity, not just a parallelism-strategy choice."
    importance: "core"
    primary_source_ids: ["src-29", "src-31"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable mechanism-level claim"
    notes: ""

  - chapter: "ch8"
    topic: "depth-wise weight sharing and adaptive per-position halting (Universal Transformer)"
    proposed_claim: "A looped transformer applies a shared transformation across positions and recurrent time-steps, and can add a dynamic per-position halting mechanism letting the model choose the number of refinement steps per symbol."
    importance: "core"
    primary_source_ids: ["src-38"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable -- a 2018 architecture-defining paper, not a fast-changing model-specific claim"
    notes: "Verified 2026-09-25 directly against the arXiv PDF's abstract and Section 1/2.1 (full-text extraction, not a search snippet) -- see sources/registry.yaml src-38."

  - chapter: "ch8"
    topic: "per-token recursion routing and KV-cache implications (Mixture-of-Recursions)"
    proposed_claim: "A router can assign dynamic per-token recursion depths (expert-choice or token-choice routing); dynamic-depth models face a KV-cache-consistency choice between 'recursion-wise caching' (only currently-selected tokens' keys are cached at that depth) and 'recursive sharing' -- these are different caching strategies with different memory consequences, not automatically resolved by weight sharing alone."
    importance: "core"
    primary_source_ids: ["src-40"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "stable mechanism-level claim (2025 paper); do not treat its reported throughput/FLOPs numbers as a general law for all looped architectures"
    notes: "Verified 2026-09-25 directly against the arXiv PDF's Section 2.2.2 'KV Caching Strategies: Recursion-wise Caching vs. Recursive Sharing' (full-text extraction) -- see sources/registry.yaml src-40. This is the primary source for ch. 8's KV-cache caveat specifically."

  - chapter: "ch8"
    topic: "a fixed (non-adaptive) loop count in a shipped, open-weight model (Nanbeige4.2-3B)"
    proposed_claim: "Nanbeige4.2-3B adopts a Looped Transformer architecture with a fixed two-pass loop over its layer stack, explicitly framed as improving effective depth/reasoning capacity under a fixed parameter budget -- a fixed loop count, not adaptive halting or per-token routing."
    importance: "core"
    primary_source_ids: ["src-42"]
    explanatory_source_ids: []
    status: "supported"
    freshness_risk: "explicitly model-specific and dated (arXiv v2, 2026-07-27); state the version whenever this figure is cited"
    notes: "Verified 2026-09-25 directly against the arXiv PDF's own text ('Nanbeige4.2-3B adopts a Looped Transformer architecture... A two-pass...') -- see sources/registry.yaml src-42. Used as ch. 8's fixed-loop-count example, contrasted with Mixture-of-Recursions' (src-40) adaptive per-token depth -- the two are not treated as the same design."

  - chapter: "ch8"
    topic: "MTP as a training-time objective, distinct from speculative decoding"
    proposed_claim: "Multi-token prediction (independent-heads or causal-chain design) is a training-time objective/module design; whether an MTP module is later repurposed as an inference-time speculative-decoding draft source is a separate, optional design choice, not implied by MTP alone."
    importance: "core"
    primary_source_ids: ["src-43"]
    explanatory_source_ids: ["src-49"]
    status: "supported"
    freshness_risk: "stable distinction; the specific claim that MTP 'can therefore remain a training-only objective or become part of the inference system' is src-49's own framing, attributed as such"
    notes: "Reuses src-43 (already verified in the series-topic-roadmap session, 2026-09-25) and src-49 (Raschka's MTP gallery page) -- this is the short bridge ch. 8 gives before pointing to workbooks 05/06, not a full teaching of either mechanism."

  - chapter: "ch8"
    topic: "GPT-6 Astra's architecture is unconfirmed"
    proposed_claim: "Public reporting has associated recurrent depth with a model referred to as 'GPT-6 Astra,' but no official technical source from that model's own developer confirms this architecture; the workbook treats it as unconfirmed, not verified fact."
    importance: "core"
    primary_source_ids: []
    explanatory_source_ids: ["src-46", "src-47"]
    status: "fast_changing"
    freshness_risk: "explicitly a standing caution about an unverified, evolving rumor -- must not be upgraded to a confirmed fact in any future revision without an official primary source"
    notes: "src-46/src-47 (Raschka, verified 2026-09-25 in the series-topic-roadmap session) themselves present this claim as third-party-reported speculation, not OpenAI's own disclosure. No primary source exists for this claim by design -- it is registered as explicitly unconfirmed, not as a sourcing gap to be closed."

removed_or_descoped_claims:
  - claim: "A full derivation of Mamba/SSM selective-state-space recurrence equations."
    reason: "Explicitly descoped in outline.md's non-goals: this workbook treats linear/recurrent attention at the intuition-and-tradeoff level, not the differential-equation level. Removing this avoids both a page-budget blowout and a sourcing gap the project would otherwise have to fully close (see the 'source_needed' entry above for the mechanism-level claim that IS in scope)."
  - claim: "A ranked 'best' attention variant or MoE routing scheme."
    reason: "Every source consulted (src-14 especially) presents these as tradeoffs against different constraints (memory, quality, implementation complexity), not a strict ordering. Stating a ranking would misrepresent the sources and contradicts AGENTS.md's 'preserve ambiguities' rule."
