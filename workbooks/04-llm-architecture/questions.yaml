  - id: "q-04-ch3-009"
    workbook: "04-llm-architecture"
    chapter: "attention-head-structure"
    topic: "Interview-style: why GQA reduces cache cost, and what it does not"
    difficulty: "stretch"
    question_type: "explanation"
    prompt: "Interview-style question: \"Walk me through why GQA reduces KV-cache cost, and tell me what it does not automatically make cheaper.\" What does a strong answer include, and what should it avoid?"
    expected_answer: "A strong answer: (1) names H_kv, not H_q, as the quantity GQA changes; (2) states the KV-cache formula's linear dependence on H_kv as the mechanism; (3) explicitly names what does not shrink proportionally -- P_Q/P_O (unchanged, since they depend on H_q), the number of query-side attention computations, and the complete attention block's total parameter count. A strong answer avoids stopping at 'GQA uses less memory' without naming what stays the same size."
    explanation: "Evaluation criteria: does the answer name the specific mechanism (linear dependence on H_kv) rather than a vague 'less memory' claim; does it proactively name at least one thing that does not shrink, rather than needing to be prompted for it?"
    common_wrong_answer: "A weak answer says only 'GQA uses less memory' without naming what specifically does not shrink -- a systems-flavored interviewer will very likely follow up asking exactly that."
