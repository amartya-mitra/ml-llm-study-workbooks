    difficulty: "stretch"
    question_type: "design"
    prompt: "A serving workload needs long contexts and high concurrency. Candidate model A uses MHA; candidate B uses GQA, both otherwise the same size and context length. Compare their per-sequence cache cost, then name at least one deployment factor besides cache memory that could still favor the MHA candidate."
    expected_answer: "At the same base size and context length S, the GQA candidate's per-sequence KV-cache is smaller by the ratio H_kv_GQA / H_q, which at high concurrency directly increases how many concurrent sequences fit in a fixed memory budget. But cache size is not the only factor: the MHA candidate could still win on task-specific quality if it was trained (not just uptrained) with full per-head representational capacity, or if the serving stack's support for GQA is less mature. A complete answer performs the actual ratio comparison and names a concrete non-cache factor."
    explanation: "This exercise applies the chapter's KV-cache formula to a comparative design decision, while resisting the temptation to treat cache size as the only variable that matters."
