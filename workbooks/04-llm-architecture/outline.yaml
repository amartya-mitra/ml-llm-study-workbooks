    prerequisites: ["ch1", "ch2", "ch3", "ch4", "ch5", "ch6", "ch7"]
    learning_objectives:
      - "Complete an architecture-comparison worksheet spanning every mechanism covered, unaided"
      - "Answer a cumulative set of design and misconception-diagnosis questions that require combining mechanisms from more than one chapter"
      - "Use the compact visual reference to reconstruct any single chapter's core diagram from memory"
    core_concepts:
      - "no new concepts — this chapter is explicitly a review/practice capstone"
    required_equations: []
    worked_examples:
      - "one cumulative worked example that chains: pick an attention variant (ch. 3) + a sparsity/hybrid choice (ch. 4) + dense-or-MoE (ch. 5), then compute both KV-cache size and active parameters for the composite config"
    planned_figures:
      - "compact visual reference sheet (one page, small multiples of every major diagram from ch. 1-7, redrawn at reference scale)"
    planned_tables:
      - "architecture comparison worksheet: blank grid the reader fills in for a new, unseen model, cross-referencing the case-study table's column headers from ch. 6"
    misconception_checks:
      - "cumulative: a mixed set drawing one misconception check from each of ch. 2-7, restated in a new scenario rather than repeated verbatim"
    short_questions:
      - "10-15 cumulative review questions spanning ch. 1-7 (full bank in question-plan.yaml)"
      - "6-10 interview-style questions spanning ch. 1-7 (full bank in question-plan.yaml)"
    applied_exercise: "Given a full, unseen model card, complete the architecture comparison worksheet end to end: attention variant, cache size, dense-or-MoE and active parameters, normalization/positional scheme, and one predicted systems consequence."
    interview_lens: "This chapter's cumulative questions are deliberately styled as a compressed mock interview loop over the whole workbook."
    primary_sources: []
    secondary_sources: ["src-14", "src-15"]
    estimated_pages: 6
