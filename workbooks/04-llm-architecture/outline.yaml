# Refined chapter blueprint for workbook 04 (Modern LLM Architecture).
# Human-readable rationale: workbooks/04-llm-architecture/outline.md
# Schema note: this file predates a formal schema (unlike
# shared/question-schema.yaml); its shape is documented here inline.
# `primary_sources`/`secondary_sources` all use sources/registry.yaml ids
# (src-NN). Every id below was resolved to a real registry entry during
# the Stage 4/5 source-discovery pass (src-19 through src-35 were added
# specifically for this workbook) — see reports/04_source_audit.md for
# how each was found and verified.

working_title: "Modern LLM Architecture: A Visual Guide to Attention, Memory, Sparsity, and Hybrid Models"
target_reader: "technically experienced ML practitioner or researcher; knows standard deep learning and linear algebra and the vanilla Transformer; not fluent yet in modern efficiency mechanisms (GQA, MLA, MoE routing, hybrid attention stacks)"
page_ceiling: 65
estimated_total_pages: 55  # ch3 revised 9 -> 8 pages when MLA was deferred out of it (2026-09-23); see ch3.drafting_note

chapters:
  - id: "ch1"
    number: 1
    title: "Transformer refresher"
    purpose: "Establish shared vocabulary and notation fast, without re-teaching deep learning basics the reader already has."
    prerequisites: []
    learning_objectives:
      - "State the decoder-only next-token objective and how it differs from encoder-decoder or masked-LM objectives"
      - "Trace one token's path through the residual stream across a full decoder block"
      - "Distinguish the prefill pass from a single autoregressive decode step at the level of what changes between them"
    core_concepts:
      - "decoder-only language modeling objective"
      - "residual stream as a shared read/write bus between blocks"
      - "attention block and MLP block as two different kinds of residual updates"
      - "normalization's role at a block boundary"
      - "positional information as a necessary addition to a permutation-invariant attention operation"
      - "prefill vs. autoregressive decode, at the definitional level (mechanics deferred to ch. 3)"
    required_equations:
      - "residual update: x_{l+1} = x_l + f(Norm(x_l)) for a generic sublayer f"
      - "scaled dot-product attention: softmax(QK^T / sqrt(d_head)) V"
    worked_examples:
      - "trace the tensor shape of a single token's residual-stream vector through one attention block and one MLP block, layer by layer"
    planned_figures:
      - "decoder block anatomy (residual stream with attention and MLP sublayers branching off and rejoining)"
      - "prefill vs. decode timeline (reused/extended from the existing kv_cache_demo.py bootstrap figure)"
    planned_tables:
      - "encoder-decoder vs. decoder-only vs. encoder-only: objective, typical use, whether this workbook covers it"
    misconception_checks:
      - "\"Attention needs no positional signal because it's already sequential\" — false; attention over a set of vectors is permutation-invariant without an explicit positional mechanism, unlike an RNN"
    short_questions:
      - "recall: what does the residual stream carry between blocks, and what changes it?"
      - "explanation: why is a decoder-only model's next-token objective different from a masked-LM objective in what it can be used for at inference time?"
    applied_exercise: "Given a toy config (d_model, n_layers, n_heads), compute the shape of every tensor along one token's path through one full block, by hand."
    interview_lens: "This chapter's material is the floor, not the ceiling, of what's expected in an ML architecture interview — treat it as calibration for whether the reader should skim or read closely."
    primary_sources: ["src-19"]
    secondary_sources: ["src-14"]
    estimated_pages: 4

  - id: "ch2"
    number: 2
    title: "Anatomy of a modern decoder"
    purpose: "Show precisely what changed between the 2017 Transformer and a 2025-2026 production decoder, and label each change as either an architectural convention or a load-bearing requirement."
    prerequisites: ["ch1"]
    learning_objectives:
      - "Derive RoPE's rotation and explain why it encodes relative rather than absolute position"
      - "Explain why RMSNorm removes the mean-centering step LayerNorm has, and what that buys/costs"
      - "Explain SwiGLU's gating mechanism and why gated MLPs need three weight matrices instead of two"
      - "Compare pre-norm, post-norm, and hybrid placements by their effect on gradient flow at initialization"
      - "State when tied input/output embeddings are and are not used, and why"
    core_concepts:
      - "RoPE (rotary positional embeddings) and why relative position falls out of a rotation"
      - "RMSNorm vs. LayerNorm"
      - "SwiGLU / gated feed-forward layers"
      - "pre-norm vs. post-norm vs. hybrid (sandwich) norm placement"
      - "tied vs. untied input/output embeddings"
      - "architectural convention vs. fundamental requirement — a recurring lens applied to every item above"
    required_equations:
      - "RoPE rotation applied to a query/key pair, 2D block form"
      - "RMSNorm: x / rms(x) * gamma (no mean subtraction, no bias)"
      - "SwiGLU: (Swish(xW1) * (xW3)) W2 — three matrices, not two"
    worked_examples:
      - "compute RMSNorm output by hand for a small 4-dimensional vector and compare against LayerNorm on the same vector"
      - "apply RoPE's rotation to a toy 2D query/key pair at two different positions and confirm the dot product depends only on relative offset"
    planned_figures:
      - "RoPE rotation of a query/key pair across positions (angle grows with position)"
      - "pre-norm vs. post-norm vs. sandwich-norm block diagrams, side by side"
      - "gated MLP (SwiGLU) data flow vs. a plain two-matrix MLP"
    planned_tables:
      - "RoPE vs. learned absolute positional embeddings vs. relative positional bias: what each encodes, extrapolation behavior, parameter cost"
      - "LayerNorm vs. RMSNorm: operations performed, parameter count, typical placement"
    misconception_checks:
      - "\"RMSNorm is just LayerNorm without the learnable bias\" — false; it also drops mean-centering, which is the more consequential difference"
      - "\"Pre-norm is strictly better than post-norm\" — false; pre-norm trades away some representational capacity/final-layer norm growth for training stability; some modern models use a sandwich hybrid specifically to recover some of that"
    short_questions:
      - "calculation: given a query/key pair and two position indices, apply RoPE's rotation and verify relative-position dependence"
      - "compare_and_contrast: RMSNorm vs. LayerNorm — what's removed, and what does removing it cost or save?"
      - "misconception_diagnosis: is pre-norm placement chosen for representational power or training stability?"
    applied_exercise: "Given a model's config file (hidden size, number of heads, MLP ratio), identify which of RoPE/RMSNorm/SwiGLU/tied-embeddings it uses, from its published architecture description, and justify each identification."
    interview_lens: "\"Why does {model} use RoPE instead of learned positional embeddings\" and \"walk me through what SwiGLU changes about the MLP\" are both real, common interview questions this chapter directly prepares for."
    primary_sources: ["src-22", "src-23", "src-24"]
    secondary_sources: ["src-14"]
    estimated_pages: 7

  - id: "ch3"
    number: 3
    title: "Attention head structure and cache-efficient variants"
    purpose: "Walk MHA -> MQA -> GQA as one progression along a single axis (how K/V heads are shared), building the KV-cache-size formula incrementally so it is derived once, where it is motivated, rather than repeated later."
    drafting_note: "As actually drafted (2026-09-23), this chapter covers MHA/MQA/GQA only. MLA was descoped from chapter 3 by the drafting task's explicit instruction (tighter 7-8 page budget than this file's original 9-page estimate, plus an explicit 'do not substantially teach MLA' constraint) -- see outline.md's 'Drafting-time adjustment' section and reports/04_ch03_draft_report.md for the full rationale. MLA's mechanism, formula, worked example, and figure (originally planned here) are preserved below under `deferred_content` rather than deleted, so no planning work is lost -- but MLA's future chapter placement is explicitly NOT yet decided and must be resolved before ch. 6 is drafted, not defaulted by omission."
    prerequisites: ["ch1", "ch2"]
    learning_objectives:
      - "Write the KV-cache memory formula for MHA and identify each term's origin"
      - "Derive how MQA and GQA each reduce that formula, and by what factor"
      - "State the quality/memory/implementation-complexity tradeoff for each variant, not just the memory number"
    core_concepts:
      - "multi-head attention (MHA) tensor shapes for Q, K, V and the resulting KV-cache"
      - "multi-query attention (MQA): one K/V head shared by all query heads"
      - "grouped-query attention (GQA): a middle ground, G key/value heads shared across H query heads"
      - "why KV-cache size, not just parameter count, is the quantity these mechanisms are optimizing"
    required_equations:
      - "KV-cache size (bytes) = 2 (K and V) x n_layers x n_kv_heads x d_head x seq_len x batch x bytes_per_element, stated with every assumption named (per Stage 9 notation rules)"
      - "GQA cache reduction factor relative to MHA: n_kv_heads / n_query_heads"
      - "attention projection parameter formulas (P_Q, P_K, P_V, P_O) and why only P_K/P_V shrink with H_kv"
    worked_examples:
      - "compute MHA KV-cache memory for a concrete config (matches example-plan.yaml's 'calculate MHA KV-cache memory')"
      - "recompute the same config under GQA and MQA and compare (matches 'recalculate with GQA', extended to MQA)"
      - "compare K/V projection parameter savings against the complete Q+K+V+O attention block (matches Stage 6 of the drafting task, not a pre-existing example-plan.yaml entry)"
    planned_figures:
      - "MHA vs. MQA vs. GQA head-sharing diagram (query heads fanning into shared K/V heads)"
      - "tensor-shape walkthrough: Q/K/V shapes at each stage for one config, MHA vs. GQA"
      - "KV-cache scaling comparison (MHA vs. GQA vs. MQA, bytes labeled directly)"
    planned_tables:
      - "MHA vs. MQA vs. GQA: query heads, KV heads, logical KV-cache size, K/V projection parameters, representation flexibility, implementation considerations, common motivation"
    misconception_checks:
      - "\"GQA reduces the number of query heads\" — false; H_q is unchanged, only H_kv changes"
      - "\"GQA just makes attention faster\" — false, or at least imprecise; GQA's primary win is KV-cache *memory* and the memory-bandwidth it takes to read that cache, not FLOPs, which barely change"
      - "\"Reducing KV heads reduces every attention FLOP by the same factor\" — false; query-side computation is untouched"
      - "\"The KV-cache formula gives exact observed GPU memory usage\" — false; it is a logical/theoretical minimum, excluding allocator overhead, fragmentation, and workspace buffers"
      - "\"MQA is universally superior because it uses the least cache\" — false; it is a tradeoff against representational flexibility, not a strict win"
    short_questions:
      - "calculation: KV-cache bytes for a stated MHA config"
      - "calculation: same config under GQA and MQA with a stated group size"
      - "misconception_diagnosis: does GQA primarily save FLOPs or memory bandwidth?"
      - "misconception_diagnosis: does GQA change the number of query heads?"
    applied_exercise: "Given a serving workload with long contexts and high concurrency, compare a candidate MHA model and a candidate GQA model, acknowledging cache memory is not the only deployment factor (matches the drafting task's Stage 11 design exercise; narrower than example-plan.yaml's original three-way MHA/GQA/MLA version, since MLA is deferred)."
    interview_lens: "KV-cache arithmetic under a stated attention variant is one of the most common 'do the math live' LLM systems-interview questions; this chapter is built to make that arithmetic automatic."
    primary_sources: ["src-20", "src-21"]
    secondary_sources: ["src-14", "src-10"]
    estimated_pages: 8
    deferred_content:
      note: "Preserved from the original ch3 plan, NOT drafted in this pass -- placement chapter TBD (see drafting_note above)."
      learning_objectives: ["Explain MLA's low-rank latent compression and why it is a different reduction mechanism than head-sharing"]
      core_concepts: ["multi-head latent attention (MLA): compress K/V into a shared low-rank latent, reconstruct per-head at attention time"]
      required_equations: ["MLA latent dimension vs. reconstructed per-head KV dimension, and where the compression ratio comes from"]
      worked_examples: ["recompute under MLA's stated latent dimension and compare against the GQA number on the same config (matches example-plan.yaml's 'compare GQA with MLA assumptions')"]
      planned_figures: ["MLA compression and reconstruction (latent vector in, per-head K/V out)"]
      misconception_checks: ["\"MLA is GQA with more groups\" — false; MLA compresses into a shared latent and reconstructs, a different mechanism than sharing whole K/V heads across query groups"]
      short_questions: ["compare_and_contrast: what does MLA compress that GQA does not?"]
      primary_sources: ["src-27"]

  - id: "ch4"
    number: 4
    title: "Restricting attention's reach"
    purpose: "Cover the orthogonal axis to chapter 3: not how K/V heads are shared, but which token positions are allowed to interact at all — from windowed/sparse patterns to replacing softmax attention with a different sequence-mixing primitive."
    prerequisites: ["ch1", "ch2", "ch3"]
    learning_objectives:
      - "Explain why a fixed attention window changes a layer's receptive field from global to local, and what recovers global context in practice (layer stacking, periodic global layers)"
      - "Distinguish a sparse attention *pattern* (still softmax attention, restricted connectivity) from a linear/recurrent alternative (a different mixing primitive entirely)"
      - "State, at an intuition level (not a derivation level), why linear/recurrent/SSM-style layers trade unbounded-context compute for a fixed-size recurrent state"
      - "Explain the motivation for a hybrid stack that interleaves attention types layer by layer"
    core_concepts:
      - "sliding-window attention and receptive field across layers"
      - "local/global mixtures (most layers windowed, some layers full attention)"
      - "sparse attention patterns beyond fixed windows (e.g. strided/block-sparse patterns)"
      - "linear attention and recurrent/SSM-style alternatives, at the tradeoff level: unbounded context vs. fixed-size state, and what that state can and cannot retain"
      - "hybrid attention stacks: why and where teams interleave attention types across layers"
    required_equations:
      - "receptive field after L stacked windowed layers of width w: L x w (informal but quantitative)"
    worked_examples:
      - "compare sliding-window vs. global receptive field for a stated window size and layer count (matches 'compare sliding-window and global receptive fields')"
    planned_figures:
      - "sliding-window vs. global attention connectivity pattern (which positions attend to which)"
      - "receptive field growth across stacked windowed layers"
      - "architecture-to-consequence map preview: local/global/linear layer choice vs. its systems effect (full map lands in ch. 7; this is the attention-specific slice)"
    planned_tables:
      - "sliding-window vs. sparse-pattern vs. linear/recurrent vs. hybrid: what each restricts or replaces, effective context handling, and one real model example each"
    misconception_checks:
      - "\"A model with sliding-window attention can't see beyond the window at all\" — false for most real models; periodic global layers or the accumulation of local context across stacked layers usually recovers a much larger effective receptive field"
      - "\"Linear attention is just a faster softmax attention\" — false; it is a different mixing primitive with a fixed-size state, not an optimized implementation of the same function"
    short_questions:
      - "calculation: receptive field after N stacked windowed layers"
      - "compare_and_contrast: sparse attention pattern vs. linear-attention layer — same goal, different mechanism"
      - "design: when would you choose a hybrid stack over a uniform one?"
    applied_exercise: "Given a described hybrid model's layer pattern (e.g. 1-in-N layers is global, rest are windowed or linear), compute the effective context reach and identify where a purely local model would fail that this pattern would not."
    interview_lens: "\"Why would you mix attention types across layers instead of using one type everywhere\" is a design-judgment question this chapter is built to answer, not just define terms for."
    primary_sources: ["src-25", "src-26"]
    secondary_sources: ["src-14", "src-15"]
    estimated_pages: 7

  - id: "ch5"
    number: 5
    title: "Mixture-of-experts models"
    purpose: "Explain sparse conditional computation as an orthogonal axis to everything in chapters 3-4: which parameters activate per token, not how attention is structured."
    prerequisites: ["ch1", "ch2"]
    learning_objectives:
      - "Contrast a dense feed-forward layer with a routed MoE layer at the level of what computation each token actually touches"
      - "Explain top-k router selection and compute active vs. total parameters for a stated MoE config"
      - "Explain why load balancing is necessary and what an auxiliary load-balancing loss is trying to prevent"
      - "State what a shared expert is for, and why expert parallelism is a natural consequence of this architecture, not an optional add-on"
    core_concepts:
      - "dense vs. sparse (routed) feed-forward layers"
      - "router and top-k expert selection per token"
      - "active parameters vs. total parameters"
      - "expert capacity and token dropping/overflow"
      - "load balancing and auxiliary losses"
      - "shared experts (always-active, alongside routed ones)"
      - "expert parallelism as a distribution strategy this architecture specifically enables"
    required_equations:
      - "active parameters per token = shared-expert params + k x (per-expert routed params), given top-k routing over E experts"
      - "router load-balancing auxiliary loss, at the definitional level (what it penalizes, not a from-scratch derivation)"
    worked_examples:
      - "calculate active MoE parameters per token for a stated (E experts, k selected, shared experts, per-expert size) config (matches example-plan.yaml)"
      - "reason about expert imbalance: given a skewed routing distribution, compute the effective utilization and the throughput consequence (matches 'reason about expert imbalance')"
    planned_figures:
      - "dense MLP vs. routed MoE layer, side by side"
      - "token-to-expert routing (a small batch of tokens, a router, top-k arrows into a subset of experts)"
      - "expert-parallel communication (all-to-all token dispatch/combine across devices)"
      - "active vs. total parameters bar comparison for two or three real MoE models"
    planned_tables:
      - "dense vs. MoE: total params, active params per token, training compute per token, serving memory footprint, one real model example each"
    misconception_checks:
      - "\"A MoE model with N total parameters costs as much to run as a dense N-parameter model\" — false; inference compute tracks active parameters, though serving memory still has to hold (most of) the total"
      - "\"Load balancing is only a training-time concern\" — mostly false in the way it matters for serving too: skewed routing at inference time still creates uneven load across expert-parallel devices"
    short_questions:
      - "calculation: active parameters per token for a stated MoE config"
      - "design: given a skewed router, what serving-side consequence follows, and what architectural or serving choice mitigates it?"
      - "misconception_diagnosis: does a MoE model's total parameter count predict its inference cost?"
    applied_exercise: "Given two model cards, one dense and one MoE with the same active-parameter count, predict which has the larger serving memory footprint and why, then check the reasoning against each model's published config."
    interview_lens: "\"Explain why a MoE model can have 8x the parameters of a dense model but not 8x the inference cost\" is close to a canonical MoE interview question this chapter directly targets."
    primary_sources: ["src-28", "src-29", "src-30", "src-33"]
    secondary_sources: ["src-14", "src-17", "src-31", "src-34"]
    estimated_pages: 8

  - id: "ch6"
    number: 6
    title: "Modern architecture case studies"
    purpose: "Apply every mechanism from chapters 2-5 to a small, defensible set of real, current models, comparing architecture choices rather than restating benchmark marketing."
    prerequisites: ["ch1", "ch2", "ch3", "ch4", "ch5"]
    learning_objectives:
      - "Read a real model's technical report or config and identify which attention variant, normalization, positional scheme, and (if any) MoE structure it uses"
      - "Compare at least one dense, one MoE, one MLA-based, and one hybrid/linear-attention model on architecture, not on leaderboard scores"
      - "Explain at least one instance where two similar-looking models made different architectural choices, and state the tradeoff each side implies"
    core_concepts:
      - "reading a model's published architecture description/config as a primary source"
      - "separating architecture facts (stated in a technical report) from benchmark claims (separately reported, separately time-sensitive)"
      - "a working definition of 'representative' used to justify which models were included and which were left out"
    required_equations: []
    worked_examples:
      - "for each of the four selected case-study models, compute that model's KV-cache size per token using the formula from ch. 3, from its published config"
    planned_figures:
      - "dense vs. MoE vs. MLA vs. hybrid architecture comparison (one compact diagram per model family, same visual grammar across all four for direct comparison)"
      - "architecture-to-training/inference consequence map, instantiated with the four case-study models as concrete points on the map (the general version of this map is ch. 7's; this is the worked instantiation)"
    planned_tables:
      - "case-study models x architecture dimensions: attention variant, KV heads/latent dim, normalization, positional scheme, dense/MoE, active/total params, publication date — every cell traceable to a specific primary-source section"
    misconception_checks:
      - "\"Newer always means better on every axis\" — false; case studies should surface at least one place where an older or simpler choice is still made deliberately in a current model, with the source's own stated reason"
    short_questions:
      - "compare_and_contrast: pick two case-study models with different attention variants and state the KV-cache consequence"
      - "design: given a new model's config excerpt not covered in the case studies, classify its attention variant and normalization from the config alone"
    applied_exercise: "Pick a current model not covered as a case study, find its official technical report or model card, and fill in one row of the case-study comparison table for it, citing the specific section used for each cell."
    interview_lens: "\"Compare {model A} and {model B}'s architecture\" is a direct, common interview prompt; this chapter's table is deliberately structured to be answerable in the same format live."
    primary_sources: ["src-32", "src-33", "src-35"]
    secondary_sources: ["src-14", "src-15", "src-27", "src-34"]
    estimated_pages: 8

  - id: "ch7"
    number: 7
    title: "From architecture to systems consequences"
    purpose: "Close the loop from mechanism to consequence: what an architectural choice does and does not change about training communication, inference memory bandwidth, and observed latency/throughput — without becoming a training-systems or inference-serving textbook."
    prerequisites: ["ch1", "ch2", "ch3", "ch5"]
    learning_objectives:
      - "State which serving-time techniques (quantization, paging/PagedAttention-style cache management, continuous batching) change measured memory/latency without changing the architecture itself, and why that distinction matters"
      - "Explain why training communication volume depends on architecture choices (e.g. MoE's all-to-all dispatch) in a way dense models don't incur"
      - "Explain why inference at small batch sizes is usually memory-bandwidth-bound, and why architectural FLOPs alone don't predict wall-clock latency"
      - "Distinguish latency from throughput as separate, sometimes-conflicting optimization targets"
    core_concepts:
      - "architecture vs. runtime: quantization, KV-cache paging, and continuous batching as things that change measured performance without changing what the model architecturally is"
      - "training communication volume as a function of architecture (MoE all-to-all, tensor/pipeline-parallel communication shape)"
      - "inference memory bandwidth as the usual bottleneck at low batch size/decode time"
      - "latency vs. throughput as distinct targets"
      - "why theoretical FLOPs are necessary but not sufficient to predict wall-clock behavior"
    required_equations:
      - "arithmetic intensity sketch: FLOPs per byte moved, as the quantity that determines whether a step is compute-bound or memory-bandwidth-bound"
    worked_examples:
      - "for one ch. 6 case-study model, classify one prefill step and one decode step as compute-bound or memory-bandwidth-bound, and justify with the arithmetic-intensity sketch"
    planned_figures:
      - "architecture-to-training/inference consequence map (general version; ch. 6 shows this map instantiated on specific models)"
      - "prefill (compute-bound) vs. decode (bandwidth-bound) intensity comparison"
    planned_tables:
      - "technique x layer: quantization / paging / continuous batching x {changes architecture? changes measured latency? changes measured memory?} — a direct answer key to the architecture-vs-runtime distinction"
    misconception_checks:
      - "\"Quantizing a model changes its architecture\" — false; it changes numerical precision of stored/computed values, not the architecture graph itself — worth stating explicitly since the two are often conflated in casual discussion"
      - "\"A model with fewer FLOPs per token is always faster in production\" — false when the smaller-FLOPs model is more memory-bandwidth-bound than the alternative; wall-clock latency depends on which resource is the bottleneck"
    short_questions:
      - "misconception_diagnosis: does INT8 quantization change a model's architecture?"
      - "explanation: why is single-request decode usually memory-bandwidth-bound rather than compute-bound?"
      - "design: given a latency-sensitive vs. a throughput-sensitive serving scenario, which architectural knobs (from ch. 3-5) would you prioritize differently?"
    applied_exercise: "Given a stated batch size, sequence length, and model config, estimate whether a decode step is compute-bound or memory-bandwidth-bound using the arithmetic-intensity sketch, and state what would have to change to flip the answer."
    interview_lens: "\"Why doesn't halving FLOPs halve latency\" and \"what's the difference between what quantization changes and what a smaller model changes\" are both real systems-interview questions this chapter is built to answer without requiring inference-engineering depth."
    primary_sources: ["src-10", "src-11"]
    secondary_sources: ["src-12"]
    estimated_pages: 7

  - id: "ch8"
    number: 8
    title: "Synthesis and practice"
