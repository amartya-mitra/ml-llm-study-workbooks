# Refined chapter blueprint for workbook 04 (Modern LLM Architecture).
# Human-readable rationale: workbooks/04-llm-architecture/outline.md
# Schema note: this file predates a formal schema (unlike
# shared/question-schema.yaml); its shape is documented here inline.
# `primary_sources`/`secondary_sources` all use sources/registry.yaml ids
# (src-NN). Every id below was resolved to a real registry entry during
# the Stage 4/5 source-discovery pass (src-19 through src-35 were added
# specifically for this workbook) — see reports/04_source_audit.md for
# how each was found and verified.

working_title: "Modern LLM Architecture: A Visual Guide to Attention, Memory, Sparsity, and Hybrid Models"
target_reader: "technically experienced ML practitioner or researcher; knows standard deep learning and linear algebra and the vanilla Transformer; not fluent yet in modern efficiency mechanisms (GQA, MLA, MoE routing, hybrid attention stacks)"
page_ceiling: 65
estimated_total_pages: 47  # ch3 9->8 (MLA deferred out); ch4 7->6 (retitled, MLA absorbed); ch5 8->5 (scoped down, systems depth deferred); ch6 8->4 (rescoped to 3 case studies + reading checklist); all 2026-09-23, see ch3/ch4/ch5/ch6 drafting_note fields

chapters:
  - id: "ch1"
    number: 1
    title: "Transformer refresher"
    purpose: "Establish shared vocabulary and notation fast, without re-teaching deep learning basics the reader already has."
    prerequisites: []
    learning_objectives:
      - "State the decoder-only next-token objective and how it differs from encoder-decoder or masked-LM objectives"
      - "Trace one token's path through the residual stream across a full decoder block"
      - "Distinguish the prefill pass from a single autoregressive decode step at the level of what changes between them"
    core_concepts:
      - "decoder-only language modeling objective"
      - "residual stream as a shared read/write bus between blocks"
      - "attention block and MLP block as two different kinds of residual updates"
      - "normalization's role at a block boundary"
      - "positional information as a necessary addition to a permutation-invariant attention operation"
      - "prefill vs. autoregressive decode, at the definitional level (mechanics deferred to ch. 3)"
    required_equations:
      - "residual update: x_{l+1} = x_l + f(Norm(x_l)) for a generic sublayer f"
      - "scaled dot-product attention: softmax(QK^T / sqrt(d_head)) V"
    worked_examples:
      - "trace the tensor shape of a single token's residual-stream vector through one attention block and one MLP block, layer by layer"
    planned_figures:
      - "decoder block anatomy (residual stream with attention and MLP sublayers branching off and rejoining)"
      - "prefill vs. decode timeline (reused/extended from the existing kv_cache_demo.py bootstrap figure)"
    planned_tables:
      - "encoder-decoder vs. decoder-only vs. encoder-only: objective, typical use, whether this workbook covers it"
    misconception_checks:
      - "\"Attention needs no positional signal because it's already sequential\" — false; attention over a set of vectors is permutation-invariant without an explicit positional mechanism, unlike an RNN"
    short_questions:
      - "recall: what does the residual stream carry between blocks, and what changes it?"
      - "explanation: why is a decoder-only model's next-token objective different from a masked-LM objective in what it can be used for at inference time?"
    applied_exercise: "Given a toy config (d_model, n_layers, n_heads), compute the shape of every tensor along one token's path through one full block, by hand."
    interview_lens: "This chapter's material is the floor, not the ceiling, of what's expected in an ML architecture interview — treat it as calibration for whether the reader should skim or read closely."
    primary_sources: ["src-19"]
    secondary_sources: ["src-14"]
    estimated_pages: 4

  - id: "ch2"
    number: 2
    title: "Anatomy of a modern decoder"
    purpose: "Show precisely what changed between the 2017 Transformer and a 2025-2026 production decoder, and label each change as either an architectural convention or a load-bearing requirement."
    prerequisites: ["ch1"]
    learning_objectives:
      - "Derive RoPE's rotation and explain why it encodes relative rather than absolute position"
      - "Explain why RMSNorm removes the mean-centering step LayerNorm has, and what that buys/costs"
      - "Explain SwiGLU's gating mechanism and why gated MLPs need three weight matrices instead of two"
      - "Compare pre-norm, post-norm, and hybrid placements by their effect on gradient flow at initialization"
      - "State when tied input/output embeddings are and are not used, and why"
    core_concepts:
      - "RoPE (rotary positional embeddings) and why relative position falls out of a rotation"
      - "RMSNorm vs. LayerNorm"
      - "SwiGLU / gated feed-forward layers"
      - "pre-norm vs. post-norm vs. hybrid (sandwich) norm placement"
      - "tied vs. untied input/output embeddings"
      - "architectural convention vs. fundamental requirement — a recurring lens applied to every item above"
    required_equations:
      - "RoPE rotation applied to a query/key pair, 2D block form"
      - "RMSNorm: x / rms(x) * gamma (no mean subtraction, no bias)"
      - "SwiGLU: (Swish(xW1) * (xW3)) W2 — three matrices, not two"
    worked_examples:
      - "compute RMSNorm output by hand for a small 4-dimensional vector and compare against LayerNorm on the same vector"
      - "apply RoPE's rotation to a toy 2D query/key pair at two different positions and confirm the dot product depends only on relative offset"
    planned_figures:
      - "RoPE rotation of a query/key pair across positions (angle grows with position)"
      - "pre-norm vs. post-norm vs. sandwich-norm block diagrams, side by side"
      - "gated MLP (SwiGLU) data flow vs. a plain two-matrix MLP"
    planned_tables:
      - "RoPE vs. learned absolute positional embeddings vs. relative positional bias: what each encodes, extrapolation behavior, parameter cost"
      - "LayerNorm vs. RMSNorm: operations performed, parameter count, typical placement"
    misconception_checks:
      - "\"RMSNorm is just LayerNorm without the learnable bias\" — false; it also drops mean-centering, which is the more consequential difference"
      - "\"Pre-norm is strictly better than post-norm\" — false; pre-norm trades away some representational capacity/final-layer norm growth for training stability; some modern models use a sandwich hybrid specifically to recover some of that"
    short_questions:
      - "calculation: given a query/key pair and two position indices, apply RoPE's rotation and verify relative-position dependence"
      - "compare_and_contrast: RMSNorm vs. LayerNorm — what's removed, and what does removing it cost or save?"
      - "misconception_diagnosis: is pre-norm placement chosen for representational power or training stability?"
    applied_exercise: "Given a model's config file (hidden size, number of heads, MLP ratio), identify which of RoPE/RMSNorm/SwiGLU/tied-embeddings it uses, from its published architecture description, and justify each identification."
    interview_lens: "\"Why does {model} use RoPE instead of learned positional embeddings\" and \"walk me through what SwiGLU changes about the MLP\" are both real, common interview questions this chapter directly prepares for."
    primary_sources: ["src-22", "src-23", "src-24"]
    secondary_sources: ["src-14"]
    estimated_pages: 7

  - id: "ch3"
    number: 3
    title: "Attention head structure and cache-efficient variants"
    purpose: "Walk MHA -> MQA -> GQA as one progression along a single axis (how K/V heads are shared), building the KV-cache-size formula incrementally so it is derived once, where it is motivated, rather than repeated later."
    drafting_note: "As actually drafted (2026-09-23), this chapter covers MHA/MQA/GQA only. MLA was descoped from chapter 3 by the drafting task's explicit instruction (tighter 7-8 page budget than this file's original 9-page estimate, plus an explicit 'do not substantially teach MLA' constraint) -- see outline.md's 'Drafting-time adjustment' section. RESOLVED (2026-09-23, same day): MLA's placement is chapter 4, drafted immediately after this chapter -- see ch4's own drafting_note below and reports/04_ch04_draft_report.md. MLA's learning objective, core concept, equation, worked example, figure, misconception, and question that were previously held here under a `deferred_content` block have all been moved into ch4's entry below; this chapter's plan no longer carries a deferred_content block."
    prerequisites: ["ch1", "ch2"]
    learning_objectives:
      - "Write the KV-cache memory formula for MHA and identify each term's origin"
      - "Derive how MQA and GQA each reduce that formula, and by what factor"
      - "State the quality/memory/implementation-complexity tradeoff for each variant, not just the memory number"
    core_concepts:
      - "multi-head attention (MHA) tensor shapes for Q, K, V and the resulting KV-cache"
      - "multi-query attention (MQA): one K/V head shared by all query heads"
      - "grouped-query attention (GQA): a middle ground, G key/value heads shared across H query heads"
      - "why KV-cache size, not just parameter count, is the quantity these mechanisms are optimizing"
    required_equations:
      - "KV-cache size (bytes) = 2 (K and V) x n_layers x n_kv_heads x d_head x seq_len x batch x bytes_per_element, stated with every assumption named (per Stage 9 notation rules)"
      - "GQA cache reduction factor relative to MHA: n_kv_heads / n_query_heads"
      - "attention projection parameter formulas (P_Q, P_K, P_V, P_O) and why only P_K/P_V shrink with H_kv"
    worked_examples:
      - "compute MHA KV-cache memory for a concrete config (matches example-plan.yaml's 'calculate MHA KV-cache memory')"
      - "recompute the same config under GQA and MQA and compare (matches 'recalculate with GQA', extended to MQA)"
      - "compare K/V projection parameter savings against the complete Q+K+V+O attention block (matches Stage 6 of the drafting task, not a pre-existing example-plan.yaml entry)"
    planned_figures:
      - "MHA vs. MQA vs. GQA head-sharing diagram (query heads fanning into shared K/V heads)"
      - "tensor-shape walkthrough: Q/K/V shapes at each stage for one config, MHA vs. GQA"
      - "KV-cache scaling comparison (MHA vs. GQA vs. MQA, bytes labeled directly)"
    planned_tables:
      - "MHA vs. MQA vs. GQA: query heads, KV heads, logical KV-cache size, K/V projection parameters, representation flexibility, implementation considerations, common motivation"
    misconception_checks:
      - "\"GQA reduces the number of query heads\" — false; H_q is unchanged, only H_kv changes"
      - "\"GQA just makes attention faster\" — false, or at least imprecise; GQA's primary win is KV-cache *memory* and the memory-bandwidth it takes to read that cache, not FLOPs, which barely change"
      - "\"Reducing KV heads reduces every attention FLOP by the same factor\" — false; query-side computation is untouched"
      - "\"The KV-cache formula gives exact observed GPU memory usage\" — false; it is a logical/theoretical minimum, excluding allocator overhead, fragmentation, and workspace buffers"
      - "\"MQA is universally superior because it uses the least cache\" — false; it is a tradeoff against representational flexibility, not a strict win"
    short_questions:
      - "calculation: KV-cache bytes for a stated MHA config"
      - "calculation: same config under GQA and MQA with a stated group size"
      - "misconception_diagnosis: does GQA primarily save FLOPs or memory bandwidth?"
      - "misconception_diagnosis: does GQA change the number of query heads?"
    applied_exercise: "Given a serving workload with long contexts and high concurrency, compare a candidate MHA model and a candidate GQA model, acknowledging cache memory is not the only deployment factor (matches the drafting task's Stage 11 design exercise; narrower than example-plan.yaml's original three-way MHA/GQA/MLA version, since MLA is deferred)."
    interview_lens: "KV-cache arithmetic under a stated attention variant is one of the most common 'do the math live' LLM systems-interview questions; this chapter is built to make that arithmetic automatic."
    primary_sources: ["src-20", "src-21"]
    secondary_sources: ["src-14", "src-10"]
    estimated_pages: 8

  - id: "ch4"
    number: 4
    title: "Reducing attention cost: windows, sparsity, and latent KV representations"
    drafting_note: "RESOLVED (2026-09-23): this chapter absorbs MLA from chapter 3's former deferred_content block, per this task's explicit Stage 1 instruction ('MLA belongs in Chapter 4'). The chapter is reorganized around three non-interchangeable efficiency strategies (see purpose) rather than the previous 'restricting attention's reach' framing, which covered only strategy 1 plus a deeper hybrid-stack-motivation discussion that this revision compresses to fit MLA in the same page budget. See reports/04_ch04_draft_report.md."
    purpose: "Teach three genuinely different strategies for reducing attention's cost as a decoder's context grows, and teach explicitly that they solve different problems and are not interchangeable: (1) attend to fewer positions (sliding/local windows, sparse patterns, local+global mixtures), (2) store a smaller representation per retained position (MLA), (3) replace or summarize growing attention state entirely (recurrent/SSM/linear-attention -- taxonomy and forward reference only, mechanics deferred for lack of adequate primary sourcing)."
    prerequisites: ["ch1", "ch2", "ch3"]
    learning_objectives:
      - "Explain why full causal attention grows expensive with retained sequence length, and distinguish score-matrix complexity, KV-cache storage, total model FLOPs, wall-clock latency, memory bandwidth, and temporary workspace as six different quantities"
      - "Distinguish reducing attended positions (strategy 1) from reducing stored bytes per position (strategy 2) as orthogonal axes"
      - "Draw sliding-window attention's receptive field across multiple stacked layers"
      - "Explain why sparse attention does not automatically imply a smaller KV cache"
      - "Explain the conceptual purpose of global tokens or occasional global layers"
      - "Compare GQA and MLA structurally: GQA shares K/V heads (same representation, fewer copies); MLA compresses the representation retained for each token (a different representation entirely)"
      - "Identify what a DeepSeek-style MLA cache retains at a conceptual level, including why a separately-retained rotary component is needed"
      - "Explain why an optimized MLA implementation need not explicitly reconstruct full K and V tensors during every decode step (matrix absorption), without claiming every implementation uses the same kernel strategy"
      - "Recognize recurrent/linear-state alternatives as a third design family without claiming this chapter teaches their full mechanics"
    core_concepts:
      - "full attention's O(S^2) score-matrix cost vs. its O(S) (linear) KV-cache storage -- two different growth curves, not one"
      - "sliding-window attention and receptive field across stacked layers; strict windowed retention can bound cache growth, but implementations may still retain more state"
      - "local+global mixtures: occasional global layers, selected global tokens, alternating patterns"
      - "sparse attention patterns: sparsity restricts which query-key pairs are SCORED, which does not automatically mean less is CACHED"
      - "multi-head latent attention (MLA): low-rank joint compression of K and V into one shared latent per token, plus a separately-retained decoupled rotary component, per DeepSeek-V2 ([@src-27])"
      - "matrix absorption: why an optimized MLA implementation can fold the latent-to-key/value up-projections into query/output-side projections instead of reconstructing full K/V, and why RoPE applied naively would break this"
      - "recurrent/SSM/linear-attention as a third family (fixed-size state replacing an ever-growing cache) -- taxonomy level only, mechanics not taught (source_needed gap, per reports/04_source_audit.md)"
    required_equations:
      - "receptive field after L stacked windowed layers of width w: L x w (informal but quantitative, reused from the prior ch4 plan)"
      - "MLA logical cache: M_MLA = B * S * L * (d_c + d_rope) * bytes_per_elem, compared against ch. 3's M_KV = 2 * B * S * L * H_kv * d_head * bytes_per_elem -- different cached representations, numerically comparable only for an explicitly defined architecture"
    worked_examples:
      - "compare sliding-window vs. global receptive field for a stated window size and layer count (matches example-plan.yaml's 'compare sliding-window and global receptive fields')"
      - "one script-backed comparison of a conventional GQA cache against a simplified MLA-style latent cache on the same base config, using DeepSeek-V2's own reported d_c=4*d_head, d_rope=0.5*d_head ratio ([@src-27] Table 1: MLA's cache is equal to GQA at 2.25 groups) -- supersedes example-plan.yaml's original three-way 'compare GQA with MLA assumptions' entry (that entry assumed invented d_latent numbers; this uses the primary source's own stated ratio instead)"
    planned_figures:
      - "three efficiency strategies, one figure, three panels: (1) full vs. local/sparse connectivity, (2) full K/V vs. latent representation per retained token, (3) growing token history vs. fixed-size/recurrent state -- establishing the three strategies are different axes, without teaching SSM mechanics in panel 3"
      - "sliding-window receptive field: direct attention windows plus multi-layer information propagation, distinguishing direct from indirect access"
      - "MLA cache pathway: layer input -> compression -> cached latent (+ separately retained rotary component) -> attention-compatible use during decode, distinguishing the always-true conceptual derivation from the optional, implementation-dependent matrix-absorption optimization"
    planned_tables:
      - "full attention vs. sliding-window vs. generic sparse vs. GQA vs. MLA vs. recurrent/linear-state: changes connectivity?, changes stored representation?, can bound retained history?, preserves direct access to every prior token?, primary memory benefit, primary compute benefit, principal tradeoff -- qualified entries (yes/no/pattern-dependent/implementation-dependent), no forced binaries"
    misconception_checks:
      - "\"Sparse attention automatically means a proportionally smaller KV cache\" — false; sparsity restricts which pairs are scored, not necessarily what must stay cached for a possible future query"
      - "\"MLA is just GQA with fewer KV heads\" — false; GQA shares whole K/V heads (same representation, fewer copies), MLA compresses to a different, smaller joint representation entirely"
    short_questions:
      - "quick check: what grows quadratically (score matrix) vs. linearly (KV-cache) as retained context grows?"
      - "quick check: why must a separately-retained rotary component exist alongside MLA's compressed latent?"
      - "quick check: does an optimized MLA implementation have to reconstruct full K/V tensors every decode step?"
      - "misconception_diagnosis: does a sliding window mean information older than W tokens can never affect the current representation?"
      - "misconception_diagnosis: does compressing the cache by 4x make decoding 4x faster?"
      - "calculation: GQA cache vs. MLA-style latent cache for a stated shared base config"
    applied_exercise: "Select an architectural strategy for a workload requiring long context, high concurrency, and occasional retrieval of very old tokens; explain why a pure sliding window may be insufficient and what combination of mechanisms could help (matches the drafting task's Stage 11 design exercise)."
    interview_lens: "\"Compare GQA, sliding-window attention, and MLA -- what resource does each primarily reduce, and what does each give up or complicate?\" is a direct, comparative systems question this chapter is built to answer without collapsing the three into one axis."
    primary_sources: ["src-25", "src-26", "src-27"]
    secondary_sources: ["src-14", "src-15"]
    estimated_pages: 6

  - id: "ch5"
    number: 5
    title: "Mixture of experts: more parameters, selective compute"
    drafting_note: "SCOPED DOWN (2026-09-23) from the original plan: figures 6->3 (dropped 'expert-parallel communication' as its own figure -- folded into figure C alongside routing -- and dropped the real-model active-vs-total bar chart, since Stage 1 of the drafting task excludes model-specific benchmark comparisons); estimated_pages 8->5, matching the drafting task's tighter 5-preferred/6-hard-maximum instructional budget. Expert parallelism is covered only as a brief, architecture-level consequence (Stage 9), not the systems-level treatment the original plan implied -- collective-communication algorithms, kernel optimization, inference-engine configuration, expert quantization, model-specific benchmark comparisons, post-training, and routing-research surveys are all explicitly out of scope for this chapter (deferred to workbook 05/06 or a future revision). See reports/04_ch05_draft_report.md."
    purpose: "Explain sparse conditional computation as an orthogonal axis to everything in chapters 3-4: which parameters activate per token, not how attention is structured. Central lesson: total parameters, active parameters, compute, and distributed communication are four separate quantities, not restatements of each other."
    prerequisites: ["ch1", "ch2"]
    learning_objectives:
      - "Distinguish a dense feed-forward block from a sparse MoE block"
      - "Explain the roles of the router, experts, top-k selection, routing weights, and optional shared experts"
      - "Calculate total expert parameters and active expert parameters for a stated config"
      - "Explain why active expert parameters are not the same as total active model parameters"
      - "Explain why sparse activation does not mean unused expert weights disappear from memory"
      - "Describe load imbalance and expert-capacity constraints, and what a load-balancing loss is trying to prevent without guaranteeing balance"
      - "Distinguish MoE sparsity (which parameters activate) from sparse attention (ch. 4's which positions are scored)"
      - "Explain why expert parallelism introduces device-to-device communication, at the architecture-consequence level only"
      - "Compare model capacity, computation, memory footprint, and communication as four separate quantities"
    core_concepts:
      - "dense vs. sparse (routed) feed-forward layers"
      - "router, top-k expert selection, routing weights, and expert outputs, per token"
      - "total vs. active parameters, at both the routed-expert-bank level and the complete-model level -- E/k is not the whole-model total/active ratio"
      - "expert capacity, overflow/token-dropping, and load imbalance, at the implementation-dependent level"
      - "load-balancing auxiliary losses: what they penalize, without claiming they guarantee balanced routing"
      - "shared experts (always-active alongside routed ones): motivation and compute tradeoff"
      - "expert parallelism as an unavoidable architectural consequence (brief, architecture-level only; systems depth deferred)"
    required_equations:
      - "router: r = W_r x, p = softmax(r), T(x) = TopK(p, k); combined output y(x) = sum over e in T(x) of alpha_e(x) * Expert_e(x)"
      - "routed-expert-bank total = E * p_e, active per token = k * p_e; with a shared-expert path, total expert-related = E*p_e + p_s, active = k*p_e + p_s; complete-model total = p_base + E*p_e + p_s, active = p_base + k*p_e + p_s"
    worked_examples:
      - "script-backed toy parameter example (E=8, k=2, p_e=100M, p_s=100M, p_base=1.2B): total/active for the routed-expert bank and for the complete model, showing E/k=4 does NOT imply a 4x whole-model total/active ratio"
      - "tiny routing-imbalance example: a small batch of tokens, top-1 or top-2 assignments, counts per expert vs. nominal balanced load"
    planned_figures:
      - "dense FFN vs. sparse MoE, same input tokens in both panels, router/top-k/recombination shown, explicit that MoE replaces the feed-forward sublayer, not attention"
      - "total vs. active parameters: dense/base, full routed-expert bank, selected experts, optional shared expert, distinguishing stored/active-for-this-token/inactive-for-this-token"
      - "routing and expert parallelism combined: tokens assigned across experts/devices, one imbalanced pattern, token dispatch/return flow -- not a detailed networking diagram"
    planned_tables:
      - "dense FFN vs. routed MoE vs. MoE with shared experts: expert paths per token, total parameters, active parameters, routing required, load-balancing concern, distributed communication, principal benefit, principal complication -- qualified language, no 'MoE automatically means lower latency/better quality' claims"
    misconception_checks:
      - "\"A 64-expert top-2 MoE activates only 2/64 of the whole model\" — false; only the routed-expert bank's ratio, not the whole model's, since attention/embeddings/norms/router/(shared experts) stay active"
      - "\"Inactive experts consume no memory\" — false; unused-this-token expert weights are still stored and must fit in memory"
    short_questions:
      - "quick check x3: dense-vs-MoE distinction; why active != total model active; MoE sparsity vs. sparse attention (ch. 4)"
      - "misconception_diagnosis x2: the two required boxed misconceptions above, each with a paired quiz item"
      - "calculation: total/active expert parameters for a stated config"
      - "design: routing/load-imbalance exercise given a small skewed batch"
    applied_exercise: "Design exercise applying the total/active/compute/communication distinction to a stated serving scenario."
    interview_lens: "\"A model has 64 experts and activates 2 per token. Explain what that tells you -- and what it does not tell you -- about parameters, FLOPs, memory, and communication.\""
    primary_sources: ["src-28", "src-29", "src-30", "src-36"]
    secondary_sources: ["src-14", "src-31"]
    estimated_pages: 5

  - id: "ch6"
    number: 6
    title: "Reading modern LLM architectures: three designs, three sets of tradeoffs"
    drafting_note: "SCOPED DOWN and RESELECTED (2026-09-23) from the original plan per that day's drafting task: case-study count 4->3 (Mixtral dropped entirely as a main case study, kept only as a ch. 5-adjacent supporting reference elsewhere -- see source-coverage.yaml); figures kept at 2 but redefined as (A) three architecture cards in one consistent visual grammar and (B) a qualitative tradeoff map with labeled regions, not fabricated numeric coordinates; the worked exercise changed from 'compute each real case-study model's KV-cache size' to a single compact reading exercise over a 4th, HYPOTHETICAL model config, so it teaches architecture-reading judgment rather than repeating ch. 3's cache-size calculation a fourth time; estimated_pages 8->4 (5 hard maximum), matching the drafting task's page contract. This chapter also newly organizes around an explicit 10-question architecture-reading checklist (Stage 4 of that task) rather than an implicit comparison. DISCLOSED MISS: the chapter landed at exactly 5 instructional pages (the hard maximum, not the 4-page preferred target) and ~0.67 answer-key pages (within the 0.75 hard maximum, over the 0.5 preferred target) -- two figures, one merged architecture-ledger table, three equal-space case studies, and a hypothetical-config exercise did not compress further without sacrificing legibility or cutting a required element; see reports/04_ch06_draft_report.md."
    purpose: "Apply every mechanism from chapters 2-5 to a small, defensible set of real, well-documented model families, comparing architecture choices rather than restating benchmark marketing or a release-history timeline."
    prerequisites: ["ch1", "ch2", "ch3", "ch4", "ch5"]
    learning_objectives:
      - "Apply a compact, repeatable checklist to read a real model's technical report or config and identify its block structure, normalization, position representation, sequence-mixing mechanism, head counts, FFN type, and (if MoE) expert counts"
      - "Compare one dense, one sparse-MoE-with-compressed-KV, and one hybrid-attention model on architecture alone, not on leaderboard scores"
      - "State what cannot be inferred about a model's quality, latency, or cost from its architecture alone"
    core_concepts:
      - "reading a model's published architecture description/config as a primary source, using a fixed checklist rather than an ad hoc scan"
      - "separating architecture facts (stated in a technical report, comparatively stable) from benchmark claims (separately reported, separately time-sensitive, not covered here)"
      - "a working definition of 'representative' used to justify which three model families were included and which were left out"
    required_equations: []
    worked_examples:
      - "apply the chapter's 10-question checklist to a 4th, unnamed hypothetical model config, identifying GQA group size, which state grows with context, active-vs-total expert distinction, and which conclusions cannot be drawn from the config alone"
    planned_figures:
      - "three architecture cards (dense baseline, sparse MoE + compressed KV, hybrid attention/recurrent) in one consistent visual grammar, marking cache-relevant state and active-vs-inactive components per model"
      - "a qualitative tradeoff map placing the three architectures on labeled axes (dense vs. sparse params; full vs. compressed/recurrent state; uniform vs. hybrid layer pattern) -- ordinal placement only, no fabricated numeric coordinates"
    planned_tables:
      - "case-study models x architecture-ledger dimensions: exact version/date, params (total/active), depth, hidden dim, normalization, positional mechanism, head counts, sequence-mixing pattern, FFN type, expert counts, documented context length, cache-relevant state, principal tradeoff -- every cell traceable to a specific primary-source section, 'not applicable'/'not reported' used rather than guessed"
    misconception_checks:
      - "\"A more sophisticated architecture is necessarily a better model\" — false; quality depends on architecture, data, training recipe, optimization, evaluation, and serving implementation together, not architecture alone"
    short_questions:
      - "recall: read a stated attention/KV-head configuration and classify it as MHA/GQA/MQA or MLA-style"
      - "recall: read a stated expert configuration and state the active-vs-total expert distinction"
      - "compare_and_contrast: pick two case-study models with different sequence-mixing mechanisms and state what state each one carries forward across a growing context"
      - "misconception_diagnosis: is a more sophisticated architecture necessarily a better model?"
      - "design: given the chapter's hypothetical 4th model config, identify its GQA group size and state one conclusion that cannot be drawn from the config alone"
      - "interview-style: given a model configuration and technical report, walk through how to predict its memory, compute, and communication bottlenecks without overclaiming benchmark performance"
