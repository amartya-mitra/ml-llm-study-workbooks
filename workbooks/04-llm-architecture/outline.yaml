    misconception_checks:
      - "\"Quantizing a model changes its architecture\" — false; it changes numerical precision of stored/computed values, not the architecture graph itself — worth stating explicitly since the two are often conflated in casual discussion"
      - "\"A model with fewer FLOPs per token is always faster in production\" — false when the smaller-FLOPs model is more memory-bandwidth-bound than the alternative; wall-clock latency depends on which resource is the bottleneck"
    short_questions:
