  - id: "ch7"
    number: 7
    title: "From architecture to systems consequences"
    purpose: "Close the loop from mechanism to consequence: what an architectural choice does and does not change about training communication, inference memory bandwidth, and observed latency/throughput — without becoming a training-systems or inference-serving textbook."
    prerequisites: ["ch1", "ch2", "ch3", "ch5"]
    learning_objectives:
      - "State which serving-time techniques (quantization, paging/PagedAttention-style cache management, continuous batching) change measured memory/latency without changing the architecture itself, and why that distinction matters"
      - "Explain why training communication volume depends on architecture choices (e.g. MoE's all-to-all dispatch) in a way dense models don't incur"
      - "Explain why inference at small batch sizes is usually memory-bandwidth-bound, and why architectural FLOPs alone don't predict wall-clock latency"
      - "Distinguish latency from throughput as separate, sometimes-conflicting optimization targets"
    core_concepts:
      - "architecture vs. runtime: quantization, KV-cache paging, and continuous batching as things that change measured performance without changing what the model architecturally is"
      - "training communication volume as a function of architecture (MoE all-to-all, tensor/pipeline-parallel communication shape)"
      - "inference memory bandwidth as the usual bottleneck at low batch size/decode time"
      - "latency vs. throughput as distinct targets"
      - "why theoretical FLOPs are necessary but not sufficient to predict wall-clock behavior"
    required_equations:
      - "arithmetic intensity sketch: FLOPs per byte moved, as the quantity that determines whether a step is compute-bound or memory-bandwidth-bound"
    worked_examples:
      - "for one ch. 6 case-study model, classify one prefill step and one decode step as compute-bound or memory-bandwidth-bound, and justify with the arithmetic-intensity sketch"
