# Chapter contract for Workbook 06, Chapter 2 ("KV-Cache Memory: Capacity, Paging, Prefix Reuse, and Eviction").
# Validated by scripts/validate_chapter_contract.py against
# shared/chapter-contract-schema.yaml. Created at scaffolding
# (2026-10-28) from reports/06_llm_inference_scope_and_source_decision.md.
#
# identity.status must exactly match config/chapter-status-registry.yaml's
# entry for workbooks."06-llm-inference".chapters."02". The drafting skill
# (.claude/skills/draft-workbook-chapter/) extends allowed_paths with the
# chapter's worked-example and figure files when it drafts them.

identity:
  workbook: "06-llm-inference"
  chapter: "02"
  title: "KV-Cache Memory: Capacity, Paging, Prefix Reuse, and Eviction"
  status: "scaffold_only"

scope:
  allowed_paths:
    - "workbooks/06-llm-inference/chapters/02-kv-cache-memory.qmd"
    - "workbooks/06-llm-inference/solutions/02-kv-cache-memory-solutions.qmd"
    - "workbooks/06-llm-inference/questions.yaml"
    - "workbooks/06-llm-inference/claim-ledger.yaml"
    - "workbooks/06-llm-inference/figure-plan.yaml"
  frozen_paths:
    - "workbooks/06-llm-inference/chapters/0[134567]-*.qmd"
    - "workbooks/06-llm-inference/solutions/0[134567]-*-solutions.qmd"
    - "workbooks/04-llm-architecture/**"
    - "workbooks/05-llm-training/**"
    - "workbooks/addendum-04-05-tsfm/**"
  canonical_output_allowed: false
  release_output_allowed: false
  push_allowed: false

sources:
  # Planned chapter-level mapping only (approved scope), not claim-level
  # evidence: each mechanism claim still needs its passage read and a
  # claim-ledger entry when drafted.
  required_source_ids: ["src-73", "src-77", "src-82", "src-10"]
  full_text_required: true
  evidence_locators_required: true
  # src-82 behaviour is vLLM v0.32.0 only. Rolling-buffer eviction would need src-25 re-read first (web-search-verified only).

content:
  required_sections:
    - "Learning objectives"
    - "Why this matters"
    - "Mental model or analogy"
    - "Visual overview"
    - "Technical core"
    - "Worked example"
    - "Compare and contrast"
    - "Check your understanding"
    - "Applied exercise"
    - "Interview lens"
    - "Chapter recap"
    - "Sources and further reading"
    - "Answer Key"
  question_count: 5
  answer_count: 5
  worked_example_count_minimum: 1
  figure_count_minimum: 1

worked_examples:
  structured_output_required: true
  prose_crosscheck_required: true
  units_required: true

figures:
  semantic_tests_required: true
  numeric_source_of_truth_required: true

learner_facing:
  forbid_source_ids: true
  forbid_repo_paths: true
  forbid_implementation_filenames: true
  forbid_revision_history: true
  require_scope_qualification: true

acceptance:
