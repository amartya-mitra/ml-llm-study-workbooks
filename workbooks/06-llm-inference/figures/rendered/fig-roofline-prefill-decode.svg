  <text x="106.57142857142857" y="227.3212949800877" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#0072B2" text-anchor="end">B=1</text>
  <text x="252.8571428571429" y="149.325910199721" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#0072B2" text-anchor="end">B=16</text>
  <text x="326.0" y="110.32821780953768" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#0072B2" text-anchor="end">B=64</text>
  <text x="399.14285714285717" y="71.3305254193543" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#0072B2" text-anchor="end">B=256</text>
  <text x="443.7142857142857" y="90.9049400265497" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#0072B2" text-anchor="middle">B=512</text>
  <text x="122.57142857142857" y="251.3212949800877" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D55E00" text-anchor="start">attention, 32 KV heads (same point as B=1)</text>
  <text x="195.71428571428572" y="212.32360258990437" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D55E00" text-anchor="start">attention, 8 KV heads</text>
