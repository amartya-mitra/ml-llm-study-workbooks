  <text x="513.0374386416431" y="90.9049400265497" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#E69F00" text-anchor="middle">prefill linear</text>
  <rect x="84" y="44" width="232" height="52" fill="#ffffff" opacity="0.92"/>
  <circle cx="92.00" cy="54.00" r="5" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/>
  <text x="102" y="58" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">decode linear layers (B sequences)</text>
  <circle cx="92.00" cy="70.00" r="5" fill="#D55E00" stroke="#ffffff" stroke-width="1.2"/>
  <text x="102" y="74" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">decode attention (any batch)</text>
  <circle cx="92.00" cy="86.00" r="5" fill="#E69F00" stroke="#ffffff" stroke-width="1.2"/>
