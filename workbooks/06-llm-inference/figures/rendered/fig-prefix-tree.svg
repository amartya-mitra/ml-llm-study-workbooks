<svg xmlns="http://www.w3.org/2000/svg" width="620" height="372" viewBox="0 0 620 372">
  <title>Radix-tree prefix reuse versus full-block hashing</title>
  <defs></defs>
  <rect x="0" y="0" width="620" height="372" fill="#ffffff"/>
  <text x="310.0" y="18" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">Shared prefixes stored once: radix tree vs full-block hashing (toy)</text>
  <circle id="radix-root" cx="34" cy="111.5" r="7" fill="#111111"/>
  <text x="34" y="133.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="middle">root</text>
  <line x1="41.00" y1="111.50" x2="62.00" y2="111.50" stroke="#444444" stroke-width="1.3"/>
  <rect id="node-0" x="62" y="91.5" width="180" height="40" rx="5" fill="#0072B2" fill-opacity="0.25" stroke="#0072B2" stroke-width="1.5" data-ref="2" data-evictable="false"/>
  <text x="68" y="107.5" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">&lt;s&gt; You are a helpful bot</text>
  <text x="68" y="123.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">ref 2</text>
  <line x1="242.00" y1="111.50" x2="262.00" y2="74.00" stroke="#444444" stroke-width="1.3"/>
  <rect id="node-1" x="262" y="54.0" width="158" height="40" rx="5" fill="#ffffff" fill-opacity="1" stroke="#111111" stroke-width="1.5" data-ref="1" data-evictable="false"/>
  <text x="268" y="70" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">Summarize this   (C, running)</text>
  <text x="268" y="86" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">ref 1</text>
  <line x1="242.00" y1="111.50" x2="262.00" y2="149.00" stroke="#444444" stroke-width="1.3"/>
  <rect id="node-2" x="262" y="129.0" width="158" height="40" rx="5" fill="#ffffff" fill-opacity="1" stroke="#111111" stroke-width="1.5" data-ref="1" data-evictable="false"/>
  <text x="268" y="145.0" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">Translate</text>
  <text x="268" y="161.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">ref 1</text>
  <line x1="420.00" y1="149.00" x2="438.00" y2="124.00" stroke="#444444" stroke-width="1.3"/>
  <rect id="node-3" x="438" y="104.0" width="158" height="40" rx="5" fill="#ffffff" fill-opacity="1" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="4 3" data-ref="0" data-evictable="true"/>
  <text x="444" y="120" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">cat   (A, finished)</text>
  <text x="444" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D55E00" text-anchor="start">ref 0, evictable first</text>
  <line x1="420.00" y1="149.00" x2="438.00" y2="174.00" stroke="#444444" stroke-width="1.3"/>
  <rect id="node-4" x="438" y="154.0" width="158" height="40" rx="5" fill="#ffffff" fill-opacity="1" stroke="#111111" stroke-width="1.5" data-ref="1" data-evictable="false"/>
  <text x="444" y="170" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">dog   (B, running)</text>
  <text x="444" y="186" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">ref 1</text>
  <line x1="20.00" y1="210.00" x2="600.00" y2="210.00" stroke="#d9d9d9" stroke-width="1"/>
  <text x="20" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">Same requests under full-block hashing (block = 4 tokens):</text>
  <text x="20" y="259" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">B</text>
  <rect id="hash-B-0" x="44" y="244" width="206" height="24" rx="4" fill="#0072B2" fill-opacity="0.25" stroke="#0072B2" stroke-width="1.3" data-hit="true"/>
  <text x="50" y="260" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">&lt;s&gt; You are a</text>
  <rect id="hash-B-1" x="258" y="244" width="206" height="24" rx="4" fill="#ffffff" fill-opacity="1" stroke="#444444" stroke-width="1.3" data-hit="false"/>
  <text x="264" y="260" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">helpful bot Translate dog</text>
  <text x="44" y="284" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">reused: 4 tokens by hashing vs 7 in the tree</text>
  <text x="20" y="321" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">C</text>
  <rect id="hash-C-0" x="44" y="306" width="206" height="24" rx="4" fill="#0072B2" fill-opacity="0.25" stroke="#0072B2" stroke-width="1.3" data-hit="true"/>
  <text x="50" y="322" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">&lt;s&gt; You are a</text>
  <rect id="hash-C-1" x="258" y="306" width="206" height="24" rx="4" fill="#ffffff" fill-opacity="1" stroke="#444444" stroke-width="1.3" data-hit="false"/>
  <text x="264" y="322" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">helpful bot Summarize this</text>
  <text x="44" y="346" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">reused: 4 tokens by hashing vs 6 in the tree</text>
</svg>
