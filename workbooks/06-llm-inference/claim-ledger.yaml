# Workbook 06's claim ledger. Schema: shared/claim-ledger-schema.yaml.
#
# `entries` holds Chapter 1's and Chapter 2's claims (drafted 2026-10-28). Do not add an
# entry until the sentence or number it supports exists and its passage
# has been read.
#
# `planned_chapter_sources` records the approved chapter-level source
# mapping (reports/06_llm_inference_scope_and_source_decision.md, Sec. 5.2).
# It names no claim and is not evidence for any statement.

schema_version: 1
entries:
  - id: "claim-06-inference-workload-001"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "Pope et al. split inference latency into prefill time for the input tokens present at the start and decode time for generating output tokens one step at a time."
    source_ids: ["src-78"]
    verification_status: "verified_full_text"
    note: "Sec. 2 (Inference cost trade-offs), arXiv PDF read via pdftotext."

  - id: "claim-06-inference-workload-002"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "A decoder-only model needs about 2N matmul FLOPs per token for N parameters."
    source_ids: ["src-78"]
    verification_status: "verified_full_text"
    note: "Sec. 2; the chapter applies it to the matrices multiplied in every step and excludes the input-embedding lookup (a stated convention, not from the source)."

  - id: "claim-06-inference-workload-003"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "Attention adds comparatively few FLOPs per token but can account for a significant fraction of memory capacity and bandwidth costs, 'since (unlike the weights) the KV cache is unique for each sequence in the batch'."
    source_ids: ["src-78"]
    verification_status: "verified_full_text"
    note: "Sec. 2, quoted wording checked against the pdftotext extraction (the word 'sequence' wraps to the next line)."

  - id: "claim-06-inference-workload-004"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "Memory time is dominated by weight loading at small batch and short sequences and by the KV cache at large batch and long sequences; smaller batches can lower latency but worsen utilization and raise cost."
    source_ids: ["src-78"]
    verification_status: "verified_full_text"
    note: "Sec. 2-2.1. Paper results are TPU v4-specific; none are reproduced in the chapter."

  - id: "claim-06-inference-workload-005"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "The roofline bounds attainable performance as min(peak FLOP/s, peak memory bandwidth x operational intensity); the ridge point is where the two lines meet, left of it bandwidth limits and right of it compute limits."
    source_ids: ["src-79"]
    verification_status: "verified_full_text"
    note: "Berkeley technical report Sec. 3-4 (CACM version not read). Operational intensity in the source counts DRAM traffic after cache filtering; the chapter's logical bytes are a lower bound on that traffic."

  - id: "claim-06-inference-workload-006"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "Matmuls are compute-bound once the per-replica token batch exceeds a critical batch equal to the FLOPs/bandwidth ratio times (bits per parameter / bits per activation)."
    source_ids: ["src-10"]
    verification_status: "verified_full_text"
    note: "'Inference' chapter, arithmetic-intensity section. Its 240 (TPU v5e) and about 280 (H100) token values are analytical estimates for other hardware and are not used in the chapter."

  - id: "claim-06-inference-workload-007"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "Multi-head attention intensity at decode is approximately 1 in bf16 and cannot be raised by batching, while prefill attention intensity grows with sequence length."
    source_ids: ["src-10"]
    verification_status: "verified_full_text"
    note: "'Inference' chapter, attention-intensity derivation (ST/(S+T)). The GQA generalisation 2 H_q/(H_kv b_kv) is derived in the chapter."

  - id: "claim-06-inference-workload-008"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "src-10's general theoretical step time sums a bandwidth-bound attention term and a max(compute, memory) term for the MLP, and it cautions that a sharp roofline is often not seen in practice."
    source_ids: ["src-10"]
    verification_status: "verified_full_text"
    note: "'Inference' chapter, theoretical step-time equations and the roofline caveat. The chapter's per-operation estimate applies max() to attention too."

  - id: "claim-06-inference-workload-009"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "Sarathi-Serve measures TTFT from the moment a request arrives in the system (so it includes queueing) and TBT as the interval between consecutive output tokens, reported at tail percentiles."
    source_ids: ["src-75"]
    verification_status: "verified_full_text"
    note: "Sec. 2.4 (metric definitions; arXiv text lines ~224-233) and Sec. 5 (P99 TBT evaluation)."

  - id: "claim-06-inference-workload-010"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "DistServe's introduction calls TTFT the duration of the prefill phase while its Sec. 3.1 queueing model (Eq. 1) adds queueing delay to average TTFT; it defines TPOT as 'the average time taken to generate a token for each request (except for the first token)', gives total latency as TTFT + TPOT x tokens generated in the decoding phase, and defines per-GPU goodput as the maximum request rate meeting an SLO-attainment goal such as 90%."
    source_ids: ["src-76"]
    verification_status: "verified_full_text"
    note: "Sec. 1 (TTFT/TPOT definitions, total-latency relation, goodput definition), Sec. 3.1 Eq. 1 (Avg_TTFT = execution + queueing delay), footnote 3 (latency comprises execution and queueing). Source audit 2026-10-28 corrected an earlier overstatement that DistServe excludes queueing; the chapter now presents the source's own two usages rather than a firm disagreement with src-75."

  - id: "claim-06-inference-workload-011"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "MLPerf Inference rules describe TPOT as 'the average interval between all the tokens generated'."
    source_ids: ["src-81"]
    verification_status: "verified_full_text"
    note: "inference_rules.adoc:270 (footnote in the LLM-scenario section) at commit d3eba2f (Aug 2026), as recorded in the registry. Time-sensitive: rules change by round."

  - id: "claim-06-inference-workload-012"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "vLLM v0.32.0's benchmark client starts its timer just before the HTTP request, takes TTFT at the first streamed data chunk carrying output choices (its text may be empty), records ITL as gaps between such chunks, and ends latency at the last such chunk rather than the end-of-stream marker."
    source_ids: ["src-82"]
    verification_status: "verified_full_text"
    note: "vllm/benchmarks/lib/endpoint_request_func.py:228-287 (the OpenAI-completions request function) at commit 5df63a72; other request functions in the file were not checked line by line. Code-verified behaviour of this version only."

  - id: "claim-06-inference-workload-013"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "vLLM v0.32.0 computes TPOT as (latency - TTFT)/(output_tokens - 1) only for requests with more than one output token, leaves one-token requests out of its TPOT statistics, but counts their TPOT as 0 when testing a goodput SLO; throughput and goodput divide by the whole benchmark duration."
    source_ids: ["src-82"]
    verification_status: "verified_full_text"
    note: "vllm/benchmarks/serve.py:600-631, 640-660, 749-764, 1011, 1090 at commit 5df63a72; the duration ends after asyncio.gather returns, i.e. after every stream has finished (the chapter's synthetic window ends at the last end-of-stream marker to match)."

  - id: "claim-06-inference-workload-014"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "Temperature divides logits before the softmax (t < 1 sharpens toward likely tokens); top-k keeps the k most probable tokens and renormalizes; top-p keeps the smallest set whose mass reaches p and renormalizes."
    source_ids: ["src-96"]
    verification_status: "verified_full_text"
    note: "Sec. 3.1-3.3, Eqs. 2-4; Sec. 3.3 also notes low temperature applied before top-k in practice (cited prior work not read). The source does not prescribe an engine order; the chapter claims only that order matters."

  - id: "claim-06-inference-workload-015"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "Greedy, top-k, nucleus and temperature sampling can each be cast as standard sampling from an adjusted distribution."
    source_ids: ["src-44"]
    verification_status: "verified_full_text"
    note: "Sec. 2.2 only; used as the bridge to Chapter 6."

  - id: "claim-06-inference-workload-016"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "For the illustrative model and accelerator: 15.01 GB of weights read per step (16.06 GB stored), 128 KiB of cache per token, ridge 333.3 FLOP/byte (integer crossover 334 tokens), prefill 28.6 TFLOP linear with last-position logits only and a 29.7 ms bound, decode attention intensity 4 (GQA) or 1 (MHA), and every decode-table, prefill, question and exercise number in the chapter and answer key."
    source_ids: []
    verification_status: "computed_by_script"
    note: "workbooks/06-llm-inference/data/worked-examples/inference_workload_and_metrics.py -> .json; illustrative inputs, derived idealized outputs; checked by tests/test_workbook06_ch01_worked_examples.py."

  - id: "claim-06-inference-workload-017"
    workbook: "06-llm-inference"
    chapter: "ch1"
    statement: "Per-request and aggregate metrics for the synthetic four-request event log: TTFTs 215/485/315/765 ms, TPOT 40/35/undefined/60 ms, mean ITL 46.7 ms over nine gaps, 3.85 requests/s and 13.5 output tokens/s over a 1.04 s window ending at the last end-of-stream marker, goodput 2.88 or 1.92 requests/s depending on the one-token convention."
    source_ids: []
    verification_status: "computed_by_script"
    note: "Synthetic event log, not a measurement; same script and tests as claim-06-inference-workload-016."

  - id: "claim-06-kv-cache-memory-001"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "vLLM v0.32.0 requests ceil(total memory x gpu_memory_utilization), default 0.92, and sets the KV-cache budget to that minus profiled non-KV memory measured in a startup run with dummy inputs and minus an estimate for captured CUDA graphs."
    source_ids: ["src-82"]
    verification_status: "verified_full_text"
    note: "vllm/config/cache.py:102; vllm/v1/worker/utils.py:724-726; vllm/v1/worker/gpu_worker.py:634-646, 676-694, 740-744 at commit 5df63a72 (main-path non_kv_cache_memory computation not inspected line by line). The chapter's own runtime headroom is illustrative, not profiled."

  - id: "claim-06-kv-cache-memory-002"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "Contiguous pre-allocation by maximum length wastes memory through reserved slots for future tokens, internal fragmentation and external fragmentation; reserved slots are eventually used but unavailable meanwhile, while internal and external fragmentation are pure waste."
    source_ids: ["src-73"]
    verification_status: "verified_full_text"
    note: "Sec. 3, Fig. 3 (raw-text lines ~495-515)."

  - id: "claim-06-kv-cache-memory-003"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "Kwon et al. report that existing systems kept only 20.4-38.2% of KV memory holding token states in their experiments, against about 96.3% for vLLM."
    source_ids: ["src-73"]
    verification_status: "verified_full_text"
    note: "Sec. 1 and Fig. 2; paper-reported, tied to its OPT models, traces and emulated baselines. The chapter's own 30.9% / 99.4% come from a chosen workload and are not compared with these as validation."

  - id: "claim-06-kv-cache-memory-004"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "PagedAttention block tables map logical to physical blocks and record filled positions; new physical blocks are allocated only when previous ones are full, limiting a request's waste to one block."
    source_ids: ["src-73"]
    verification_status: "verified_full_text"
    note: "Sec. 4.2-4.3."

  - id: "claim-06-kv-cache-memory-005"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "Larger blocks let the kernel process more positions in parallel but increase internal fragmentation and reduce sharing; vLLM's default block size is 16, in the paper and in v0.32.0."
    source_ids: ["src-73", "src-82"]
    verification_status: "verified_full_text"
    note: "src-73 Sec. 4.3 and 7.2; src-82 vllm/config/cache.py:72."

  - id: "claim-06-kv-cache-memory-006"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "PagedAttention keeps a reference count per physical block and applies block-level copy-on-write when a sequence must write a block whose count exceeds 1; the last writer with count 1 writes in place."
    source_ids: ["src-73"]
    verification_status: "verified_full_text"
    note: "Sec. 4.4 (parallel sampling, Fig. 8). The chapter's copy-on-write simulation mirrors this example."

  - id: "claim-06-kv-cache-memory-007"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "The original PagedAttention system shared prefixes by reserving physical blocks for provider-defined prefixes and mapping a new request's logical blocks to them, with the last block marked copy-on-write."
    source_ids: ["src-73"]
    verification_status: "verified_full_text"
    note: "Sec. 4.4, shared-prefix paragraph."

  - id: "claim-06-kv-cache-memory-008"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "vLLM v0.32.0 hashes each full block from its parent hash, its token IDs and extra hashes (LoRA IDs, multimodal input hashes, cache salt); only full blocks are cached; a per-request cache_salt restricts reuse to requests with the same salt."
    source_ids: ["src-82"]
    verification_status: "verified_full_text"
    note: "docs/design/prefix_caching.md:5-25, :87-100 at commit 5df63a72."

  - id: "claim-06-kv-cache-memory-009"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "vLLM v0.32.0 caps a prefix hit at prompt length minus one so the last prompt token is recomputed for its logits, and skips the lookup for requests needing prompt log-probabilities."
    source_ids: ["src-82"]
    verification_status: "verified_full_text"
    note: "vllm/v1/core/kv_cache_manager.py:280-296."

  - id: "claim-06-kv-cache-memory-010"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "In vLLM v0.32.0 the prefix-hash unit defaults to the block size for a single-group model; an optional finer prefix_match_unit lets hits end inside a block, and the shared tail block is then copied to a private block before writing."
    source_ids: ["src-82"]
    verification_status: "verified_full_text"
    note: "vllm/config/cache.py:90-98; vllm/v1/core/kv_cache_utils.py:860-882; vllm/v1/core/single_type_kv_cache_manager.py:163-172, 380-395. Hybrid-model and connector paths not examined."

  - id: "claim-06-kv-cache-memory-011"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "RadixAttention maps token sequences to KV in a radix tree with token-run edges, a page size of one token, per-node reference counts (evictable at zero), LRU eviction of leaves first, and one memory pool shared by cached tokens and running requests."
    source_ids: ["src-77"]
    verification_status: "verified_full_text"
    note: "Sec. 3, RadixAttention paragraphs (raw-text lines ~276-300)."

  - id: "claim-06-kv-cache-memory-012"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "vLLM v0.32.0 frees a finished request's blocks only at reference count zero, adds them to the free-queue tail in reverse order, keeps their hashes until reallocated, and evicts cached content when a cached block is popped from the queue head."
    source_ids: ["src-82"]
    verification_status: "verified_full_text"
    note: "docs/design/prefix_caching.md:105-160, :198."

  - id: "claim-06-kv-cache-memory-013"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "vLLM's prefix-caching design document says prefix caching won't change model outputs, while its speculative-decoding documentation says vLLM does not guarantee stable log-probabilities across runs and that batch-size changes can vary them."
    source_ids: ["src-82"]
    verification_status: "verified_full_text"
    note: "docs/design/prefix_caching.md:3; docs/features/speculative_decoding/README.md:212-214 and :220. The chapter's 'mathematically, not bitwise, identical' is derived from these and the workbook's correctness contract."

  - id: "claim-06-kv-cache-memory-014"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "PagedAttention preempts all or none of a sequence's blocks and recovers by swapping to CPU memory (swap space bounded by the GPU cache pool) or by recomputing the prompt plus generated tokens in one prefill; swapping suffers from small transfers at small block sizes and the two are comparable for blocks of 16-64 tokens in the authors' setup."
    source_ids: ["src-73"]
    verification_status: "verified_full_text"
    note: "Sec. 4.5 and 7.3; reported results are setup-specific."

  - id: "claim-06-kv-cache-memory-015"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "The vLLM v0.32.0 scheduler preempts by recomputation only: it frees the request's blocks, sets its computed-token count to zero and returns it to the waiting queue."
    source_ids: ["src-82"]
    verification_status: "verified_full_text"
    note: "vllm/v1/core/sched/scheduler.py:1571-1593; no swap mode in the scheduler. Optional KV-offloading connectors (vllm/config/cache.py:65) were not examined and are excluded in the chapter text. That still-cached freed blocks can be hit on resume is derived from :960-967 and the free-queue design."

  - id: "claim-06-kv-cache-memory-016"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "Mistral 7B uses sliding-window attention with W = 4096 and a rolling buffer storing position i at slot i mod W, overwriting older entries; the authors report an 8x cache reduction at 32k tokens without impacting model quality."
    source_ids: ["src-25"]
    verification_status: "verified_full_text"
    note: "Sec. 2 (arXiv v1). Reported and model-specific. The paper's text says Fig. 2 shows W = 3; its caption says W = 4."

  - id: "claim-06-kv-cache-memory-017"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "vLLM v0.32.0 frees a sliding-window layer's blocks once wholly outside the window; full-attention layers free nothing before the request finishes."
    source_ids: ["src-82"]
    verification_status: "verified_full_text"
    note: "vllm/v1/core/single_type_kv_cache_manager.py:672-705, :1135."

  - id: "claim-06-kv-cache-memory-018"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "Sharing KV caches across layers reduces cache size but the shared caches may need to be read from HBM multiple times, so it does not necessarily improve step time."
    source_ids: ["src-10"]
    verification_status: "verified_full_text"
    note: "'Inference' chapter, line 149 of the local text extraction. The chapter applies the storage-vs-traffic point to prefix sharing as a derived analogy."

  - id: "claim-06-kv-cache-memory-019"
    workbook: "06-llm-inference"
    chapter: "ch2"
    statement: "Capacity plan, rounding table, reservation-versus-paging shares, external-fragmentation toy, lifecycle and copy-on-write traces, radix-versus-hash reuse, prefix sharing at scale, looped and sliding-window variants, and every question and exercise number in Chapter 2."
    source_ids: []
    verification_status: "computed_by_script"
    note: "workbooks/06-llm-inference/data/worked-examples/kv_cache_memory.py -> .json (imports Chapter 1's model read-only); checked by tests/test_workbook06_ch02_*.py. Illustrative inputs, derived outputs."

