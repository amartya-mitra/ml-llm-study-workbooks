# Figure plan for Workbook 06. Created at scaffolding (2026-10-28) from
# reports/06_llm_inference_scope_and_source_decision.md, Sec. 5.2.
# Chapters 1-3 figures are drawn (2026-10-28); every other figure is still
# PLANNED, with no source script or rendered SVG.
# Convention (as Workbooks 04/05 and the addendum): original diagrams
# generated by figures/source/*.py from data/worked-examples/*.json into
# figures/rendered/*.svg; none reproduces a source figure. Fields marked
# "not yet decided" are open decisions, made when the figure is drawn.

figures:
  - id: "fig-roofline-prefill-decode"
    chapter: "ch1"
    status: "drawn"
    teaching_purpose: "Place prefill and decode steps on one roofline: linear layers move right with token batch; decode attention stays near a fixed intensity set by the KV-head grouping."
    source_script: "figures/source/fig_roofline_prefill_decode.py"
    numeric_source: "data/worked-examples/inference_workload_and_metrics.json"
    semantic_invariant: "Roof = min(peak, bandwidth x intensity) with the ridge at peak/bandwidth; each point lies on the roof at its JSON intensity; decode-linear intensity equals tokens per step (2-byte weights) and increases with B; both decode-attention points (4 and 1) lie left of the ridge for every B; prefill points lie right of the ridge."
    must_be_redrawn: true
    final_filename: "figures/rendered/fig-roofline-prefill-decode.svg"

  - id: "fig-request-timeline"
    chapter: "ch1"
    status: "drawn"
    teaching_purpose: "One request from queue to last token, marking TTFT and inter-token intervals, and where queueing is or is not included."
    source_script: "figures/source/fig_request_timeline.py"
    numeric_source: "data/worked-examples/inference_workload_and_metrics.json"
    semantic_invariant: "One lane per synthetic request; TTFT bracket runs from client send to first chunk and equals the JSON TTFT; queue bar spans server arrival to first schedule; chunk circles carry their token counts and sum to output tokens; the one-output-token request has no gaps."
    must_be_redrawn: true
    final_filename: "figures/rendered/fig-request-timeline.svg"

  - id: "fig-latency-throughput-frontier"
    chapter: "ch1"
    status: "drawn"
    teaching_purpose: "Analytical step latency and throughput across batch sizes for one illustrative model and accelerator."
    source_script: "figures/source/fig_latency_throughput_frontier.py"
    numeric_source: "data/worked-examples/inference_workload_and_metrics.json"
    semantic_invariant: "Points equal the JSON per-operation step estimates and tokens/s; within each context, step time and throughput increase with B; points whose logical resident bytes exceed capacity are hollow."
    must_be_redrawn: true
    final_filename: "figures/rendered/fig-latency-throughput-frontier.svg"

  - id: "fig-block-table"
    chapter: "ch2"
    status: "drawn"
    teaching_purpose: "Logical KV blocks of two sequences mapped to physical blocks, including a shared, reference-counted block."
    source_script: "figures/source/fig_block_table.py"
    numeric_source: "data/worked-examples/kv_cache_memory.json"
    semantic_invariant: "Physical blocks, reference counts, fill levels and both block tables equal lifecycle.snapshots[0]; a block's ref equals the number of block tables pointing at it; shared blocks (ref 2) are the first two logical blocks of both requests; free blocks have ref 0 and no table entry; the printed counts equal the snapshot's unique physical blocks, logical references, allocated slots, stored and live tokens."
    must_be_redrawn: true
    final_filename: "figures/rendered/fig-block-table.svg"

  - id: "fig-prefix-tree"
    chapter: "ch2"
    status: "drawn"
    teaching_purpose: "Requests sharing prefixes stored once in a prefix tree, with which blocks can be evicted."
    source_script: "figures/source/fig_prefix_tree.py"
    numeric_source: "data/worked-examples/kv_cache_memory.json"
    semantic_invariant: "Tree nodes, token runs and ref counts equal radix.nodes; exactly the unreferenced leaves are drawn evictable; the hashing rows mark as hits exactly the full blocks within hash_reusable_tokens; printed reuse counts equal radix_matched_tokens and hash_reusable_tokens."
    must_be_redrawn: true
    final_filename: "figures/rendered/fig-prefix-tree.svg"

  - id: "fig-schedule-timelines"
    chapter: "ch3"
    status: "drawn"
    teaching_purpose: "One toy trace under request-level, iteration-level, chunked-prefill and disaggregated scheduling, generated from the same trace data."
    source_script: "figures/source/fig_schedule_timelines.py"
    numeric_source: "data/worked-examples/serving_schedules.json"
    semantic_invariant: "One panel per policy (static, continuous, chunked, disaggregated) and one row per request; every (step, request) work item in the JSON is one bar with its kind, start and end; one dot per selected output token; arrival ticks precede every bar; KV-transfer lines appear only in the disaggregated panel."
    must_be_redrawn: true
    final_filename: "figures/rendered/fig-schedule-timelines.svg"

  - id: "fig-prefill-decode-interference"
    chapter: "ch3"
    status: "drawn"
    teaching_purpose: "How an inserted prefill lengthens concurrent decode steps in the toy trace."
    source_script: "figures/source/fig_prefill_decode_interference.py"
    numeric_source: "data/worked-examples/serving_schedules.json"
    semantic_invariant: "One stacked bar per step for the continuous and chunked policies; T0 + ALPHA x prefill + BETA x decode parts sum to the JSON step duration; the longest decode-carrying step is shorter with chunking and equals the continuous policy's worst gap."
    must_be_redrawn: true
    final_filename: "figures/rendered/fig-prefill-decode-interference.svg"

