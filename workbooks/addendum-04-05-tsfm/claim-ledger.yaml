    chapter: "ch3"
    statement: "For F = 2500, Timestral decodes 79 patches as blocks of 32, 32 and 15, producing 2,528 steps with 28 discarded and 6 block passes under symmetric averaging; for F = 1500, 47 patches in blocks of 32 and 15, 4 steps discarded, 4 block passes."
    source_ids: ["src-71"]
    verification_status: "computed_by_script"
    note: "Derived values (w7_timestral.py rollout_example, rollout_question); horizons illustrative; rule code-verified."

