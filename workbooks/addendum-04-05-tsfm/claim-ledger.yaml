    statement: "Timestral assigns each row a role (target, past-only, known-future); target and past-only rows are causal in time, known-future rows bidirectional over context and horizon; covariates never read targets and known-future rows read only known-future rows; the code accepts known-future covariates only if a time step is followed by another time step and a variate step."
