  # ------------------- Timestral (v1.1.0 revision, 2026-10-27) -------------------
  # Kinds used below: "code-verified (inference)" = read in src-71 at commit
  # a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff; "documentation claim" = README /
  # model card / config.json (src-70, src-71 README, src-72); "vendor claim" =
  # Mistral blog (src-69). Timestral has no paper as of 2026-10-27. Every
