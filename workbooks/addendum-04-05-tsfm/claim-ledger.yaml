    statement: "In LLM pretraining a mixing weight w_i gives source i a share of the token budget; mixtures can be fixed or multi-stage; pretraining and evaluation data must be strictly separate; scaling laws are fitted relations, not universal laws."
    source_ids: []
    verification_status: "verified_full_text"
    note: "Frozen-workbook recap (Workbook 05 Ch.1 and Ch.3). The scope report's 'single-axis fits' wording for Ch.3 was not found in that chapter and is not used."

  - id: "claim-tsfm-data-002"
    workbook: "addendum-04-05-tsfm"
    chapter: "ch5"
    statement: "The Moirai archive LOTSA holds 27,646,462,733 observations across nine domains and samples sub-datasets subject to a cap whose value and rule are unverified."
    source_ids: ["src-61"]
    verification_status: "verified_full_text"
