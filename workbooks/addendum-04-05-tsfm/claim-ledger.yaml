    note: "Vendor claim (training stages, blog) plus documentation claim (model card and config context_length 32768). 4 x 8192 = 32768; the README ("capped at the trained length (32768 steps)") and the config docstring ("Trained context length") state that 32,768 is the trained length, a maintainer statement about training that stays unverified, so the chapter keeps the vendor stage figures and the documented maximum as separate entries. As of October 2026."

