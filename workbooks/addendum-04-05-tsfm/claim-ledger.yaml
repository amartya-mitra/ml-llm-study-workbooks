  - id: "claim-tsfm-architecture-013"
    workbook: "addendum-04-05-tsfm"
    chapter: "ch3"
    statement: "The Timestral blog describes Decoupled Horizon Forecasting as keeping the full history in the sequence with learned forecast tokens that read the history before them, so every observed value is both target and context, true gaps stay flagged missing, and training horizon and missing-data augmentation are tuned independently; it contrasts this with causal decoders trained with contiguous patch masking, naming Toto 2.0 and TimesFM-3."
    source_ids: ["src-69"]
    verification_status: "verified_full_text"
    note: "Vendor claim about training and about other vendors' models; not checked. The chapter does not equate either use of 'contiguous patch masking' with TiRex's CPM (src-59). The teacher-forcing reading is an original explanation. As of October 2026."

  - id: "claim-tsfm-architecture-014"
    workbook: "addendum-04-05-tsfm"
    chapter: "ch3"
    statement: "In Timestral's inference code, h <= K forecast tokens (copies of one learned vector distinguished by time positions) follow the encoded context; they read the valid context patches, themselves and earlier forecast tokens of their block (the mask diagonal is always open); context never reads forecast tokens; each forecast token yields one 32-step patch of quantiles. The mask builder supports a multi-block layout, but inference uses one block."
    source_ids: ["src-71"]
    verification_status: "verified_full_text"
    note: "Code-verified (inference): model.PatchRepresentation.forecast_tokens, masks.build_forecast_time_mask, masks.build_two_stream_time_mask / compute_block_layout, model._predict_window. With covariates the encoder spans context plus the block horizon and every patch has a forecast token, active only from the forecast origin (one active block at inference); the chapter and figure caption say so. The multi-block layout's use in training is not verified (no training code). As of October 2026."

  - id: "claim-tsfm-architecture-015"
    workbook: "addendum-04-05-tsfm"
    chapter: "ch3"
    statement: "Timestral decodes at most K = 32 patches (1,024 steps) per pass; longer horizons are decoded block by block with the median appended for targets, real values for known-future rows and unobserved blanks for past-only rows; later patches in a block are re-expressed in an advancing scale frame; by default the forecaster averages with the reflected forecast of the negated series and clips non-negative series at 0, and the README says benchmarks used these defaults."
    source_ids: ["src-70", "src-71"]
    verification_status: "verified_full_text"
    note: "Documentation claim (block_size 32; model card 1,024 steps per pass) and code-verified (forecaster._block_ar_decode, _refine_block, scaler.advancing_block_frames, forecast() defaults). The 'frame it was trained in' docstring is a maintainer statement about training, unverified. As of October 2026."

