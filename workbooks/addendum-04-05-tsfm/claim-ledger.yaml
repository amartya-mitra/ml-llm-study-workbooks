  - id: "claim-tsfm-inputs-015"
    workbook: "addendum-04-05-tsfm"
    chapter: "ch1"
    statement: "Timestral's inference code scales each patch with the running mean and (Bessel-corrected) standard deviation of all observed values from the context start to the end of that patch, then applies arcsinh; no context token depends on later values."
    source_ids: ["src-71"]
    verification_status: "verified_full_text"
    note: "Code-verified (inference): scaler.py compute_causal_statistics / causal_patch_loc_scale, model.py TimestralModel.scale; use_asinh true in every config (src-70). Whether training scaled the same way is not verified (no training code); the only "as in training" comments concern the in-block refine frame (scaler.advancing_block_frames, forecaster._refine_block), cited in Module 3. Timestral 1.0; as of October 2026."

  - id: "claim-tsfm-inputs-016"
    workbook: "addendum-04-05-tsfm"
    chapter: "ch1"
    statement: "Missing values (NaN) are excluded from Timestral's scaling statistics and enter a patch as 0 with a missing flag; patches with gaps remain attention keys once a series has started, while leading all-missing patches are padding and never keys; known-future covariate rows are scaled over the whole row and 0/1 rows are left unscaled."
    source_ids: ["src-71"]
    verification_status: "verified_full_text"
    note: "Code-verified (inference): forecaster._as_context, scaler.apply_affine_asinh_masked, masks.compute_enc_key_validity (attend_missing_patches true in every config), scaler.instance_norm_stats, model._known_cov_scaling. Timestral 1.0; as of October 2026."

  - id: "claim-tsfm-inputs-017"
    workbook: "addendum-04-05-tsfm"
    chapter: "ch1"
    statement: "Timestral's patches are 32 time steps, each embedded by a residual MLP from its 32 scaled values and 32 missing flags."
    source_ids: ["src-70", "src-71"]
    verification_status: "verified_full_text"
    note: "Documentation claim (model card: values with missing-value indicators; config patch_size 32), code-verified (model.PatchRepresentation: ResidualBlock over 2 x patch_size inputs). Timestral 1.0; as of October 2026."

  - id: "claim-tsfm-inputs-018"
    workbook: "addendum-04-05-tsfm"
    chapter: "ch1"
    statement: "Under the left-padding rule a 2,000-step context gets 16 unobserved steps and 63 patches; a 1,000-step context gets 24 and 32 patches; the documented 32,768-step maximum is 1,024 patches."
    source_ids: ["src-70", "src-71"]
    verification_status: "computed_by_script"
    note: "Derived value (w7_timestral.py: padding_example, padding_question, full_context); rule code-verified (forecaster.pad_to_patch, context cap); lengths illustrative except the maximum, which is restated from documentation."

  - id: "claim-tsfm-context-014"
    workbook: "addendum-04-05-tsfm"
    chapter: "ch2"
    statement: "Timestral is trained at context 8192 in a first stage and 4x longer in a second (vendor), and documents a maximum context of 32,768 time steps."
    source_ids: ["src-69", "src-70"]
