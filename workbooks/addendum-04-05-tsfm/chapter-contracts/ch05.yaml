# Module contract for Addendum 04-05 (TSFM), Module 5 "Pretraining data,
# adaptation and leakage".

identity:
  workbook: "addendum-04-05-tsfm"
  chapter: "05"
  title: "Pretraining data, adaptation and leakage"
  status: "drafted_pending_human_review"

scope:
  allowed_paths:
    - "workbooks/addendum-04-05-tsfm/chapters/05-pretraining-data-adaptation-and-leakage.qmd"
    - "workbooks/addendum-04-05-tsfm/solutions/05-pretraining-data-adaptation-and-leakage-solutions.qmd"
    - "workbooks/addendum-04-05-tsfm/data/worked-examples/w5_mixture_cap.py"
    - "workbooks/addendum-04-05-tsfm/figures/source/fig_leakage_timeline.py"
  frozen_paths:
    - "workbooks/04-llm-architecture/**"
    - "workbooks/05-llm-training/**"
    - "workbooks/addendum-04-05-tsfm/chapters/0[1-46]-*.qmd"
  canonical_output_allowed: false
  release_output_allowed: false
  push_allowed: false

sources:
  required_source_ids: ["src-56", "src-57", "src-58", "src-59", "src-60", "src-61", "src-62", "src-65", "src-66", "src-67"]
  full_text_required: true
  evidence_locators_required: true

content:
  required_sections:
    - "Quick recap from LLMs"
    - "What goes into a pretraining corpus"
    - "Leakage routes specific to series"
    - "Adaptation, and what transfers from LLM training systems"
    - "Worked example: a toy cap"
    - "Check your understanding"
    - "Answer Key"
  question_count: 6
  answer_count: 6
  worked_example_count_minimum: 1
  figure_count_minimum: 1

worked_examples:
  structured_output_required: true
  prose_crosscheck_required: true
  units_required: true

figures:
  semantic_tests_required: true
  numeric_source_of_truth_required: true

learner_facing:
  forbid_source_ids: true
  forbid_repo_paths: true
  forbid_implementation_filenames: true
  forbid_revision_history: true
  require_scope_qualification: true

claims:
  required_claim_prefix: "claim-tsfm-data-"
  forbidden_statements:
    - "the Moirai sampling-cap value or rule presented as sourced"
    - "any benchmark's leakage protocol defined as fact"
    - "a TSFM scaling law or a field-wide parameter bound"
    - "how much fine-tuning helps"
    - "distributed-training strategies, ZeRO or FSDP detail"
    - "the toy capped allocation presented as any model's rule"

acceptance:
  source_audit: "not_yet_run"
  numerical_audit: "not_yet_run"
  figure_audit: "not_yet_run"
  learner_pdf_audit: "not_yet_run"
  scoped_tests: "not_yet_run"
  visual_review: "not_yet_run"
