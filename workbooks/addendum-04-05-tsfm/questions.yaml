# Question records for the TSFM addendum. Schema: shared/question-schema.yaml.
# One record per question in each module's "Check your understanding"
# section; expected answers mirror the module's answer-key entry.

questions:
  - id: "q-tsfm-inputs-001"
    workbook: "addendum-04-05-tsfm"
    chapter: "model-inputs"
    topic: "Bin id versus patch projection"
    difficulty: "intro"
    question_type: "recall"
    prompt: "In a bin-token model, what does a bin id select, and in a patch model what plays that role?"
    expected_answer: "A bin id selects one row of an embedding table. A patch model has no table: a learned projection of the patch's values plays that role."
    explanation: "Discrete tokens index a table; continuous patches are vectors computed by a learned projection."
    common_wrong_answer: "Assuming every input unit is a table lookup."
    source_ids: ["src-56", "src-57"]

  - id: "q-tsfm-inputs-002"
    workbook: "addendum-04-05-tsfm"
    chapter: "model-inputs"
    topic: "Patch counting"
    difficulty: "core"
    question_type: "calculation"
    prompt: "A series has 20 steps. Compute the number of patches for P=5, S_p=2 with end padding, and for non-overlapping patches of 5."
    expected_answer: "With end padding: floor((20-5)/2)+2 = 9. Non-overlapping: floor(20/5) = 4."
    explanation: "The end-padded overlapping count is floor((T_ctx - P)/S_p) + 2; the non-overlapping count is floor(T_ctx / P)."
    common_wrong_answer: "Forgetting the +2, which accounts for the first patch and the padded final patch."
    source_ids: ["src-64"]

  - id: "q-tsfm-inputs-003"
    workbook: "addendum-04-05-tsfm"
    chapter: "model-inputs"
    topic: "Bin range limit"
    difficulty: "core"
    question_type: "misconception_diagnosis"
    prompt: "A colleague says: 'Chronos treats the series like text, so it can forecast any value.' What limit does the bin design impose?"
    expected_answer: "The representable range ends at the outer bin centers, and values inside a bin lose their exact position."
    explanation: "Scaling puts series on a common scale but does not remove the bounded range of a fixed bin vocabulary."
    common_wrong_answer: "Believing a language-model backbone removes the range limit."
    source_ids: ["src-56"]

  - id: "q-tsfm-inputs-004"
    workbook: "addendum-04-05-tsfm"
    chapter: "model-inputs"
    topic: "Lag token versus patch token"
    difficulty: "core"
    question_type: "compare_and_contrast"
    prompt: "Name one thing a lag token and a patch token have in common and one thing that differs."
    expected_answer: "Both become one d_model vector through a learned projection with no vocabulary lookup. A patch covers several consecutive values; a lag token is one time step described by earlier values at chosen lags and needs a history as long as the largest lag."
    explanation: "The two continuous input styles differ in what a single token covers and in what history it needs."
    common_wrong_answer: "Treating a lag token as a patch of consecutive values."
    source_ids: ["src-63", "src-64"]

  - id: "q-tsfm-inputs-005"
    workbook: "addendum-04-05-tsfm"
    chapter: "model-inputs"
    topic: "Un-scaling and loss comparability"
    difficulty: "core"
    question_type: "explanation"
    prompt: "Why does the forecast have to be un-scaled, and why can losses on differently scaled series not be compared directly?"
    expected_answer: "The model outputs scaled values, which must be mapped back to the original level. A loss measured on scaled values depends on the scaler, so different scalers do not measure the same quantity."
    explanation: "Same logic as a tokenizer change in the LLM workbooks."
    common_wrong_answer: "Treating a lower loss as meaningful across different scalings."
    source_ids: ["src-56"]

  - id: "q-tsfm-inputs-006"
    workbook: "addendum-04-05-tsfm"
    chapter: "model-inputs"
    topic: "Patch length tradeoff (interview)"
    difficulty: "stretch"
    question_type: "explanation"
    prompt: "Interview-style question: a colleague proposes doubling the patch length with non-overlapping patches. What happens to token count and score-matrix size, and what can you not conclude about accuracy?"
    expected_answer: "Token count halves and the score matrix shrinks about fourfold; per-token work falls about twofold. Nothing follows about accuracy, because each token must encode twice as many values."
    explanation: "Score entries grow with the square of the token count; accuracy was not measured."
    common_wrong_answer: "Concluding that fewer tokens means a better or equal forecast."
    source_ids: ["src-64"]

  - id: "q-tsfm-context-001"
    workbook: "addendum-04-05-tsfm"
    chapter: "context-channels-covariates-horizons"
    topic: "Output shape rule"
    difficulty: "intro"
    question_type: "calculation"
    prompt: "How many values, and across how many timestamps, does a point forecast of 3 variables over 10 steps contain?"
    expected_answer: "30 values across 10 future timestamps."
    explanation: "n_tgt times F values; the timestamp count is F."
    common_wrong_answer: "Reading 30 as 30 timestamps."
    source_ids: []

  - id: "q-tsfm-context-002"
    workbook: "addendum-04-05-tsfm"
    chapter: "context-channels-covariates-horizons"
    topic: "Quantile and sample axes"
    difficulty: "core"
    question_type: "calculation"
    prompt: "With n_q = 9 quantile levels, how many numbers does the 3-variable, 10-step forecast contain? With 500 sampled paths instead?"
    expected_answer: "3 x 10 x 9 = 270 numbers; with 500 sampled paths, 3 x 10 x 500 = 15000."
    explanation: "The sample axis replaces the quantile axis; the two are alternative representations of predictive uncertainty, with different information and reconstruction properties."
    common_wrong_answer: "Multiplying by both the quantile count and the sample count."
    source_ids: []

  - id: "q-tsfm-context-003"
    workbook: "addendum-04-05-tsfm"
    chapter: "context-channels-covariates-horizons"
    topic: "Context versus horizon"
    difficulty: "core"
    question_type: "misconception_diagnosis"
    prompt: "'A model with an 8192-step context can forecast 8192 steps ahead.' What is wrong?"
    expected_answer: "Context length and horizon are separate axes, and a training context figure does not set the horizon; neither is the patch length."
    explanation: "T_ctx is how much past is read; F is how far ahead is requested."
    common_wrong_answer: "Equating the LLM context window with the forecast horizon."
    source_ids: ["src-57"]

  - id: "q-tsfm-context-004"
    workbook: "addendum-04-05-tsfm"
    chapter: "context-channels-covariates-horizons"
    topic: "Covariate kinds"
    difficulty: "intro"
    question_type: "recall"
    prompt: "Sort into known-future, observed or static: a promotion calendar, yesterday's temperature, a sensor's installation site."
    expected_answer: "Promotion calendar: known-future. Yesterday's temperature: observed (past-only). Installation site: static."
    explanation: "The kinds are defined by when the values are available."
    common_wrong_answer: "Treating every covariate as known over the horizon."
    source_ids: []

  - id: "q-tsfm-context-005"
    workbook: "addendum-04-05-tsfm"
    chapter: "context-channels-covariates-horizons"
    topic: "Flattening cost"
    difficulty: "core"
    question_type: "calculation"
    prompt: "For 5 variates over 8 steps, compare score entries for channel-independent processing and flattening."
    expected_answer: "Independent: 5 x 8^2 = 320. Flattened: (5 x 8)^2 = 1600, five times as many (logical counts per head per layer)."
    explanation: "Flattening puts all variates in one sequence, so score entries grow with the square of the total positions."
    common_wrong_answer: "Assuming the two cost the same."
    source_ids: ["src-61"]

  - id: "q-tsfm-context-006"
    workbook: "addendum-04-05-tsfm"
    chapter: "context-channels-covariates-horizons"
    topic: "Channel design tradeoff (interview)"
    difficulty: "stretch"
    question_type: "design"
    prompt: "Interview-style question: when would you choose channel-independent over channel-mixed processing, and what evidence in this module cuts both ways?"
    expected_answer: "Independent processing is simpler and cheaper but cannot use cross-series information; mixing can use it at higher cost. Chronos-2, TiRex-2 and Moirai mix channels, while Moirai 2.0 dropped multivariate support because it saw minimal benefit in its experiments."
    explanation: "The sources differ, and the disagreement is preserved rather than resolved."
    common_wrong_answer: "Claiming one design is always better."
    source_ids: ["src-57", "src-60", "src-61", "src-62"]

  - id: "q-tsfm-architecture-001"
    workbook: "addendum-04-05-tsfm"
    chapter: "architecture-families-and-horizon-filling"
    topic: "Pass counting"
    difficulty: "core"
    question_type: "calculation"
    prompt: "F=96 and P_out=32: how many passes? And for F=100? What happens to the surplus?"
    expected_answer: "ceil(96/32) = 3 passes. For F=100, ceil(100/32) = 4 passes produce 128 steps and the surplus 28 is truncated."
    explanation: "Iterative passes are ceil(F / P_out)."
    common_wrong_answer: "Rounding down and under-counting passes."
    source_ids: ["src-58"]

  - id: "q-tsfm-architecture-002"
    workbook: "addendum-04-05-tsfm"
    chapter: "architecture-families-and-horizon-filling"
    topic: "Horizon-filling classes"
    difficulty: "core"
    question_type: "recall"
    prompt: "A model receives context plus eight masked horizon patches and outputs all eight in one pass. Which class is this, and does error accumulate through feedback?"
    expected_answer: "Class (ii), a single pass over placeholders. No output is fed back, so there is no feedback accumulation."
    explanation: "Feedback accumulation needs outputs to become inputs."
    common_wrong_answer: "Calling every multi-patch forecast autoregressive."
    source_ids: ["src-59", "src-61"]

  - id: "q-tsfm-architecture-003"
    workbook: "addendum-04-05-tsfm"
    chapter: "architecture-families-and-horizon-filling"
    topic: "Passes versus sequential compute"
    difficulty: "core"
    question_type: "misconception_diagnosis"
    prompt: "'One forward pass means the compute is not sequential.' Why can this be false?"
    expected_answer: "A recurrent backbone updates its state step by step even within one forecast pass, so the work is sequential in time."
    explanation: "Passes are not wall-clock time."
    common_wrong_answer: "Equating pass count with sequential depth."
    source_ids: ["src-59"]

  - id: "q-tsfm-architecture-004"
    workbook: "addendum-04-05-tsfm"
    chapter: "architecture-families-and-horizon-filling"
    topic: "Teacher forcing and error accumulation"
    difficulty: "core"
    question_type: "explanation"
    prompt: "Under teacher forcing, where can feedback errors appear, and where can they not?"
    expected_answer: "They cannot appear in training, where true previous values are supplied. They can appear only in an inference rollout in which the model reads its own outputs."
    explanation: "Training sees all positions in parallel with the truth."
    common_wrong_answer: "Placing error accumulation in training."
    source_ids: []

  - id: "q-tsfm-architecture-005"
    workbook: "addendum-04-05-tsfm"
    chapter: "architecture-families-and-horizon-filling"
    topic: "Feeding back quantile outputs"
    difficulty: "stretch"
    question_type: "explanation"
    prompt: "Why is feeding back a nine-quantile output not automatic?"
    expected_answer: "The next input must be one value or patch but the output holds nine numbers, so some rule must reduce or choose among them; how Moirai 2.0 does this is not covered here."
    explanation: "A rule is needed; the feedback details of the one paper that mentions recursive multi-quantile decoding were not read."
    common_wrong_answer: "Inventing a specific rule for a named model."
    source_ids: ["src-62"]

  - id: "q-tsfm-architecture-006"
    workbook: "addendum-04-05-tsfm"
    chapter: "architecture-families-and-horizon-filling"
    topic: "Iterative versus direct (interview)"
    difficulty: "stretch"
    question_type: "compare_and_contrast"
    prompt: "Interview-style question: compare iterative and direct horizon filling on pass count and exposure to a model's own errors, and say which claims you could not make without evidence."
    expected_answer: "Iterative needs ceil(F/P_out) passes and reads its own outputs; direct needs one pass and has no feedback. You could not claim direct is more accurate, or that iterative error growth is large, without experiments on the models in question."
    explanation: "Logical differences are derived; accuracy claims need evidence."
    common_wrong_answer: "Asserting direct is more accurate."
    source_ids: ["src-58", "src-64"]

  - id: "q-tsfm-outputs-001"
    workbook: "addendum-04-05-tsfm"
    chapter: "outputs-and-losses"
    topic: "Pinball loss calculation"
    difficulty: "core"
    question_type: "calculation"
    prompt: "Observed 10, forecast 6, tau = 0.9: what is the pinball loss? And for forecast 14?"
    expected_answer: "Forecast 6: 0.9 x 4 = 3.6. Forecast 14: 0.1 x 4 = 0.4."
    explanation: "Under-forecasts are weighted by tau, over-forecasts by 1 - tau."
    common_wrong_answer: "Swapping the two weights."
    source_ids: ["src-57", "src-59"]

  - id: "q-tsfm-outputs-002"
    workbook: "addendum-04-05-tsfm"
    chapter: "outputs-and-losses"
    topic: "Median at tau 0.5"
    difficulty: "core"
    question_type: "calculation"
    prompt: "At tau = 0.5 with absolute error 4, what is the pinball loss, and what does that imply for the point forecast?"
    expected_answer: "2, half the absolute error; the point forecast of a model trained at tau = 0.5 is its median."
    explanation: "Pinball at 0.5 is half the absolute error."
    common_wrong_answer: "Saying the point forecast is the mean."
    source_ids: ["src-57", "src-59"]

  - id: "q-tsfm-outputs-003"
    workbook: "addendum-04-05-tsfm"
    chapter: "outputs-and-losses"
    topic: "Cross-entropy is not distance-aware"
    difficulty: "core"
    question_type: "misconception_diagnosis"
    prompt: "Two bin models assign the target bin the same probability. Must their cross-entropy differ if one puts its remaining mass nearer the target?"
    expected_answer: "No. Cross-entropy depends only on the probability of the target bin, so a near miss and a far miss cost the same."
    explanation: "The Chronos paper states that its loss is not distance-aware."
    common_wrong_answer: "Expecting nearer mass to lower the loss."
    source_ids: ["src-56"]

  - id: "q-tsfm-outputs-004"
    workbook: "addendum-04-05-tsfm"
    chapter: "outputs-and-losses"
    topic: "Output-loss pairing"
    difficulty: "intro"
    question_type: "recall"
    prompt: "Which output type goes with each loss: cross-entropy, squared error, pinball, mixture likelihood?"
    expected_answer: "Cross-entropy: bins. Squared error: point forecasts. Pinball: quantiles. Mixture likelihood: mixture distributions."
    explanation: "Each loss matches the object the head emits."
    common_wrong_answer: "Pairing pinball loss with point outputs."
    source_ids: ["src-56", "src-58", "src-59", "src-61"]

  - id: "q-tsfm-outputs-005"
    workbook: "addendum-04-05-tsfm"
    chapter: "outputs-and-losses"
    topic: "Mass versus density"
    difficulty: "stretch"
    question_type: "compare_and_contrast"
    prompt: "Why is a bin cross-entropy not directly comparable with a Student-t likelihood?"
    expected_answer: "Bin cross-entropy is a probability mass over bins; a Student-t likelihood is a density. For a fine bin width w, mass is about density times w, so they differ by log w."
    explanation: "Losses are comparable only within one output type and one scaling."
    common_wrong_answer: "Comparing the raw numbers."
    source_ids: ["src-56", "src-63"]

  - id: "q-tsfm-outputs-006"
    workbook: "addendum-04-05-tsfm"
    chapter: "outputs-and-losses"
    topic: "Ranking by training loss (interview)"
    difficulty: "stretch"
    question_type: "explanation"
    prompt: "Interview-style question: two forecasting models report different training losses. List three reasons the numbers cannot be ranked."
    expected_answer: "Different scalers; different output types (mass, density, pinball); different bin or quantile settings, data or horizons; and a training loss is not an evaluation metric."
    explanation: "Losses live on scaled values and depend on the output type."
    common_wrong_answer: "Ranking models by the lower loss."
    source_ids: ["src-56", "src-57", "src-63"]

  - id: "q-tsfm-data-001"
    workbook: "addendum-04-05-tsfm"
    chapter: "pretraining-data-adaptation-and-leakage"
    topic: "Capped allocation"
    difficulty: "core"
    question_type: "calculation"
    prompt: "Three sub-datasets have 6M, 3M and 1M observations. Using the capped rule with a toy epsilon of 0.4, what are the renormalized sampling shares?"
    expected_answer: "Proportional shares 0.6, 0.3, 0.1; capped weights 0.4, 0.3, 0.1 (sum 0.8); renormalized shares 0.5, 0.375 and 0.125."
    explanation: "omega = min(proportional share, epsilon), then renormalize. The rule's form is the original Moirai paper's; epsilon = 0.4 is a toy value (the paper's is 0.001)."
    common_wrong_answer: "Forgetting to renormalize after capping, which leaves shares summing to 0.8."
    source_ids: ["src-61"]

  - id: "q-tsfm-data-002"
    workbook: "addendum-04-05-tsfm"
    chapter: "pretraining-data-adaptation-and-leakage"
    topic: "Normalization-statistics leakage"
    difficulty: "core"
    question_type: "debugging"
    prompt: "A scaler's mean is computed over the whole series, then the last 20% is held out for evaluation. Which leakage route is this?"
    expected_answer: "A normalization-statistics leak: the mean already reflects the held-out window."
    explanation: "Statistics must use only data before the forecast origin."
    common_wrong_answer: "Calling it benign because no values are copied."
    source_ids: ["src-62"]

  - id: "q-tsfm-data-003"
    workbook: "addendum-04-05-tsfm"
    chapter: "pretraining-data-adaptation-and-leakage"
    topic: "Time-overlap leakage"
    difficulty: "core"
    question_type: "explanation"
    prompt: "Why can training on a different series leak the answer for an evaluation series?"
    expected_answer: "A different series from the same period and domain can contain the same events, so the model may have seen the answer without any series being repeated."
    explanation: "This is time overlap."
    common_wrong_answer: "Checking only for identical series."
    source_ids: []

  - id: "q-tsfm-data-004"
    workbook: "addendum-04-05-tsfm"
    chapter: "pretraining-data-adaptation-and-leakage"
    topic: "Zero-shot meaning"
    difficulty: "core"
    question_type: "misconception_diagnosis"
    prompt: "'A zero-shot result proves the model saw nothing like the test series.' What is wrong?"
    expected_answer: "Zero-shot means no weight updates on the target series. It says nothing about what the pretraining corpus contained."
    explanation: "Overlap with the benchmark is what leakage checks examine."
    common_wrong_answer: "Equating zero-shot with unseen data."
    source_ids: ["src-57"]

  - id: "q-tsfm-data-005"
    workbook: "addendum-04-05-tsfm"
    chapter: "pretraining-data-adaptation-and-leakage"
    topic: "TSFM versus LLM data mixing"
    difficulty: "intro"
    question_type: "compare_and_contrast"
    prompt: "Name one way TSFM data mixing resembles LLM mixing and one way it differs."
    expected_answer: "Similar: allocation is weight times budget, and pretraining stays separate from evaluation. Different: the units are series, sub-datasets are capped, and leakage includes time overlap and normalization windows."
    explanation: "The arithmetic transfers; the leakage routes are series-specific."
    common_wrong_answer: "Treating the two as identical."
    source_ids: ["src-61"]

  - id: "q-tsfm-data-006"
    workbook: "addendum-04-05-tsfm"
    chapter: "pretraining-data-adaptation-and-leakage"
    topic: "Leakage checks (interview)"
    difficulty: "stretch"
    question_type: "design"
    prompt: "Interview-style question: before claiming zero-shot performance on a new benchmark, what leakage checks would you run?"
    expected_answer: "Exclude pretraining datasets that overlap the benchmark's series; check time overlap between pretraining periods and evaluation windows; confirm scaler statistics use only data before the forecast origin; state what could not be checked."
    explanation: "Covers both series-specific routes and honest reporting of gaps."
    common_wrong_answer: "Relying on the word zero-shot."
    source_ids: ["src-66"]

  - id: "q-tsfm-release-001"
    workbook: "addendum-04-05-tsfm"
    chapter: "reading-a-tsfm-release"
    topic: "Source-type classification"
    difficulty: "intro"
    question_type: "recall"
    prompt: "'The model has 330 million parameters' appears in a vendor blog. What is its source type, and is it paper-backed?"
    expected_answer: "A vendor claim; it is not paper-backed, because no paper for this release was found."
    explanation: "Blog statements about size are vendor claims."
    common_wrong_answer: "Treating it as a paper result."
    source_ids: ["src-67"]

  - id: "q-tsfm-release-002"
    workbook: "addendum-04-05-tsfm"
    chapter: "reading-a-tsfm-release"
    topic: "Generation error"
    difficulty: "core"
    question_type: "debugging"
    prompt: "A slide says 'TimesFM 2.5 predicts the horizon in one pass, as the TimesFM paper shows.' Identify the generation error."
    expected_answer: "The TimesFM paper describes the original 2024 model, which rolls out output patches iteratively; it does not describe 2.5, and the sources read give no mechanism for 2.5."
    explanation: "A link to an earlier paper does not make it describe a later release."
    common_wrong_answer: "Carrying a paper's claims across generations."
    source_ids: ["src-58", "src-65"]

  - id: "q-tsfm-release-003"
    workbook: "addendum-04-05-tsfm"
    chapter: "reading-a-tsfm-release"
    topic: "Unresolved discrepancy"
    difficulty: "core"
    question_type: "explanation"
    prompt: "Which statements about TimesFM 3.0 cannot be reconciled from the pages alone, and what must you not do about it?"
    expected_answer: "The blog's 330 million parameters versus the card's 20 layers, width 1280 and 16 heads (and the 32-step versus 32-and-64 patch statements). Do not guess an explanation or pick one number; report the discrepancy and what would settle it."
    explanation: "No source supports an explanation."
    common_wrong_answer: "Reconciling the numbers with a plausible guess."
    source_ids: ["src-66", "src-67"]

  - id: "q-tsfm-release-004"
    workbook: "addendum-04-05-tsfm"
    chapter: "reading-a-tsfm-release"
    topic: "Adoption questions (interview)"
    difficulty: "stretch"
    question_type: "design"
    prompt: "Interview-style question: you are asked whether to adopt a new TSFM. Which five checklist items do you ask about first, and why?"
    expected_answer: "For example: exact generation and source type of each fact; scaler, patch length and the unit of the context figure; horizon filling and what is training-only; output and whether the loss is documented; pretraining data and leakage against your benchmark."
    explanation: "These decide whether claims transfer to your setting."
    common_wrong_answer: "Asking only for a leaderboard rank."
    source_ids: []
