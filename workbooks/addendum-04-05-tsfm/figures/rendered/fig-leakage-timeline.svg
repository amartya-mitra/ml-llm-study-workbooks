<svg xmlns="http://www.w3.org/2000/svg" width="620" height="322" viewBox="0 0 620 322">
  <title>Leakage timeline: training region, normalization window, evaluation window</title>
  <defs><marker id="arrow-333333" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="arrow-555555" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
  <rect x="0" y="0" width="620" height="322" fill="#ffffff"/>
  <text x="310.0" y="18" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">Where leakage can enter along one series (illustrative windows)</text>
  <text x="10" y="34" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">No overlap</text>
  <text x="134" y="63" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="end">training region</text>
  <g id="correct-training">
  <rect x="140.0" y="50" width="270.0" height="18" rx="2" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  </g>
  <text x="134" y="87" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="end">statistics window</text>
  <g id="correct-statistics">
  <rect x="140.0" y="74" width="270.0" height="18" rx="2" fill="#009E73" stroke="#333333" stroke-width="1"/>
  </g>
  <text x="134" y="111" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="end">evaluation window</text>
  <g id="correct-evaluation">
  <rect x="500.0" y="98" width="90.0" height="18" rx="2" fill="#E69F00" stroke="#333333" stroke-width="1"/>
  </g>
  <line x1="500.0" y1="126" x2="500.0" y2="122" stroke="#333333" stroke-width="1" marker-end="url(#arrow-333333)"/>
  <text x="140" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">both end before the evaluation window starts</text>
  <line x1="140" y1="154" x2="590" y2="154" stroke="#555555" stroke-width="1" marker-end="url(#arrow-555555)"/>
  <text x="10" y="172" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#D55E00" text-anchor="start">Leaky</text>
  <text x="134" y="201" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="end">training region</text>
  <g id="leaky-training">
  <rect x="140.0" y="188" width="405.0" height="18" rx="2" fill="#0072B2" stroke="#333333" stroke-width="1"/>
  </g>
  <text x="134" y="225" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="end">statistics window</text>
  <g id="leaky-statistics">
  <rect x="140.0" y="212" width="450.0" height="18" rx="2" fill="#009E73" stroke="#333333" stroke-width="1"/>
  </g>
  <text x="134" y="249" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="end">evaluation window</text>
  <g id="leaky-evaluation">
  <rect x="500.0" y="236" width="90.0" height="18" rx="2" fill="#E69F00" stroke="#333333" stroke-width="1"/>
  </g>
  <line x1="500.0" y1="264" x2="500.0" y2="260" stroke="#333333" stroke-width="1" marker-end="url(#arrow-333333)"/>
  <g id="leaky-overlap-train">
  <rect x="500.0" y="186" width="45.0" height="22" rx="2" fill="none" stroke="#D55E00" stroke-width="3"/>
  </g>
  <g id="leaky-overlap-stats">
  <rect x="500.0" y="210" width="90.0" height="22" rx="2" fill="none" stroke="#D55E00" stroke-width="3"/>
  </g>
  <text x="140" y="282" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#D55E00" text-anchor="start">training reaches 0.10 into evaluation; statistics reach 0.20 in</text>
  <line x1="140" y1="292" x2="590" y2="292" stroke="#555555" stroke-width="1" marker-end="url(#arrow-555555)"/>
  <text x="140" y="314" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">time along the series (normalized 0 to 1)</text>
</svg>
