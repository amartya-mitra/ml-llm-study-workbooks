<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330">
  <title>Horizon filling strategies on one shared timeline</title>
  <defs></defs>
  <rect x="0" y="0" width="620" height="330" fill="#ffffff"/>
  <text x="310.0" y="18" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">Filling a 256-step horizon: passes depend on the strategy (illustrative setting)</text>
  <rect x="168.0" y="30" width="186.0" height="22" rx="3" fill="#eaf2fb" stroke="#0072B2" stroke-width="1.2"/>
  <text x="261.0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">context  T_ctx = 256</text>
  <rect x="354.0" y="30" width="186.0" height="22" rx="3" fill="#fdf1d6" stroke="#E69F00" stroke-width="1.2"/>
  <text x="447.0" y="45" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="middle">horizon  F = 256</text>
  <text x="168.0" y="64" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">time step 0</text>
  <text x="540.0" y="64" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="end">512</text>
  <text x="10" y="87" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">iterative, P_out = 128</text>
  <text x="10" y="101" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">output patch longer than input</text>
  <rect x="168.0" y="74" width="186.0" height="22" rx="2" fill="#eaf2fb" stroke="#0072B2" stroke-width="0.8"/>
  <g id="pass-0-0">
  <rect x="354.0" y="74" width="93.0" height="22" rx="2" fill="#E69F00" stroke="#333333" stroke-width="0.8"/>
  <text x="400.5" y="89" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">1</text>
  </g>
  <g id="pass-0-1">
  <rect x="447.0" y="74" width="93.0" height="22" rx="2" fill="#E69F00" stroke="#333333" stroke-width="0.8"/>
  <text x="493.5" y="89" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">2</text>
  </g>
  <text x="548" y="89" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="start">2 passes</text>
  <text x="10" y="123" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">iterative, P_out = 32</text>
  <text x="10" y="137" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">output patch = input patch</text>
  <rect x="168.0" y="110" width="186.0" height="22" rx="2" fill="#eaf2fb" stroke="#0072B2" stroke-width="0.8"/>
  <g id="pass-1-0">
