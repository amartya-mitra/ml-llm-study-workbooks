  </g>
  <g id="pass-1-4">
  <rect x="447.0" y="110" width="23.25" height="22" rx="2" fill="#E69F00" stroke="#333333" stroke-width="0.8"/>
  <text x="458.625" y="125" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">5</text>
  </g>
  <g id="pass-1-5">
  <rect x="470.25" y="110" width="23.25" height="22" rx="2" fill="#E69F00" stroke="#333333" stroke-width="0.8"/>
  <text x="481.875" y="125" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">6</text>
  </g>
  <g id="pass-1-6">
  <rect x="493.5" y="110" width="23.25" height="22" rx="2" fill="#E69F00" stroke="#333333" stroke-width="0.8"/>
  <text x="505.125" y="125" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">7</text>
  </g>
  <g id="pass-1-7">
  <rect x="516.75" y="110" width="23.25" height="22" rx="2" fill="#E69F00" stroke="#333333" stroke-width="0.8"/>
  <text x="528.375" y="125" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">8</text>
  </g>
  <text x="548" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="start">8 passes</text>
  <text x="10" y="159" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">iterative, 1 value per pass</text>
  <text x="10" y="173" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">one token or value at a time</text>
  <rect x="168.0" y="146" width="186.0" height="22" rx="2" fill="#eaf2fb" stroke="#0072B2" stroke-width="0.8"/>
  <rect x="354.0" y="146" width="186.0" height="22" rx="2" fill="#E69F00" stroke="#333333" stroke-width="0.8"/>
  <g id="pass-2-dense"></g>
  <text x="447.0" y="161" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">1 … 256</text>
  <text x="548" y="161" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="start">256 passes</text>
  <text x="10" y="195" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">one pass, placeholders</text>
  <text x="10" y="209" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">no feedback loop</text>
  <rect x="168.0" y="182" width="186.0" height="22" rx="2" fill="#eaf2fb" stroke="#0072B2" stroke-width="0.8"/>
  <g id="placeholder-0">
