  <text x="365.625" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="middle">?</text>
  </g>
  <g id="placeholder-1">
  <rect x="377.25" y="182" width="23.25" height="22" rx="2" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="388.875" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="middle">?</text>
  </g>
  <g id="placeholder-2">
  <rect x="400.5" y="182" width="23.25" height="22" rx="2" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="412.125" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="middle">?</text>
  </g>
  <g id="placeholder-3">
  <rect x="423.75" y="182" width="23.25" height="22" rx="2" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="435.375" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="middle">?</text>
  </g>
  <g id="placeholder-4">
  <rect x="447.0" y="182" width="23.25" height="22" rx="2" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="458.625" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="middle">?</text>
  </g>
  <g id="placeholder-5">
  <rect x="470.25" y="182" width="23.25" height="22" rx="2" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="481.875" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="middle">?</text>
  </g>
  <g id="placeholder-6">
  <rect x="493.5" y="182" width="23.25" height="22" rx="2" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="505.125" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="middle">?</text>
  </g>
  <g id="placeholder-7">
  <rect x="516.75" y="182" width="23.25" height="22" rx="2" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="528.375" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="middle">?</text>
  </g>
  <text x="548" y="197" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="start">1 pass</text>
  <text x="10" y="231" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">direct head</text>
  <text x="10" y="245" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">one head over the whole horizon</text>
  <rect x="168.0" y="218" width="186.0" height="22" rx="2" fill="#eaf2fb" stroke="#0072B2" stroke-width="0.8"/>
  <g id="direct-4">
  <rect x="354.0" y="218" width="186.0" height="22" rx="2" fill="#E69F00" stroke="#333333" stroke-width="0.8"/>
  <text x="447.0" y="233" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">whole horizon at once</text>
  </g>
  <text x="548" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="start">1 pass</text>
  <rect x="10" y="264" width="292" height="54" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="18" y="281" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="start">Training only</text>
  <text x="18" y="296" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">patch masking, contiguous patch masking,</text>
  <text x="18" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">extra future-patch targets</text>
  <rect x="318" y="264" width="292" height="54" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
  <text x="326" y="281" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="start">Inference only</text>
  <text x="326" y="296" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">rollout (own output fed back) or one pass</text>
  <text x="326" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#444444" text-anchor="start">over placeholders; feedback errors need a rollout</text>
