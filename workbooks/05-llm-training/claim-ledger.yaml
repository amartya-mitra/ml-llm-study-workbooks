# Workbook 05's source/claim ledger. Schema: shared/claim-ledger-schema.yaml.
#
# `entries` now has real records for Chapters 1 and 2 (drafted
# 2026-09-26 and 2026-09-27), each tied to an actual sentence/number in
# that chapter -- not invented ahead of drafting, per
# reports/05_llm_training_scope_and_source_decision.md's gate. Chapters
# 3-6 remain undrafted; do not add entries for them until they are
# actually written.
#
# `planned_chapter_source` records below are chapter-level source
# mappings only -- which already-verified sources each chapter intends
# to draw on, per reports/05_llm_training_scope_and_source_decision.md's
# chapter-readiness table. They name no specific claim and are not a
# substitute for a real `entries` record once drafting starts.

schema_version: 1
entries:
  - id: "claim-05-pretraining-data-001"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "SmolLM3's own architecture ablations used the full 3B target model trained on 100B tokens (rather than the eventual 11T); Kimi K2's developers ran some ablations on a smaller 3B/0.5B-active proxy model rather than their full 1T/32B-active target."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-pretraining-data-002"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "If a change hurts performance at small scale, it can be confidently ruled out at large scale; a positive small-scale result needs more tokens trained before it can be trusted at full scale."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: "This is the source's own reported experience/methodology, not a formally proven theorem -- presented in the chapter as such."

  - id: "claim-05-pretraining-data-003"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "Training on Wikipedia produces a lower loss than training on general web pages, because Wikipedia's more formulaic phrasing makes the next token more predictable -- but this lower loss does not by itself mean a more capable model."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-pretraining-data-004"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "For a 7B model, one independently reported study found MMLU multiple-choice-format performance stayed at chance level until roughly 500B training tokens; for a 1.7B model, the source's own prior work found this happened at roughly 6T tokens."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: "Each figure is that specific study's own reported number for its own specific model/setup -- presented in the chapter explicitly as non-universal."

  - id: "claim-05-pretraining-data-005"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "Recent large models (SmolLM2, Llama 3, OLMo 2) use multi-stage/curriculum data mixtures rather than one fixed mixture for the whole run, motivated by evidence that a model's final behavior is disproportionately shaped by data seen late in training."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-pretraining-data-006"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "Heavy repetition of a small, aggressively-filtered document pool (forced by a large token budget) can hurt model performance, per prior work cited by this chapter's source."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: "src-16 itself cites a further paper (Muennighoff et al.) for this specific claim; that further paper was not independently fetched/verified this session -- the claim is recorded here as src-16's own reported citation, not independently re-verified against the original."

  - id: "claim-05-pretraining-data-007"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "One disclosed 1B-parameter ablation baseline config mixes fineweb-edu (weight 0.7), stack-edu-python (weight 0.2), and finemath-3plus (weight 0.1), with a global batch size of 1.5M tokens/step over 20,000 steps, totaling 30B tokens."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: "Used as this chapter's worked example; the 21B/6B/3B per-source token allocation is this chapter's own arithmetic (weight x total), not itself a source-reported number."

  - id: "claim-05-pretraining-data-008"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "For a 1B-parameter model, the Chinchilla-optimal compute-optimal token budget is approximately 35B tokens; the source's own team trained their 1B ablation baseline on 45B tokens instead, specifically for a more stable ablation signal."
    source_ids: ["src-16", "src-51"]
    verification_status: "verified_full_text"
    note: "The ~35B figure is src-16's own stated approximation, attributed by src-16 to the Chinchilla paper (src-51); not independently recomputed from src-51's own formula in this chapter."

  - id: "claim-05-mtp-001"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "Gloeckle et al.'s independent-heads MTP design uses a shared trunk producing one latent representation z_t:1, from which n independent output heads predict n future tokens; only the next-token head is kept at inference by default."
    source_ids: ["src-43"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-mtp-002"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "The trunk and the unembedding matrix are shared across all n heads in the independent-heads design; only each head's own transformer layers are duplicated per head."
    source_ids: ["src-43"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-mtp-003"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "Gloeckle et al.'s sequential-computation implementation reduces peak GPU memory from O(nV+d) to O(V+d) 'at no expense in runtime,' per the paper's own stated result."
    source_ids: ["src-43"]
    verification_status: "verified_full_text"
    note: "Presented in the chapter as this paper's own reported result for its own implementation, not a universal guarantee."

  - id: "claim-05-mtp-004"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "DeepSeek-V3's MTP design sequentially predicts D additional tokens, keeping a complete causal chain at each prediction depth, explicitly differing from Gloeckle et al.'s parallel independent heads."
    source_ids: ["src-33"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-mtp-005"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "At depth k, DeepSeek-V3's module combines the previous depth's hidden state with the actual embedding of the ground-truth target token (teacher forcing); the embedding layer and output head are shared across all depths and with the main model, while each depth's transformer block and projection matrix are depth-specific."
    source_ids: ["src-33"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-mtp-006"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "Both papers state that the auxiliary heads/modules are discarded at inference by default, leaving only the ordinary next-token path; both separately note that the discarded components could instead be repurposed for self-speculative decoding as an optional design choice."
    source_ids: ["src-43", "src-33"]
    verification_status: "verified_full_text"
    note: "The MTP-vs-speculative-decoding distinction is the chapter's required boundary with workbook 06; not elaborated beyond stating the option exists."

  - id: "claim-05-mtp-007"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "Gloeckle et al. report their 13B model solving 12% more problems on HumanEval and 17% more on MBPP than a comparable next-token model, and separately report that multi-token prediction models are worse than the baseline for small model sizes but outperform it at scale."
    source_ids: ["src-43"]
    verification_status: "verified_full_text"
    note: "Both figures are this paper's own reported results for its own models/benchmarks -- presented in the chapter as non-universal, model-size-dependent effects, not a general MTP quality guarantee."

  - id: "claim-05-mtp-008"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "Gloeckle et al. report up to 3x inference speedup using self-speculative decoding with models trained via 4-token prediction."
    source_ids: ["src-43"]
    verification_status: "verified_full_text"
    note: "This is the paper's own reported speedup for its own self-speculative-decoding setup, not a general inference-speed guarantee for any MTP-trained model regardless of serving strategy or hardware."

  - id: "claim-05-scaling-001"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Kaplan et al.'s empirical loss scales as a power law with model size N, dataset size D, and compute C individually, each fit as L(N)=(Nc/N)^aN with aN~=0.076 and Nc~=8.8e13, L(D)=(Dc/D)^aD with aD~=0.095 and Dc~=5.4e13, and L(Cmin)=(Ccmin/Cmin)^aCmin with aCmin~=0.050 and Ccmin~=3.1e8 PF-days."
    source_ids: ["src-50"]
    verification_status: "verified_full_text"
    note: "The paper's own text states these specific constants depend on tokenizer/vocabulary and 'do not have a fundamental meaning' -- presented in the chapter as this paper's own fits, not universal constants."

  - id: "claim-05-scaling-002"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Kaplan et al.'s fixed-compute-budget allocation result predicts N ~ Cmin^0.73 and D ~ Cmin^0.27, implying compute-optimal training uses a very large model, a comparatively modest amount of data, and stops significantly before convergence."
    source_ids: ["src-50"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-scaling-003"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Hoffmann et al. define the compute-optimal allocation problem as choosing N_opt(C) and D_opt(C) to minimize loss L(N,D) subject to FLOPs(N,D)=C, and using three independent fitting approaches over 400+ trained models find Nopt~C^a and Dopt~C^b with a and b both close to 0.50 (0.50/0.50, 0.49/0.51, 0.46/0.54 across the three approaches), versus Kaplan et al.'s own 0.73/0.27."
    source_ids: ["src-51"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-scaling-004"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Hoffmann et al. state they reach 'the same conclusion' as Kaplan et al. about not training to lowest possible loss, while revising the specific token/parameter scaling ratio -- framed by the paper itself as a revision, not a contradiction."
    source_ids: ["src-51"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-scaling-005"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Hoffmann et al. attribute the difference in fitted exponents to a methodological issue: Kaplan et al. used a fixed number of training tokens and learning-rate schedule length across all runs, whereas matching the schedule length to each run's actual token budget produces the best final loss regardless of model size."
    source_ids: ["src-51"]
    verification_status: "verified_full_text"
    note: "Corroborated independently by src-16's own practitioner-facing explanation of the same schedule-length issue (claim-05-scaling-006)."

  - id: "claim-05-scaling-006"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "The Smol Training Playbook states that a fixed cosine-schedule length 'skewed early scaling laws research' because Kaplan et al. used a fixed schedule length when training models on varying token counts, underestimating the impact of data size; the Chinchilla study corrected this by matching schedule length to each model's actual training duration."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-scaling-007"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "The Smol Training Playbook's disclosed 1B-parameter ablation baseline configuration uses AdamW with beta1=0.9, beta2=0.95, epsilon=1e-8, a linear warmup over 2,000 steps, and a cosine decay over 18,000 steps down to a minimum learning-rate floor."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-scaling-008"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Chinchilla (70B parameters, trained on 1.4 trillion tokens) uses the same training compute as Gopher (280B parameters, 300 billion tokens) but uniformly and significantly outperforms Gopher, GPT-3 (175B), Jurassic-1 (178B), and Megatron-Turing NLG (530B) on downstream evaluations, reaching 67.5% average accuracy on MMLU, 'greater than a 7% improvement over Gopher.'"
    source_ids: ["src-51"]
    verification_status: "verified_full_text"
    note: "Presented in the chapter as a separate downstream-capability result, not itself the loss-based quantity that N_opt/D_opt are derived from."

  - id: "claim-05-scaling-009"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Hoffmann et al.'s own Table 3 projects 1.5 trillion tokens as the compute-optimal frontier value for exactly a 67-billion-parameter model; the Chinchilla model they actually trained is 70 billion parameters on 1.4 trillion tokens, described in their own text as 'the larger end' of a predicted 40-70 billion parameter range, chosen for dataset and computational efficiency reasons rather than read directly off the fitted frontier."
    source_ids: ["src-51"]
    verification_status: "verified_full_text"
    note: "The 67B Table 3 row and the 70B actually-trained Chinchilla model are two distinct numbers from the same paper; the chapter deliberately does not conflate them."

  - id: "claim-05-scaling-010"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "The Smol Training Playbook reports SmolLM3 was trained with 3 billion parameters on 11 trillion tokens, a deliberate 'overtraining' choice relative to scaling-law advice, made because a smaller, longer-trained model is cheaper to run at inference."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: "The ~180x overtraining factor relative to an interpolated Chinchilla-optimal estimate for a 3B model is this chapter's own computed_by_script comparison (see claim-05-scaling-011), not a number either source states directly."

  - id: "claim-05-scaling-011"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Interpolating Hoffmann et al.'s Table 3 tokens-per-parameter ratio (which ranges from 20.00 to 22.39 across the table's own rows) to a 3-billion-parameter model gives an estimated Chinchilla-optimal token budget of approximately 61.0 billion tokens, versus SmolLM3's actual 11 trillion tokens -- an overtraining factor of approximately 180x."
    source_ids: ["src-51", "src-16"]
    verification_status: "computed_by_script"
    note: "Table 3's own rows are quoted verbatim from src-51; the interpolation to 3B and the resulting ratio/factor are computed by data/worked-examples/scaling_law_allocation.py, not stated by either source."

planned_chapter_sources:
  - chapter: "ch1"
    source_ids: ["src-16"]
    candidate_source_ids: []
    note: "Cite only src-16's pretraining-scoped sections; its post-training section is out of bounds for this workbook."

  - chapter: "ch2"
    source_ids: ["src-43", "src-33"]
    candidate_source_ids: []
    note: "Workbook 05's assigned primary home for MTP per config/series-topic-roadmap.yaml. src-43 is the independent-heads design; src-33 is DeepSeek-V3's causal-chain design -- teach both, present as two designs, not one mechanism."

  - chapter: "ch3"
    source_ids: ["src-50", "src-51", "src-16"]
    candidate_source_ids: []
    note: "src-51 (Chinchilla) revises src-50 (Kaplan)'s token/parameter ratio; teach as a revision, not a contradiction, per src-51's own framing. src-16 covers AdamW/cosine-schedule practicalities, not scaling laws themselves."

  - chapter: "ch4"
    source_ids: ["src-17"]
    candidate_source_ids: ["GPipe (arXiv:1811.06965)", "Megatron-LM (arXiv:1909.08053)", "ZeRO (arXiv:1910.02054)"]
    note: "GPipe/Megatron-LM/ZeRO are confirmed to exist and be fetchable (arXiv PDFs return HTTP 200) but were NOT read in full text this session -- do not treat title/abstract confirmation as verification. Read in full and register in sources/registry.yaml during this chapter's own drafting, per reports/05_llm_training_scope_and_source_decision.md section 2, before citing any of the three for a specific claim."

  - chapter: "ch5"
    source_ids: ["src-10", "src-17"]
    candidate_source_ids: ["GPipe (arXiv:1811.06965)", "Megatron-LM (arXiv:1909.08053)", "ZeRO (arXiv:1910.02054)"]
    note: "Same candidate-source status as ch4 -- not yet verified, not yet registered."

  - chapter: "ch6"
    source_ids: ["src-32", "src-33"]
    candidate_source_ids: []
    note: "Reuses workbook 04 ch. 6's exact source registrations. A spot-check of these sources' already-verified full text specifically for training-infrastructure numbers is still pending -- do this during this chapter's own drafting, per reports/05_llm_training_scope_and_source_decision.md section 3."
