# Workbook 05's source/claim ledger. Schema: shared/claim-ledger-schema.yaml.
#
# `entries` now has real records for Chapters 1 and 2 (drafted
# 2026-09-26 and 2026-09-27), each tied to an actual sentence/number in
# that chapter -- not invented ahead of drafting, per
# reports/05_llm_training_scope_and_source_decision.md's gate. Chapters
# 3-6 remain undrafted; do not add entries for them until they are
# actually written.
#
# `planned_chapter_source` records below are chapter-level source
# mappings only -- which already-verified sources each chapter intends
# to draw on, per reports/05_llm_training_scope_and_source_decision.md's
# chapter-readiness table. They name no specific claim and are not a
# substitute for a real `entries` record once drafting starts.

schema_version: 1
entries:
  - id: "claim-05-pretraining-data-001"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "SmolLM3's own architecture ablations used the full 3B target model trained on 100B tokens (rather than the eventual 11T); Kimi K2's developers ran some ablations on a smaller 3B/0.5B-active proxy model rather than their full 1T/32B-active target."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-pretraining-data-002"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "If a change hurts performance at small scale, it can be confidently ruled out at large scale; a positive small-scale result needs more tokens trained before it can be trusted at full scale."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: "This is the source's own reported experience/methodology, not a formally proven theorem -- presented in the chapter as such."

  - id: "claim-05-pretraining-data-003"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "Training on Wikipedia produces a lower loss than training on general web pages, because Wikipedia's more formulaic phrasing makes the next token more predictable -- but this lower loss does not by itself mean a more capable model."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-pretraining-data-004"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "For a 7B model, one independently reported study found MMLU multiple-choice-format performance stayed at chance level until roughly 500B training tokens; for a 1.7B model, the source's own prior work found this happened at roughly 6T tokens."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: "Each figure is that specific study's own reported number for its own specific model/setup -- presented in the chapter explicitly as non-universal."

  - id: "claim-05-pretraining-data-005"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "Recent large models (SmolLM2, Llama 3, OLMo 2) use multi-stage/curriculum data mixtures rather than one fixed mixture for the whole run, motivated by evidence that a model's final behavior is disproportionately shaped by data seen late in training."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-pretraining-data-006"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "Heavy repetition of a small, aggressively-filtered document pool (forced by a large token budget) can hurt model performance, per prior work cited by this chapter's source."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: "src-16 itself cites a further paper (Muennighoff et al.) for this specific claim; that further paper was not independently fetched/verified this session -- the claim is recorded here as src-16's own reported citation, not independently re-verified against the original."

  - id: "claim-05-pretraining-data-007"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "One disclosed 1B-parameter ablation baseline config mixes fineweb-edu (weight 0.7), stack-edu-python (weight 0.2), and finemath-3plus (weight 0.1), with a global batch size of 1.5M tokens/step over 20,000 steps, totaling 30B tokens."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: "Used as this chapter's worked example; the 21B/6B/3B per-source token allocation is this chapter's own arithmetic (weight x total), not itself a source-reported number."

  - id: "claim-05-pretraining-data-008"
    workbook: "05-llm-training"
    chapter: "ch1"
    statement: "For a 1B-parameter model, the Chinchilla-optimal compute-optimal token budget is approximately 35B tokens; the source's own team trained their 1B ablation baseline on 45B tokens instead, specifically for a more stable ablation signal."
    source_ids: ["src-16", "src-51"]
    verification_status: "verified_full_text"
    note: "The ~35B figure is src-16's own stated approximation, attributed by src-16 to the Chinchilla paper (src-51); not independently recomputed from src-51's own formula in this chapter."

  - id: "claim-05-mtp-001"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "Gloeckle et al.'s independent-heads MTP design uses a shared trunk producing one latent representation z_t:1, from which n independent output heads predict n future tokens; only the next-token head is kept at inference by default."
    source_ids: ["src-43"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-mtp-002"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "The trunk and the unembedding matrix are shared across all n heads in the independent-heads design; only each head's own transformer layers are duplicated per head."
    source_ids: ["src-43"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-mtp-003"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "Gloeckle et al.'s sequential-computation implementation reduces peak GPU memory from O(nV+d) to O(V+d) 'at no expense in runtime,' per the paper's own stated result."
    source_ids: ["src-43"]
    verification_status: "verified_full_text"
    note: "Presented in the chapter as this paper's own reported result for its own implementation, not a universal guarantee."

  - id: "claim-05-mtp-004"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "DeepSeek-V3's MTP design sequentially predicts D additional tokens, keeping a complete causal chain at each prediction depth, explicitly differing from Gloeckle et al.'s parallel independent heads."
    source_ids: ["src-33"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-mtp-005"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "At depth k, DeepSeek-V3's module combines the previous depth's hidden state with the actual embedding of the ground-truth target token (teacher forcing); the embedding layer and output head are shared across all depths and with the main model, while each depth's transformer block and projection matrix are depth-specific."
    source_ids: ["src-33"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-mtp-006"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "Both papers state that the auxiliary heads/modules are discarded at inference by default, leaving only the ordinary next-token path; both separately note that the discarded components could instead be repurposed for self-speculative decoding as an optional design choice."
    source_ids: ["src-43", "src-33"]
    verification_status: "verified_full_text"
    note: "The MTP-vs-speculative-decoding distinction is the chapter's required boundary with workbook 06; not elaborated beyond stating the option exists."

  - id: "claim-05-mtp-007"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "Gloeckle et al. report their 13B model solving 12% more problems on HumanEval and 17% more on MBPP than a comparable next-token model, and separately report that multi-token prediction models are worse than the baseline for small model sizes but outperform it at scale."
    source_ids: ["src-43"]
    verification_status: "verified_full_text"
    note: "Both figures are this paper's own reported results for its own models/benchmarks -- presented in the chapter as non-universal, model-size-dependent effects, not a general MTP quality guarantee."

  - id: "claim-05-mtp-008"
    workbook: "05-llm-training"
    chapter: "ch2"
    statement: "Gloeckle et al. report up to 3x inference speedup using self-speculative decoding with models trained via 4-token prediction."
    source_ids: ["src-43"]
    verification_status: "verified_full_text"
    note: "This is the paper's own reported speedup for its own self-speculative-decoding setup, not a general inference-speed guarantee for any MTP-trained model regardless of serving strategy or hardware."

  - id: "claim-05-scaling-001"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Kaplan et al.'s empirical loss scales as a power law with model size N, dataset size D, and compute C individually, each fit as L(N)=(Nc/N)^aN with aN~=0.076 and Nc~=8.8e13, L(D)=(Dc/D)^aD with aD~=0.095 and Dc~=5.4e13, and L(Cmin)=(Ccmin/Cmin)^aCmin with aCmin~=0.050 and Ccmin~=3.1e8 PF-days."
    source_ids: ["src-50"]
    verification_status: "verified_full_text"
    note: "The paper's own text states these specific constants depend on tokenizer/vocabulary and 'do not have a fundamental meaning' -- presented in the chapter as this paper's own fits, not universal constants."

  - id: "claim-05-scaling-002"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Kaplan et al.'s fixed-compute-budget allocation result predicts N ~ Cmin^0.73 and D ~ Cmin^0.27, implying compute-optimal training uses a very large model, a comparatively modest amount of data, and stops significantly before convergence."
    source_ids: ["src-50"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-scaling-003"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Hoffmann et al. define the compute-optimal allocation problem as choosing N_opt(C) and D_opt(C) to minimize loss L(N,D) subject to FLOPs(N,D)=C, and using three independent fitting approaches over 400+ trained models find Nopt~C^a and Dopt~C^b with a and b both close to 0.50 (0.50/0.50, 0.49/0.51, 0.46/0.54 across the three approaches), versus Kaplan et al.'s own 0.73/0.27."
    source_ids: ["src-51"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-scaling-004"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Hoffmann et al. state they reach 'the same conclusion' as Kaplan et al. about not training to lowest possible loss, while revising the specific token/parameter scaling ratio -- framed by the paper itself as a revision, not a contradiction."
    source_ids: ["src-51"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-scaling-005"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Hoffmann et al. attribute the difference in fitted exponents to a methodological issue: Kaplan et al. used a fixed number of training tokens and learning-rate schedule length across all runs, whereas matching the schedule length to each run's actual token budget produces the best final loss regardless of model size."
    source_ids: ["src-51"]
    verification_status: "verified_full_text"
    note: "Corroborated independently by src-16's own practitioner-facing explanation of the same schedule-length issue (claim-05-scaling-006)."

  - id: "claim-05-scaling-006"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "The Smol Training Playbook states that a fixed cosine-schedule length 'skewed early scaling laws research' because Kaplan et al. used a fixed schedule length when training models on varying token counts, underestimating the impact of data size; the Chinchilla study corrected this by matching schedule length to each model's actual training duration."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-scaling-007"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "The Smol Training Playbook's disclosed 1B-parameter ablation baseline configuration uses AdamW with beta1=0.9, beta2=0.95, epsilon=1e-8, a linear warmup over 2,000 steps, and a cosine decay over 18,000 steps down to a minimum learning-rate floor."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-scaling-008"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Chinchilla (70B parameters, trained on 1.4 trillion tokens) uses the same training compute as Gopher (280B parameters, 300 billion tokens) but uniformly and significantly outperforms Gopher, GPT-3 (175B), Jurassic-1 (178B), and Megatron-Turing NLG (530B) on downstream evaluations, reaching 67.5% average accuracy on MMLU, 'greater than a 7% improvement over Gopher.'"
    source_ids: ["src-51"]
    verification_status: "verified_full_text"
    note: "Presented in the chapter as a separate downstream-capability result, not itself the loss-based quantity that N_opt/D_opt are derived from."

  - id: "claim-05-scaling-009"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Hoffmann et al.'s own Table 3 projects 1.5 trillion tokens as the compute-optimal frontier value for exactly a 67-billion-parameter model; the Chinchilla model they actually trained is 70 billion parameters on 1.4 trillion tokens, described in their own text as 'the larger end' of a predicted 40-70 billion parameter range, chosen for dataset and computational efficiency reasons rather than read directly off the fitted frontier."
    source_ids: ["src-51"]
    verification_status: "verified_full_text"
    note: "The 67B Table 3 row and the 70B actually-trained Chinchilla model are two distinct numbers from the same paper; the chapter deliberately does not conflate them."

  - id: "claim-05-scaling-010"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "The Smol Training Playbook reports SmolLM3 was trained with 3 billion parameters on 11 trillion tokens, a deliberate 'overtraining' choice relative to scaling-law advice, made because a smaller, longer-trained model is cheaper to run at inference."
    source_ids: ["src-16"]
    verification_status: "verified_full_text"
    note: "The ~180x overtraining factor relative to an interpolated Chinchilla-optimal estimate for a 3B model is this chapter's own computed_by_script comparison (see claim-05-scaling-011), not a number either source states directly."

  - id: "claim-05-scaling-011"
    workbook: "05-llm-training"
    chapter: "ch3"
    statement: "Interpolating Hoffmann et al.'s Table 3 tokens-per-parameter ratio (which ranges from 20.00 to 22.39 across the table's own rows) to a 3-billion-parameter model gives an estimated Chinchilla-optimal token budget of approximately 61.0 billion tokens, versus SmolLM3's actual 11 trillion tokens -- an overtraining factor of approximately 180x."
    source_ids: ["src-51", "src-16"]
    verification_status: "computed_by_script"
    note: "Table 3's own rows are quoted verbatim from src-51; the interpolation to 3B and the resulting ratio/factor are computed by data/worked-examples/scaling_law_allocation.py, not stated by either source."

  - id: "claim-05-parallelism-001"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "Data parallelism replicates the entire model on every worker and gives each worker a different micro-batch of data; since this produces different gradients per worker, an all-reduce operation synchronizes (averages) the gradients across all DP ranks before the optimizer step."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-parallelism-002"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "The global batch size relation gbs = mbs * grad_acc * dp holds once data parallelism and gradient accumulation are both in use; teams typically maximize dp before adding gradient-accumulation steps, since DP ranks run in parallel while accumulation steps run sequentially."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-parallelism-003"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "ZeRO's three cumulative stages -- P_os (optimizer-state partitioning, ZeRO-1), P_os+g (+gradient partitioning, ZeRO-2), and P_os+g+p (+parameter partitioning, ZeRO-3) -- partition these model-state objects across the DP ranks instead of replicating them; ZeRO-3 in DeepSpeed's naming and FSDP in PyTorch's naming are the same mechanism under two different names."
    source_ids: ["src-54", "src-17"]
    verification_status: "verified_full_text"
    note: "The P_os/P_os+g/P_os+g+p notation and the specific memory-reduction claims (4x for P_os, 8x for P_os+g, linear-in-N_d for P_os+g+p) are quoted from the original ZeRO paper (src-54) directly, not only from src-17's secondary description."

  - id: "claim-05-parallelism-004"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "ZeRO-DP achieves the computation/communication efficiency of data parallelism while achieving the memory efficiency of model parallelism, by partitioning model states across DP ranks instead of replicating them, while retaining the computational granularity and communication volume of ordinary data parallelism."
    source_ids: ["src-54"]
    verification_status: "verified_full_text"
    note: "This is the ZeRO paper's own framing, quoted directly (Section 1); used in the chapter to support the distinction that sharding changes residency/communication, not the mathematical training objective."

  - id: "claim-05-parallelism-005"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "Tensor parallelism splits a linear layer's weight matrix either by columns (column-parallel: broadcast input, all-gather outputs) or by rows (row-parallel: scatter input, all-reduce outputs); an efficient transformer layer applies column-parallel then row-parallel for both the MLP and the self-attention blocks, requiring only two all-reduces in the forward path and two in the backward path per layer."
    source_ids: ["src-53", "src-17"]
    verification_status: "verified_full_text"
    note: "The exact 'two all-reduces forward, two backward' count is Megatron-LM's own stated result (src-53, Section 3), corroborated by src-17's independent description of the same column/row split."

  - id: "claim-05-parallelism-006"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "The tensor-parallelism degree must not exceed, and should evenly divide, the number of key/value attention heads, since each TP rank needs whole attention heads to compute independently; Llama-3 8B has 8 K/V heads, so its TP degree should not exceed 8."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-parallelism-007"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "The Ultra-Scale Playbook explicitly distinguishes two techniques both sometimes called 'sequence parallelism': (1) sequence parallelism proper, always paired with tensor parallelism, which shards TP's non-sharded operations (LayerNorm, dropout) along the sequence dimension; and (2) what the same source calls context parallelism instead, which shards the sequence across the whole model and can be used independently of tensor parallelism."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: "The source's own words: 'The term Sequence Parallelism is a bit overloaded... we'll refer to them as Context Parallelism to differentiate the two approaches.'"

  - id: "claim-05-parallelism-008"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "Context parallelism shards the input sequence across the entire model; most modules (MLP, LayerNorm) process each token independently and need no extra communication, but the attention module needs key/value pairs from other tokens, handled by Ring Attention -- each rank sends its current K/V chunk to the next rank in a ring (point-to-point, non-blocking) while computing attention on the chunk it currently holds."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: "A naive ring assignment causes load imbalance under causal masking; zig-zag ring attention reassigns chunks for balanced compute -- both points are the source's own description."

  - id: "claim-05-parallelism-009"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "GPipe partitions a sequence of L layers into K cells placed on K accelerators, splits a mini-batch of size N into M micro-batches pipelined through the K accelerators, and accumulates gradients from all M micro-batches before applying them together at the end of the mini-batch, making the resulting parameter update numerically the same regardless of the number of partitions."
    source_ids: ["src-52"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-parallelism-010"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "GPipe's own paper coins the term 'bubble overhead' for the idle time per accelerator introduced by pipeline partitioning, and states that this bubble overhead was found to be negligible once the number of micro-batches M is at least 4 times the number of partitions K (M >= 4K)."
    source_ids: ["src-52"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-parallelism-011"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "The all-forward-all-backward (AFAB) pipeline schedule runs every microbatch's forward pass before any backward pass begins; the one-forward-one-backward (1F1B) schedule instead starts each microbatch's backward pass as soon as possible, which does not by itself shrink the bubble but requires holding far fewer microbatches' activations in memory at once."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-parallelism-012"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "Expert parallelism places different experts' feedforward layers on different devices and uses an all-to-all collective to route each token's hidden state to its assigned expert's device (and another all-to-all to gather results back); EP alone does not shard non-MoE layers or input tokens, so it is normally combined with data parallelism, which shards the input batch."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-parallelism-013"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "DeepSeek-V3's router enforces that each token is sent to at most 4 nodes, keeping expert-routing traffic within a smaller physical neighborhood to reduce communication overhead."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: "This is src-17's own stated example of a real, model-specific EP routing constraint, not a general property of all MoE routers."

  - id: "claim-05-parallelism-014"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "Pipeline parallelism and ZeRO-3 both partition the model along its depth without replicating full parameters, but differ in what each rank stores (a full layer for PP vs. a fraction of a layer for ZeRO-3) and what gets communicated (activations, point-to-point, for PP vs. weights, via collectives, for ZeRO-3); tensor parallelism is typically kept within a single node for fast intra-node interconnect, while PP and ZeRO-3 more readily span slower inter-node links."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-parallelism-015"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "None of DP, sharded DP, TP, PP, CP, or EP is a universal 'silver bullet' for scaling, per the Ultra-Scale Playbook's own explicit qualification; combining them is a deliberate choice suited to a specific model and cluster, not a default requirement that every model use every dimension."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-parallelism-016"
    workbook: "05-llm-training"
    chapter: "ch4"
    statement: "The multidimensional world-size factorization world_size = dp x tp x pp x cp x ep, the representative-rank process-group decomposition, and the two invalid-configuration checks (a factorization not equal to the target world size; a TP degree not dividing the K/V head count) in this chapter's worked example are this chapter's own constructed illustration, not a claim from any source about the fastest or most memory-efficient configuration for a real model."
    source_ids: ["src-17"]
    verification_status: "computed_by_script"
    note: "The general compositional principle (these axes multiply into total device count, subject to per-axis constraints) is supported by src-17's 5D-parallelism framing; the specific 64-device numeric example, rank decomposition convention, and invalid-configuration tests are computed by data/worked-examples/parallelism_layout.py."

  - id: "claim-05-memcomm-001"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "The non-embedding-adjusted parameter count of a transformer is N = h*v + L*(12h^2 + 13h) + 2h, where h is hidden size, v is vocabulary size, and L is the number of layers."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-memcomm-002"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "In mixed-precision training (bf16 compute, fp32 master weights, fp32 Adam moments, no separate fp32 gradient accumulation), per-rank model-state memory is m_params=2N, m_grad=2N, m_params_fp32=4N, m_opt=8N, summing to 16N bytes -- the same total as full fp32 training (4N+4N+8N=16N), not a reduction."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: "The 'mixed precision does not reduce total model-state memory' point is this chapter's own common-misconception callout, directly supported by comparing the source's own two totals."

  - id: "claim-05-memcomm-003"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "ZeRO-3/FSDP partitions all four model-state objects (parameters, gradients, master weights, optimizer states) across the data-parallel group of size Nd, reducing each rank's share to 16N/Nd bytes; ZeRO's own notation bundles the master-weight and optimizer terms into a single k*Psi term with k=12 for mixed-precision Adam."
    source_ids: ["src-54", "src-17"]
    verification_status: "verified_full_text"
    note: "src-17 gives the four-way breakdown (2N+2N+4N+8N); src-54 gives the k=12 bundled notation -- same total, different bookkeeping granularity, both cited rather than smoothed into one."

  - id: "claim-05-memcomm-004"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "Mixed-precision activation memory is m_act = L*seq*bs*h*(34 + 5*n_heads*seq/h) bytes, scaling linearly with batch size and quadratically with sequence length through the attention term."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-memcomm-005"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "Full activation recomputation (checkpointing only at layer boundaries) adds 'up to 30-40%' compute cost; selective recomputation (checkpointing expensive feedforward activations, recomputing cheap attention activations) achieves '70% activation memory reduction at a 2.7% compute cost' for a GPT-3-175B-scale model."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: "Both percentages are the source's own reported figures for its own stated cases, not a universal recomputation-cost guarantee for any model."

  - id: "claim-05-memcomm-006"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "GPipe's own peak-activation-memory analysis with re-materialization gives O(N + (L/K)*(N/M)) for a model with L layers split into K pipeline partitions and M microbatches, versus O(N*L) with neither recomputation nor partitioning (N here is GPipe's own per-layer activation-size notation)."
    source_ids: ["src-52"]
    verification_status: "verified_full_text"
    note: "Notation clash flagged explicitly in the chapter: this N is GPipe's per-layer activation size, not this chapter's own parameter count N."

  - id: "claim-05-memcomm-007"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "ZeRO's own reported per-training-step communication volumes (in units of Psi, the sharded payload size) are: vanilla DP, 2*Psi; ZeRO-2 (Pos+g), also 2*Psi ('exactly the same as the baseline DP'); ZeRO-3 (Pos+g+p), 3*Psi ('1.5x compared to the baseline'). An all-reduce decomposes into a reduce-scatter (Psi) plus an all-gather (Psi)."
    source_ids: ["src-54"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-memcomm-008"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "A latency-bandwidth communication cost model T_comm ~= alpha*num_messages + bytes_moved/effective_bandwidth is used to derive per-strategy communication/computation overlap ratios: for vanilla DP's gradient all-reduce, for ZeRO-3's per-layer parameter all-gather, for TP's activation all-gather (depending only on hidden size and TP degree, not sequence length or batch size), and for PP's point-to-point activation handoff (depending only on hidden size and layers-in-next-stage)."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: "The TP and PP ratios' independence from sequence length and batch size is the source's own stated observation, not this chapter's inference."

  - id: "claim-05-memcomm-009"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "Communication kernels typically execute on the same GPU streaming multiprocessors (SMs) that compute kernels use, so overlapping communication with computation shares a finite resource rather than using two independent ones, leading to decreased throughput relative to a naive estimate that assumes communication is simply invisible."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: "This is the chapter's primary support for 'overlap hides communication, it does not make it free.'"

  - id: "claim-05-memcomm-010"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "Gradient bucketing's default bucket size is often around 25MB, grouping many small gradients into one larger message to amortize the fixed per-message latency better than many small transfers."
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-memcomm-011"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "Benchmarking several thousand distributed configurations (1-64 nodes of 8xH100s) found efficiency decreasing as node count increases, especially for smaller models with a lower compute-to-communication ratio, and found that which of TP or PP ran faster depended on implementation quality: 'when we first implemented both parallelism strategies, Tensor Parallelism (TP) outperformed Pipeline Parallelism (PP). After optimizing our PP code, it became the faster option.'"
    source_ids: ["src-17"]
    verification_status: "verified_full_text"
    note: "Presented as this source's own measured benchmark finding, not a general law about TP vs PP performance for any implementation."

  - id: "claim-05-memcomm-012"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "Megatron-LM's own scaling experiment (fixed 1.2B-parameter model, fixed batch size of 8, increasing GPU count via model parallelism) found that 'using two GPUs makes training 64% faster,' with diminishing returns above that 'as the per-GPU computation decreases and the memory bandwidth and communication overheads begin to dominate.'"
    source_ids: ["src-53"]
    verification_status: "verified_full_text"
    note: "A real, measured example of the bottleneck shifting from compute to bandwidth within a single reported experiment -- used in the chapter to ground the bottleneck-diagnosis framework in an actual result, not only theory."

  - id: "claim-05-memcomm-013"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "Megatron-LM discloses using activation checkpointing 'after every transformer layer' in its own training setup -- i.e. the 'full' recomputation strategy."
    source_ids: ["src-53"]
    verification_status: "verified_full_text"
    note: null

  - id: "claim-05-memcomm-014"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "Arithmetic intensity is defined as the ratio of total FLOPs an operation performs to the number of bytes it needs to communicate (within a chip, for memory bandwidth, or between chips, for interconnect bandwidth); an operation is compute-bound when its own intensity exceeds the hardware's own peak intensity (peak FLOPs/s divided by peak bytes/s)."
    source_ids: ["src-10"]
    verification_status: "verified_full_text"
    note: "Verified via direct fetch and grep of the cited page's raw HTML this session, not the registry summary."

  - id: "claim-05-memcomm-015"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "Achieved compute throughput on real hardware falls short of nominal peak: 'H100s and B200s can usually only achieve around 80-85% of the claimed peak FLOPs, while TPUs can get closer to 95% in normal use.'"
    source_ids: ["src-10"]
    verification_status: "verified_full_text"
    note: "Used in the chapter to support the general caution that effective bandwidth (and effective FLOPs) are never assumed equal to nominal/peak hardware specifications."

  - id: "claim-05-memcomm-016"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "This chapter's own worked example (toy h=4096, v=32000, L=24, n_heads=32, seq=2048, bs=2, DP=8 configuration; the boundary-only activation-memory estimate; the declared 200 GB/s effective bandwidth, 10us alpha, 0.7 overlap fraction, and 120ms illustrative compute time) is a deliberately constructed illustration, not a claim about any real model, cluster, or measured run."
    source_ids: ["src-17", "src-52", "src-54"]
    verification_status: "computed_by_script"
    note: "The underlying formulas (parameter count, model-state memory, activation memory, ZeRO-3 payload) are sourced per claims above; the specific toy inputs, the boundary-only recomputation estimate, and every derived number (communication time, exposed time, step-time impact) are computed by data/worked-examples/memory_and_communication_budget.py. CORRECTED 2026-10-03: an earlier draft reported the local shard size (S/P) as the communication payload; the script now reports the ring all-gather's one-direction (send) volume per rank, ((P-1)/P)*S, and uses P-1 message rounds (not 1) in the latency term -- see claim-05-memcomm-017 below."

  - id: "claim-05-memcomm-017"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "For a full tensor of S bytes ring-all-gathered over P ranks, the local shard one rank stores is S/P, but the volume one rank actually SENDS (and separately RECEIVES) during the ring all-gather is ((P-1)/P)*S -- a standard collective-communication-volume result for the ring algorithm, consistent with ZeRO's own Section 7.2 Psi-based accounting [@src-54] once that accounting's large-P approximation (P-1)/P ~= 1 is applied exactly instead of dropped. This chapter's worked example (P=8) reports the exact (P-1)/P=7/8 factor rather than approximating it away, and uses P-1=7 message rounds (not 1) in the latency term of its communication-time estimate."
    source_ids: ["src-54"]
    verification_status: "computed_by_script"
    note: "The (P-1)/P ring-collective volume formula itself is a standard algorithmic result, not an empirical claim from src-54; it is presented here as consistent with, and a small-P specialization of, src-54's own large-P asymptotic Psi notation. Computed by data/worked-examples/memory_and_communication_budget.py's zero3_ring_allgather_volumes_bytes function. An earlier draft of this chapter incorrectly reported the local shard size (S/P) as if it were this communication payload; a regression test (tests/test_wb05_ch05_worked_examples.py) now asserts the reported payload is NOT the local shard size."

  - id: "claim-05-memcomm-018"
    workbook: "05-llm-training"
    chapter: "ch5"
    statement: "Standard attention implementations materialize the full N-by-N attention score and probability matrices (S and P) to GPU HBM, which takes O(N^2) memory in sequence length N; FlashAttention's tiling avoids ever materializing that full N-by-N matrix on HBM. Peak activation-memory scaling therefore depends on which attention implementation is used, not only on parameter count or the specific accounting convention any one source (e.g. [@src-17]'s Equation 3 formula) declares."
    source_ids: ["src-55", "src-17"]
    verification_status: "verified_full_text"
    note: "Quoted/paraphrased directly from src-55's own Section 2.2 ('Standard attention implementations materialize the matrices S and P to HBM, which takes O(N^2) memory') and Figure 1 caption ('FlashAttention uses tiling to prevent materialization of the large N x N attention matrix ... on (relatively) slow GPU HBM'). Used to qualify, not contradict, src-17's own Equation 3 activation-memory formula -- that formula encodes src-17's own declared conventional accounting, not a universal law independent of attention implementation."

  - id: "claim-06-readingruns-001"
    workbook: "05-llm-training"
    chapter: "ch6"
    statement: "Llama 3 405B's main pretraining stage uses AdamW with a peak learning rate of 8x10^-5, a linear warmup of 8,000 steps, and a cosine learning-rate schedule decaying to 8x10^-7 over 1,200,000 steps; batch size starts at 4M tokens (sequence length 4,096), doubles to 8M tokens (sequence length 8,192) after pre-training 252M tokens, and doubles again to 16M tokens after pre-training on 2.87T tokens; total pretraining corpus is 15.6T tokens."
    source_ids: ["src-32"]
    verification_status: "verified_full_text"
    note: "Verified via full-text extraction of the arXiv PDF's Section 3.4 ('Training Recipe') and Section 3.2.1, specifically re-checked this session for training-infrastructure/training-recipe numbers beyond the architecture detail Workbook 04 already verified from the same source."

  - id: "claim-06-readingruns-002"
    workbook: "05-llm-training"
    chapter: "ch6"
    statement: "Llama 3 405B's own Table 4 reports three scaling configurations for the same model, hardware generation, and precision: 8,192 GPUs (TP=8, CP=1, PP=16, DP=64, sequence length 8,192) at 43% BF16 MFU; 16,384 GPUs (TP=8, CP=1, PP=16, DP=128, sequence length 8,192) at 41% MFU; and 16,384 GPUs (TP=8, CP=16, PP=16, DP=8, sequence length 131,072) at 38% MFU -- all three holding a 16M-token global batch constant."
    source_ids: ["src-32"]
    verification_status: "verified_full_text"
    note: "Verified via full-text extraction of the arXiv PDF's Table 4 and its surrounding Section 3.3.2 discussion of the MFU drop from 43% to 41% as GPU count/DP degree increases."

  - id: "claim-06-readingruns-003"
    workbook: "05-llm-training"
    chapter: "ch6"
    statement: "Llama 3 405B pretraining used up to 16K H100 GPUs (drawn from a larger 24K-GPU RoCE-based cluster), on Meta's Grand Teton AI server platform with eight GPUs and two CPUs per server, NVLink within a server, and RoCE/InfiniBand fabrics at 400 Gbps between GPUs; overall reported BF16 model FLOP utilization across pretraining configurations was 38-43%."
    source_ids: ["src-32"]
    verification_status: "verified_full_text"
    note: "Verified via full-text extraction of the arXiv PDF's Section 3.3.1 ('Training Infrastructure')."

  - id: "claim-06-readingruns-004"
    workbook: "05-llm-training"
    chapter: "ch6"
    statement: "DeepSeek-V3 uses AdamW with beta1=0.9, beta2=0.95, weight_decay=0.1; maximum sequence length 4,096 (4K) during pretraining; 14.8T total pretraining tokens; a learning-rate schedule linearly increasing from 0 to 2.2x10^-4 over the first 2K steps, held constant at 2.2x10^-4 until 10T tokens are consumed, cosine-decayed to 2.2x10^-5 over the next 4.3T tokens, then held at 2.2x10^-5 for 333B tokens and 7.3x10^-6 for the final 167B tokens; gradient-clipping norm 1.0; and a batch-size schedule gradually increasing from 3,072 to 15,360 sequences over the first 469B tokens, then held constant."
    source_ids: ["src-33"]
    verification_status: "verified_full_text"
    note: "Verified via full-text extraction of the arXiv PDF's Section 4.2 ('Hyper-Parameters' -> 'Training Hyper-Parameters'), re-checked this session specifically for training-configuration numbers beyond the architecture hyperparameters Workbook 04 already verified from the same source."

  - id: "claim-06-readingruns-005"
    workbook: "05-llm-training"
    chapter: "ch6"
    statement: "DeepSeek-V3 is trained on a cluster of 2,048 NVIDIA H800 GPUs (8 GPUs per node, NVLink/NVSwitch intra-node, InfiniBand across nodes); pretraining on each trillion tokens requires approximately 180K H800-GPU-hours (3.7 days on this 2,048-GPU cluster), the full pretraining stage costs 2.664M GPU-hours, and total training (including context-length extension and post-training) costs 2.788M GPU-hours, priced at $5.576M assuming $2 per GPU-hour."
    source_ids: ["src-33"]
    verification_status: "verified_full_text"
    note: "Verified via full-text extraction of the arXiv PDF's Section 3.1 ('Compute Clusters') and its training-cost summary table/discussion."

  - id: "claim-06-readingruns-006"
    workbook: "05-llm-training"
    chapter: "ch6"
    statement: "This chapter's own worked example (a 30-logged-step synthetic training log: global batch size 256 sequences, sequence length 4,096 tokens, 32 devices, a declared loss/grad-norm spike at step 18, and a declared sustained step-time increase across steps 24-27) is a deliberately constructed, clearly-labeled synthetic illustration, not a claim about any real model, cluster, or measured run. Its FLOPs-per-step estimate reuses Chapter 3's C~=6ND relation, and its nominal-vs-achieved-FLOPs framing reuses Chapter 5's roofline distinction and its citation of real hardware achieving only 80-85% of claimed peak FLOPs."
    source_ids: ["src-50", "src-51", "src-10"]
    verification_status: "computed_by_script"
    note: "The C~=6ND relation and the 80-85%-of-peak caution are restated from Chapter 3's and Chapter 5's own already-verified citations (see claim-05-memcomm-015 for the latter's original verification), not re-verified here; every specific number in this chapter's worked example is computed by data/worked-examples/pretraining_run_telemetry.py from declared, labeled-synthetic inputs."

