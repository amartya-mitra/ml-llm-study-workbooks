  - chapter: "ch5"
    source_ids: ["src-10", "src-17"]
    candidate_source_ids: ["GPipe (arXiv:1811.06965)", "Megatron-LM (arXiv:1909.08053)", "ZeRO (arXiv:1910.02054)"]
    note: "Same candidate-source status as ch4 -- not yet verified, not yet registered."

  - chapter: "ch6"
    source_ids: ["src-32", "src-33"]
