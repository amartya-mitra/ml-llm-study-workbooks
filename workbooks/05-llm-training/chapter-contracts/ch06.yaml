# Chapter contract for Workbook 05, Chapter 6 ("Reading Real
# Pretraining Runs"). Validated by scripts/validate_chapter_contract.py
# against shared/chapter-contract-schema.yaml.
#
# UPDATED: Chapter 6 has completed independent human review (including
# one source-audit correction pass fixing a missing time-qualifier on
# a restated hardware-efficiency claim) and is now accepted_frozen,
# recorded here per the Workbook 05 integration task that reported
# this review as complete. This is a status-record update only --
# Chapter 6's prose, questions, solutions, figures, data, and tests
# were not modified by this update.
#
# identity.status here must exactly match
# config/chapter-status-registry.yaml's entry for
# workbooks."05-llm-training".chapters."06" -- both now say
# accepted_frozen.

identity:
  workbook: "05-llm-training"
  chapter: "06"
  title: "Reading Real Pretraining Runs"
  status: "accepted_frozen"

scope:
  # Accepted and frozen: no further edits are in scope without an
  # explicit human-authorized override recorded in
  # config/chapter-status-registry.yaml's active_overrides list --
  # matching Chapter 5's own accepted-chapter contract convention.
  allowed_paths: []
  frozen_paths:
    - "workbooks/05-llm-training/chapters/06-reading-real-pretraining-runs.qmd"
    - "workbooks/05-llm-training/solutions/06-reading-real-pretraining-runs-solutions.qmd"
    - "workbooks/05-llm-training/data/worked-examples/pretraining_run_telemetry.py"
    - "workbooks/05-llm-training/data/worked-examples/pretraining_run_telemetry.json"
    - "workbooks/05-llm-training/figures/source/fig_run_diagnosis_pipeline.py"
    - "workbooks/05-llm-training/figures/rendered/fig-run-diagnosis-pipeline.svg"
    - "workbooks/05-llm-training/chapters/0[1-5]-*.qmd"
    - "workbooks/05-llm-training/solutions/0[1-5]-*-solutions.qmd"
    - "workbooks/04-llm-architecture/**"
  canonical_output_allowed: false
  release_output_allowed: false
  push_allowed: false

sources:
  required_source_ids: ["src-32", "src-33"]
  full_text_required: true
  evidence_locators_required: true

content:
  required_sections:
    - "Learning objectives"
    - "Why this matters"
    - "Mental model or analogy"
    - "Visual overview"
    - "Technical core"
    - "Worked example"
    - "Compare and contrast"
    - "Check your understanding"
    - "Applied exercise"
    - "Interview lens"
    - "Chapter recap"
    - "Sources and further reading"
    - "Answer Key"
  question_count: 5
  answer_count: 5
  worked_example_count_minimum: 1
  figure_count_minimum: 1

worked_examples:
  structured_output_required: true
  prose_crosscheck_required: true
  units_required: true

figures:
  semantic_tests_required: true
  numeric_source_of_truth_required: true

learner_facing:
  forbid_source_ids: true
  forbid_repo_paths: true
  forbid_implementation_filenames: true
  forbid_revision_history: true
  require_scope_qualification: true

# Updated after Chapter 6's correction pass and independent human
# review: the source audit (performed directly, sequentially, per
# docs/audit-profiles/01-source-audit.md -- no subagent) found and the
# correction pass fixed one required finding (a missing time-qualifier
# on a restated hardware-efficiency claim); the re-audit confirmed it
# resolved. Numerical/figure/learner-PDF audit stages were exercised
# with the established sequential procedure and clean fixture-backed
# checks during that same pass. visual_review is "pass" because a
# human performed the independent review this record now reflects --
# no script ever sets this field itself.
acceptance:
  source_audit: "pass"
  numerical_audit: "pass"
  figure_audit: "pass"
  learner_pdf_audit: "pass"
  scoped_tests: "pass"
  visual_review: "pass"
