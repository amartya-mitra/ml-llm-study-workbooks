# Question records for workbook 05 (LLM Pretraining and Distributed Training).
# Schema: shared/question-schema.yaml. Validate with:
#   python3 scripts/validate_questions.py

questions:
  - id: "q-05-pretraining-data-001"
    workbook: "05-llm-training"
    chapter: "pretraining-objectives-and-data"
    topic: "Loss comparability across tokenizer changes"
    difficulty: "intro"
    question_type: "recall"
    prompt: "Two ablation runs use different tokenizers. Can their training-loss curves be compared directly to decide which run is better?"
    expected_answer: "No. Different tokenizers split the same text into a different number of pieces, so the two loss numbers are not measuring the same quantity."
    explanation: "A lower loss under one tokenizer does not mean the underlying model is better than one trained with a different tokenizer, since the per-token prediction task itself differs between tokenizers."
    common_wrong_answer: "Treating 'lower loss' as a universal, tokenizer-independent scoreboard that is always comparable across any two runs."
    source_ids: ["src-16"]

  - id: "q-05-pretraining-data-002"
    workbook: "05-llm-training"
    chapter: "pretraining-objectives-and-data"
    topic: "Data-mixing token allocation"
    difficulty: "core"
    question_type: "calculation"
    prompt: "A team allocates a 50-billion-token budget across three sources with mixing weights 0.6, 0.3, and 0.1. How many tokens does each source receive?"
    expected_answer: "Source 1: 0.6 x 50B = 30B tokens. Source 2: 0.3 x 50B = 15B tokens. Source 3: 0.1 x 50B = 5B tokens. The three allocations sum to exactly 50B tokens."
    explanation: "Each source's token allocation is its mixing weight multiplied by the total token budget; the weights are a partition of the budget, so they must sum to the total."
    common_wrong_answer: "Treating the mixing weights as independent quantities (e.g. computing each against a different assumed total) rather than a partition of one shared budget."
    source_ids: []

  - id: "q-05-pretraining-data-003"
    workbook: "05-llm-training"
    chapter: "pretraining-objectives-and-data"
    topic: "Data quality versus repetition cost"
    difficulty: "core"
    question_type: "misconception_diagnosis"
    prompt: "True or false: training only on the highest-quality-seeming subset of available text (discarding everything else) is always the best strategy for a model with a large token budget."
    expected_answer: "False."
    explanation: "For a large token budget, discarding most available data forces heavy repetition of the remaining small pool, and reported prior work found that this kind of repetition can hurt performance -- so the highest-quality subset alone is not automatically optimal once repetition costs are accounted for."
    common_wrong_answer: "Assuming 'higher quality data is always better' generalizes without limit, ignoring the repetition cost that a large token budget introduces."
    source_ids: ["src-16"]

  - id: "q-05-pretraining-data-004"
    workbook: "05-llm-training"
    chapter: "pretraining-objectives-and-data"
    topic: "Asymmetry between positive and negative ablation results"
    difficulty: "core"
    question_type: "explanation"
    prompt: "An architecture ablation shows a small improvement at small scale, and a separate ablation shows a small regression at small scale. Which of the two results should a team trust with less additional testing, and why?"
    expected_answer: "The regression (negative result) can be trusted with less additional testing."
    explanation: "If a change hurts performance at small scale, that result can be confidently ruled out at large scale without further testing. A small-scale improvement, by contrast, needs more tokens trained before a team can be confident it will hold at full scale -- positive results are the weaker signal of the two."
    common_wrong_answer: "Treating both a small positive and a small negative result as equally strong evidence, rather than recognizing the reported asymmetry between them."
    source_ids: ["src-16"]

  - id: "q-05-pretraining-data-005"
    workbook: "05-llm-training"
    chapter: "pretraining-objectives-and-data"
    topic: "Fixed versus multi-stage data mixtures"
    difficulty: "stretch"
    question_type: "compare_and_contrast"
    prompt: "State one concrete reason a team might prefer a multi-stage (curriculum) data mixture over a single fixed mixture for the whole training run."
    expected_answer: "Either: (a) a model's final behavior is disproportionately shaped by data seen late in training, so reserving small, high-quality sources for a late annealing stage can have more impact than diluting them across the whole run; or (b) a fixed mixture cannot respond to a capability bottleneck discovered partway through training, while a multi-stage mixture can introduce targeted data once a bottleneck is observed."
    explanation: "Recent large models (e.g. SmolLM2, Llama 3, OLMo 2) increasingly use multi-stage mixtures for exactly these reasons, rather than fixing one ratio for the entire run as earlier models did."
    common_wrong_answer: "Assuming a multi-stage mixture is strictly better with no added cost -- it also carries higher implementation complexity, since each stage transition needs its own validation."
    source_ids: ["src-16"]

  - id: "q-05-mtp-001"
    workbook: "05-llm-training"
    chapter: "multi-token-prediction"
    topic: "Independence between heads in the parallel MTP design"
    difficulty: "intro"
    question_type: "recall"
    prompt: "In the independent-heads design, does head 2's prediction depend on head 1's output?"
    expected_answer: "No. Both heads read only the shared trunk's output; neither head's computation depends on the other head's prediction or hidden state."
    explanation: "The independent-heads architecture computes each head from the same shared trunk output z_t:1, with no path from one head's output into another head's input."
    common_wrong_answer: "Assuming 'multiple heads' implies some interaction between them, when in this design the heads are structurally independent."
    source_ids: ["src-43"]

  - id: "q-05-mtp-002"
    workbook: "05-llm-training"
    chapter: "multi-token-prediction"
    topic: "Target-position counting for the independent-heads objective"
    difficulty: "core"
    question_type: "calculation"
    prompt: "For a sequence of length T=8 and a prediction horizon n=2, how many positions t are valid, and how many total individual loss terms does the independent-heads objective produce?"
    expected_answer: "Valid t satisfies t + n <= T, i.e. t <= 6, so t = 1..6: 6 valid positions. Each valid position has n=2 heads, so the total is 6 x 2 = 12 individual loss terms."
    explanation: "A position is valid only if every head has a real target token to predict; positions within n-1 of the sequence end are excluded, exactly as in the chapter's own 6-token worked example."
    common_wrong_answer: "Counting all T positions (including the last n-1, which have no complete target) rather than only the valid t <= T-n positions."
    source_ids: []

  - id: "q-05-mtp-003"
    workbook: "05-llm-training"
    chapter: "multi-token-prediction"
    topic: "Teacher forcing in the sequential-chain design"
    difficulty: "core"
    question_type: "explanation"
    prompt: "What extra information does depth 2 of the sequential-chain design receive that head 2 of the independent-heads design does not?"
    expected_answer: "Depth 2's input combines depth 1's hidden state with the actual embedding of depth 1's target token (teacher forcing) -- so depth 2 already has the ground-truth answer to the 'one token ahead' question before predicting 'two tokens ahead.' Head 2 in the independent-heads design receives only the shared trunk's output and has no information about head 1's target."
    explanation: "This is the structural difference DeepSeek-V3's own paper states explicitly: it keeps 'the complete causal chain at each prediction depth,' unlike Gloeckle et al.'s parallel independent heads."
    common_wrong_answer: "Assuming both designs' extra heads/depths receive the same information, differing only in how many there are."
    source_ids: ["src-33", "src-43"]

  - id: "q-05-mtp-004"
    workbook: "05-llm-training"
    chapter: "multi-token-prediction"
    topic: "MTP versus speculative decoding"
    difficulty: "core"
    question_type: "misconception_diagnosis"
    prompt: "True or false: a model trained with an MTP objective must be served using speculative decoding."
    expected_answer: "False."
    explanation: "Both verified sources state that the default at inference is to discard the auxiliary heads/modules and use only the ordinary next-token path. Repurposing the discarded components for speculative decoding is a separate, optional design decision, not a requirement."
    common_wrong_answer: "Treating MTP and speculative decoding as the same technique, or assuming training with MTP implies a specific serving strategy."
    source_ids: ["src-43", "src-33"]

  - id: "q-05-mtp-005"
    workbook: "05-llm-training"
    chapter: "multi-token-prediction"
    topic: "Shared versus duplicated components across MTP designs"
    difficulty: "stretch"
    question_type: "compare_and_contrast"
    prompt: "Name one component that is shared across heads/modules in each of the two designs, and one component that is duplicated per head/module in each."
    expected_answer: "Design 1 (independent heads): the shared trunk and the unembedding matrix are shared; each head's own transformer layers are duplicated per head. Design 2 (sequential chain): the embedding layer and the output head are shared across depths and with the main model; each depth's transformer block and projection matrix are duplicated per depth."
    explanation: "Each paper states its own sharing pattern explicitly; the two designs share different components, so 'what's shared' cannot be generalized from one design to the other."
    common_wrong_answer: "Assuming nothing is shared just because there are multiple heads/modules, or assuming the two designs share the same components."
    source_ids: ["src-43", "src-33"]

  - id: "q-05-scaling-001"
    workbook: "05-llm-training"
    chapter: "optimization-and-scaling-laws"
    topic: "What a single-factor scaling law does and does not establish"
    difficulty: "intro"
    question_type: "recall"
    prompt: "What three quantities does a scaling law relate loss to, and does any one of the single-factor equations alone tell you how to split a fixed compute budget between model size and data size?"
    expected_answer: "Model size N, dataset size D, and compute C. No -- each single-factor equation describes loss as one factor grows while the other is not the bottleneck; none of them alone answers the separate fixed-compute allocation question of how to split a budget between N and D."
    explanation: "The single-factor power laws and the fixed-compute allocation question are two distinct results in the chapter's sources, not one and the same."
    common_wrong_answer: "Treating a single-factor power law (e.g. loss improves as model size grows) as if it already specified the optimal split of a fixed compute budget."
    source_ids: ["src-50"]

  - id: "q-05-scaling-002"
    workbook: "05-llm-training"
    chapter: "optimization-and-scaling-laws"
    topic: "Kaplan et al.'s fixed-compute allocation exponents"
    difficulty: "core"
    question_type: "calculation"
    prompt: "Using Kaplan et al.'s fitted exponents (a=0.73, b=0.27), if a fixed compute budget increases by 10x, by what factor should model size and dataset size each grow, and what should the product of the two growth factors equal?"
    expected_answer: "Model size grows by 10^0.73 ~= 5.37x; dataset size grows by 10^0.27 ~= 1.86x. 5.37 x 1.86 ~= 10.00, confirming the allocation reproduces the 10x compute increase exactly, since 0.73 + 0.27 = 1.0."
    explanation: "Because the two exponents sum to 1.0, the two growth factors must multiply (not add) to the compute multiplier itself -- verified mechanically in the chapter's worked example."
    common_wrong_answer: "Applying the same growth factor to both quantities, or checking that the two factors add to 10 rather than multiply to 10."
    source_ids: ["src-50"]

  - id: "q-05-scaling-003"
    workbook: "05-llm-training"
    chapter: "optimization-and-scaling-laws"
    topic: "Methodological cause of the Kaplan-to-Chinchilla revision"
    difficulty: "core"
    question_type: "explanation"
    prompt: "What specific methodological difference does Hoffmann et al. identify as a cause of their revised allocation exponents, relative to Kaplan et al.'s original fit?"
    expected_answer: "Kaplan et al. used a fixed number of training tokens and a fixed learning-rate schedule length across all runs, which underestimated smaller models' potential. Hoffmann et al. instead matched each run's schedule length to its actual token budget and found this produces the best final loss regardless of model size, correcting the earlier underestimate."
    explanation: "This is the specific, stated methodological cause behind the two papers' different fitted exponents, not merely a different dataset or fitting tool."
    common_wrong_answer: "Assuming the two papers simply used different datasets or curve-fitting software rather than identifying the schedule-length mismatch Hoffmann et al. state explicitly."
    source_ids: ["src-51", "src-16"]

  - id: "q-05-scaling-004"
    workbook: "05-llm-training"
    chapter: "optimization-and-scaling-laws"
    topic: "Revision versus refutation framing"
    difficulty: "core"
    question_type: "misconception_diagnosis"
    prompt: "True or false: Hoffmann et al.'s Chinchilla paper shows that Kaplan et al.'s original scaling-law paper was simply wrong."
    expected_answer: "False."
    explanation: "Hoffmann et al. state they reach the same qualitative conclusion as Kaplan et al. -- that compute-optimal training should not proceed to full convergence -- while revising the specific allocation ratio for an identified methodological reason. This is a revision, not a refutation."
    common_wrong_answer: "Treating a later paper's revised number as evidence the earlier paper's entire framework was invalid, rather than checking what the later paper itself claims to revise."
    source_ids: ["src-51"]

  - id: "q-05-scaling-005"
    workbook: "05-llm-training"
    chapter: "optimization-and-scaling-laws"
    topic: "Predicted optimum versus actual production engineering choice"
    difficulty: "stretch"
    question_type: "explanation"
    prompt: "Why can a real production model like SmolLM3 be trained on far more tokens than its Chinchilla-optimal estimate would suggest, without that being an error?"
    expected_answer: "A smaller model trained on more tokens than the loss-minimizing allocation suggests is cheaper to run at inference. The Smol Training Playbook states SmolLM3 was deliberately trained on about 11 trillion tokens for a 3-billion-parameter model -- roughly 180x an interpolated Chinchilla-optimal estimate for that size -- specifically to reduce downstream inference cost, a consideration the loss-minimizing allocation itself does not account for."
    explanation: "The Chinchilla-style allocation minimizes training loss for a fixed compute budget; it does not factor in a model's post-training inference cost, which is a separate, legitimate engineering consideration that can justify deliberately training beyond the loss-optimal token budget."
    common_wrong_answer: "Assuming any deviation from a Chinchilla-optimal token budget must be a mistake, rather than recognizing inference-cost amortization as a stated, deliberate reason for overtraining."
    source_ids: ["src-16"]

  - id: "q-05-parallelism-001"
    workbook: "05-llm-training"
    chapter: "distributed-parallelism"
    topic: "What ZeRO-3/FSDP shards versus what it does not"
    difficulty: "intro"
    question_type: "recall"
    prompt: "In ZeRO-3 (equivalently, FSDP), which of the following are sharded across the data-parallel group: optimizer states, gradients, parameters, activations?"
    expected_answer: "Optimizer states, gradients, and parameters are all sharded. Activations are not sharded by ZeRO -- each DP replica already processes a different micro-batch, so its activations are never duplicated across replicas in the first place."
    explanation: "ZeRO's three cumulative stages (P_os, P_os+g, P_os+g+p) partition exactly the three model-state objects that vanilla DP would otherwise replicate identically on every rank; activations are a separate memory category ZeRO does not target."
    common_wrong_answer: "Assuming ZeRO shards 'everything,' including activations, rather than specifically the model-state objects DP would otherwise replicate."
    source_ids: ["src-54", "src-17"]

  - id: "q-05-parallelism-002"
    workbook: "05-llm-training"
    chapter: "distributed-parallelism"
    topic: "World-size factorization and devices per model replica"
    difficulty: "core"
    question_type: "calculation"
    prompt: "A cluster has 32 devices. You set tp=4 and pp=2, with no context or expert parallelism. What data-parallel degree is implied, and how many devices form one complete model replica?"
    expected_answer: "dp = 32 / (4 x 2) = 4. One complete model replica uses tp x pp = 4 x 2 = 8 devices."
    explanation: "The world-size factorization world_size = dp x tp x pp x cp x ep (with unused axes equal to 1) determines the implied dp degree once the other degrees and the world size are fixed."
    common_wrong_answer: "Dividing the world size by only one of tp or pp instead of their product, or forgetting that unused axes still act as factors of 1."
    source_ids: ["src-17"]

  - id: "q-05-parallelism-003"
    workbook: "05-llm-training"
    chapter: "distributed-parallelism"
    topic: "Global batch size from microbatch, gradient accumulation, and DP degree"
    difficulty: "core"
    question_type: "calculation"
    prompt: "With a micro-batch size of 3, 4 gradient-accumulation steps, and a data-parallel degree of 8, what is the global batch size?"
    expected_answer: "gbs = 3 x 4 x 8 = 96."
    explanation: "The global batch size is the product of micro-batch size, gradient-accumulation steps, and data-parallel degree -- not just the per-replica local batch (3 x 4 = 12)."
    common_wrong_answer: "Omitting the data-parallel multiplier and reporting only the per-replica local batch as if it were the global batch size."
    source_ids: ["src-17"]

  - id: "q-05-parallelism-004"
    workbook: "05-llm-training"
    chapter: "distributed-parallelism"
    topic: "Pipeline parallelism versus data parallelism"
    difficulty: "core"
    question_type: "misconception_diagnosis"
    prompt: "True or false: increasing the pipeline-parallelism degree is mathematically equivalent to increasing the data-parallel degree, since both let you use more GPUs for training."
    expected_answer: "False."
    explanation: "Increasing DP adds more identical, full model replicas processing different data, synchronized by gradient all-reduce. Increasing PP splits the same model into more, smaller stages holding different layers, passing activations point-to-point -- no PP stage holds a full model replica, unlike every DP rank."
    common_wrong_answer: "Treating 'more GPUs used' as the defining property of a parallelism strategy, rather than what is replicated versus sharded and what is actually communicated."
    source_ids: ["src-52", "src-17"]

  - id: "q-05-parallelism-005"
    workbook: "05-llm-training"
    chapter: "distributed-parallelism"
    topic: "Justified parallelism combination under stated constraints"
    difficulty: "stretch"
    question_type: "design"
    prompt: "You must train a model on 64 devices. Its key/value head count limits the tensor-parallelism degree to at most 8, and its optimizer states and gradients do not fit in a single device's memory even after full ZeRO/FSDP sharding across all 64 devices unless the data-parallel group is large. Propose one parallelism combination (state a degree for each axis you use) that respects the tp <= 8 constraint and multiplies out to 64 devices, and justify your choice in one or two sentences."
    expected_answer: "One valid combination: tp=8, dp=8, pp=1, ep=1 (product = 64). Justification: tp=8 uses the maximum allowed tensor-parallel degree to shard weights/gradients/activations within a layer as much as the K/V-head constraint permits, while dp=8 maximizes the data-parallel (and ZeRO-shardable) group size to spread optimizer-state and gradient memory as thinly as possible. Other combinations are valid if the degrees multiply to 64, respect tp<=8, and the justification correctly maps each degree to the constraint it addresses."
    explanation: "This question requires combining the world-size factorization with the stated TP divisibility constraint and the memory-pressure rationale for maximizing the ZeRO-shardable DP group -- there is no single correct configuration, only correctly justified ones."
    common_wrong_answer: "Proposing degrees that do not multiply to 64, or proposing tp > 8, which violates the stated K/V-head constraint."
    source_ids: ["src-17", "src-54"]
