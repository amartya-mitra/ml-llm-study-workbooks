  - id: "q-06-readingruns-003"
    workbook: "05-llm-training"
    chapter: "reading-real-pretraining-runs"
    topic: "Comparable vs non-comparable runs"
    difficulty: "core"
    question_type: "explanation"
    prompt: "A colleague wants to compare Llama 3 405B's and DeepSeek-V3's pretraining runs and conclude which one trained 'more efficiently.' List at least four specific, named differences between the two disclosed configurations that make a direct comparison invalid as stated, and state what would need to be true for the comparison to become valid."
    expected_answer: "At least four independently disqualifying differences: (1) architecture -- dense 405B vs. 671B-total/37B-activated MoE; (2) hardware -- up to 16K H100s vs. 2,048 H800s; (3) precision -- BF16 vs. FP8 mixed precision; (4) batch-size units -- tokens (4M/8M/16M) vs. sequences (3,072-15,360). Sequence length and the two reports' incompatible headline metrics (MFU vs. GPU-hours/dollar cost) are additional valid differences. The comparison becomes valid only once every such axis is held equal or explicitly converted and accounted for, not simply placed side by side as reported."
    explanation: "A valid comparison requires hardware, precision, sequence length, batch-size units, token budget, model size, and evaluation protocol to be either identical or explicitly reconciled; the two reports differ on nearly every one of these axes."
    common_wrong_answer: "Treating 'both are large published LLM pretraining runs' as sufficient grounds for comparison, or converting only one of the several incompatible axes and treating the result as fully comparable."
    source_ids: ["src-32", "src-33"]

  - id: "q-06-readingruns-004"
    workbook: "05-llm-training"
    chapter: "reading-real-pretraining-runs"
    topic: "Communication bottleneck vs straggler device"
    difficulty: "core"
    question_type: "explanation"
    prompt: "A run's global throughput drops sharply for several consecutive steps while its training loss and gradient norm continue their ordinary trend. Name the two competing diagnoses this chapter discusses for this exact symptom pattern, and the one additional measurement that would distinguish between them."
    expected_answer: "A communication bottleneck (a collective operation getting slower, affecting every device roughly equally) versus a straggler device (one slow participant pacing an entire synchronous step while every other device sits idle). The distinguishing measurement is a per-device (per-rank) step-time or utilization breakdown: the communication-bottleneck diagnosis predicts roughly equal elevated time on every device, while the straggler diagnosis predicts one device far slower than the rest."
    explanation: "A global step-time symptom alone cannot distinguish a uniform slowdown from one straggling device -- both produce the same aggregate signature."
    common_wrong_answer: "Assuming a global throughput drop must be a communication problem by default, or trying to diagnose the cause using only the global step-time number."
    source_ids: []

  - id: "q-06-readingruns-005"
    workbook: "05-llm-training"
    chapter: "reading-real-pretraining-runs"
    topic: "Checkpoint record vs full per-step log"
    difficulty: "stretch"
    question_type: "design"
    prompt: "You are handed this chapter's own worked example's log (as described in Question 2) and told only that 'loss looked fine throughout.' Using the trailing-window anomaly check this chapter defines (compare each step's value to the mean of the four steps immediately before it; flag if the relative deviation exceeds 20%), identify the one step in the 30-step log where this check would have caught a problem the checkpoint-only record (steps 10, 20, 30) completely misses, and justify, from the log's own structure, why a checkpoint-only readout would not have caught it."
    expected_answer: "Step 18. Its train_loss (4.350) deviates +33.5% from the trailing average of the four preceding steps (3.259), past the 20% threshold. The checkpoint-only record evaluates only at steps 10, 20, and 30; step 20's eval_loss (3.310 against train_loss 3.160) shows only an ordinary generalization gap, because by step 20 training loss had already returned to its smooth baseline trend -- the event is visible only in the full per-step log, not in any sparser checkpoint summary."
    explanation: "A checkpoint record and a full per-step record are not the same evidence even from the same run; a sparse checkpoint schedule can miss a transient event entirely."
    common_wrong_answer: "Assuming 'loss looked fine throughout' must be true because the checkpoint-level numbers look unremarkable, without checking whether the checkpoint schedule is sparse enough to miss a transient event entirely."
    source_ids: []
