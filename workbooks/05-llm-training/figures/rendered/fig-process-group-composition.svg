<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <title>Multidimensional process-group composition (DP x PP x TP), 8-device illustration</title>
  <defs></defs>
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <rect x="20" y="15" width="940" height="32" rx="4" fill="#f2f2f2" stroke="#666666" stroke-width="1.2"/>
  <text x="490.0" y="36" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">LOGICAL PROCESS GROUPS — not a physical rack or network diagram</text>
  <rect x="130.0" y="110" width="150" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="205.0" y="138" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">rank 0</text>
  <text x="205.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="middle">dp=0  pp=0  tp=0</text>
  <rect x="130.0" y="260" width="150" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="205.0" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">rank 2</text>
  <text x="205.0" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="middle">dp=0  pp=1  tp=0</text>
  <rect x="320.0" y="110" width="150" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="395.0" y="138" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">rank 1</text>
  <text x="395.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="middle">dp=0  pp=0  tp=1</text>
  <rect x="320.0" y="260" width="150" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="395.0" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">rank 3</text>
  <text x="395.0" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="middle">dp=0  pp=1  tp=1</text>
  <rect x="510.0" y="110" width="150" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="585.0" y="138" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">rank 4</text>
  <text x="585.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="middle">dp=1  pp=0  tp=0</text>
  <rect x="510.0" y="260" width="150" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="585.0" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">rank 6</text>
  <text x="585.0" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="middle">dp=1  pp=1  tp=0</text>
  <rect x="700.0" y="110" width="150" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="775.0" y="138" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">rank 5</text>
  <text x="775.0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="middle">dp=1  pp=0  tp=1</text>
  <rect x="700.0" y="260" width="150" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="775.0" y="288" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">rank 7</text>
  <text x="775.0" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555555" text-anchor="middle">dp=1  pp=1  tp=1</text>
  <rect x="122.0" y="102" width="356.0" height="106" rx="10" fill="none" stroke="#0072B2" stroke-width="3" stroke-dasharray="solid"/>
  <rect x="122.0" y="102" width="166" height="256" rx="10" fill="none" stroke="#009E73" stroke-width="3" stroke-dasharray="2,3"/>
  <rect x="122.0" y="102" width="166" height="106" rx="10" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="6,4"/>
  <rect x="502.0" y="102" width="166" height="106" rx="10" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="205.0" y1="102" x2="205.0" y2="76" stroke="#D55E00" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="205.0" y1="76" x2="585.0" y2="76" stroke="#D55E00" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="585.0" y1="76" x2="585.0" y2="102" stroke="#D55E00" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="395.0" y="68" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#D55E00" text-anchor="middle">same DP group — not grid-adjacent</text>
  <text x="130.0" y="405" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Legend:</text>
  <rect x="220.0" y="391" width="40" height="16" rx="3" fill="none" stroke="#0072B2" stroke-width="3" stroke-dasharray="solid"/>
  <text x="270.0" y="403" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">TP group (rank 0, rank 1) — shares dp, pp; varies tp</text>
  <rect x="220.0" y="419" width="40" height="16" rx="3" fill="none" stroke="#009E73" stroke-width="3" stroke-dasharray="2,3"/>
  <text x="270.0" y="431" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">PP group (rank 0, rank 2) — shares dp, tp; varies pp</text>
  <rect x="220.0" y="447" width="40" height="16" rx="3" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="270.0" y="459" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">DP group (rank 0, rank 4) — shares pp, tp; varies dp</text>
  <text x="490.0" y="495" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="middle">Rank 0 is a member of all three groups above at once — the same 8 devices, sliced along three different axes.</text>
</svg>
