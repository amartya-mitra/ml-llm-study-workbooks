  <text x="490.0" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="middle">Total forward-pass parameter all-gather communication this step: 58.1 ms — hidden + exposed must sum to this total. Excludes backward-pass all-gathers and gradient reduce-scatters.</text>
