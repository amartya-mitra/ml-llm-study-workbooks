  <rect x="841.1461963237097" y="220" width="98.85380367629037" height="70" rx="6" fill="#D55E00" stroke="#333333" stroke-width="1.5"/>
  <text x="890.5730981618549" y="260.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">exposed</text>
  <line x1="160" y1="325" x2="940.0" y2="325" stroke="#333333" stroke-width="2.5"/>
  <line x1="160" y1="317" x2="160" y2="333" stroke="#333333" stroke-width="2.5"/>
  <line x1="940.0" y1="317" x2="940.0" y2="333" stroke="#333333" stroke-width="2.5"/>
