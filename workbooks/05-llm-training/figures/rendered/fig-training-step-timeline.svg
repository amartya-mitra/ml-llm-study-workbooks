  <rect x="330" y="371" width="30" height="16" rx="6" fill="#888888" stroke="#333333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="368" y="383" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#333333" text-anchor="start">Hidden communication (overlapped)</text>
