<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610">
  <title>Multi-token prediction training objective (independent heads)</title>
  <defs><marker id="arrow-333333" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="arrow-888888" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker></defs>
  <rect x="0" y="0" width="960" height="610" fill="#ffffff"/>
  <rect x="20" y="15" width="920" height="30" rx="4" fill="#fdecea" stroke="#D55E00" stroke-width="1.5"/>
  <text x="480.0" y="35" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#D55E00" text-anchor="middle">TRAINING-TIME OBJECTIVE  —  not an inference-time decoding diagram</text>
  <rect x="342.0" y="70" width="60" height="40" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="372.0" y="96" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">x1</text>
  <rect x="414.0" y="70" width="60" height="40" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="444.0" y="96" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">x2</text>
  <rect x="486.0" y="70" width="60" height="40" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="516.0" y="96" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">...</text>
  <rect x="558.0" y="70" width="60" height="40" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="588.0" y="96" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">xt</text>
  <text x="480.0" y="130" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555555" text-anchor="middle">observed context x_t:1</text>
  <line x1="480.0" y1="138" x2="480.0" y2="155" stroke="#333333" stroke-width="2" marker-end="url(#arrow-333333)"/>
  <rect x="370.0" y="155" width="220" height="50" rx="6" fill="#E69F00" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="177" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">shared trunk f_s</text>
  <text x="480.0" y="195" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle">produces hidden state z_t</text>
  <line x1="480.0" y1="205" x2="480.0" y2="240" stroke="#333333" stroke-width="2" marker-end="url(#arrow-333333)"/>
  <rect x="410.0" y="240" width="140" height="40" rx="6" fill="#0072B2" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="266" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#ffffff" text-anchor="middle">z_t (shared)</text>
  <line x1="480.0" y1="280" x2="250.0" y2="335" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow-888888)"/>
  <rect x="155.0" y="335" width="190" height="50" rx="6" fill="#009E73" stroke="#333333" stroke-width="1.5"/>
  <text x="250.0" y="357" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Head 1  f_h1</text>
  <text x="250.0" y="375" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle">predicts x_(t+1)</text>
  <line x1="480.0" y1="280" x2="480.0" y2="335" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow-888888)"/>
  <rect x="385.0" y="335" width="190" height="50" rx="6" fill="#009E73" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="357" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Head 2  f_h2</text>
  <text x="480.0" y="375" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle">predicts x_(t+2)</text>
  <line x1="480.0" y1="280" x2="710.0" y2="335" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow-888888)"/>
  <rect x="615.0" y="335" width="190" height="50" rx="6" fill="#009E73" stroke="#333333" stroke-width="1.5"/>
  <text x="710.0" y="357" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Head 3  f_h3</text>
  <text x="710.0" y="375" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle">predicts x_(t+3)</text>
  <line x1="250.0" y1="385" x2="250.0" y2="430" stroke="#333333" stroke-width="2" marker-end="url(#arrow-333333)"/>
  <rect x="175.0" y="430" width="150" height="38" rx="6" fill="#ffffff" stroke="#E69F00" stroke-width="1.5"/>
  <text x="250.0" y="454" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#333333" text-anchor="middle">loss_1 = -log P(x_(t+1))</text>
  <line x1="480.0" y1="385" x2="480.0" y2="430" stroke="#333333" stroke-width="2" marker-end="url(#arrow-333333)"/>
  <rect x="405.0" y="430" width="150" height="38" rx="6" fill="#ffffff" stroke="#E69F00" stroke-width="1.5"/>
  <text x="480.0" y="454" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#333333" text-anchor="middle">loss_2 = -log P(x_(t+2))</text>
  <line x1="710.0" y1="385" x2="710.0" y2="430" stroke="#333333" stroke-width="2" marker-end="url(#arrow-333333)"/>
  <rect x="635.0" y="430" width="150" height="38" rx="6" fill="#ffffff" stroke="#E69F00" stroke-width="1.5"/>
  <text x="710.0" y="454" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#333333" text-anchor="middle">loss_3 = -log P(x_(t+3))</text>
  <line x1="250.0" y1="468" x2="480.0" y2="513" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow-888888)"/>
  <line x1="480.0" y1="468" x2="480.0" y2="513" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow-888888)"/>
  <line x1="710.0" y1="468" x2="480.0" y2="513" stroke="#888888" stroke-width="1.5" marker-end="url(#arrow-888888)"/>
  <rect x="280.0" y="513" width="400" height="50" rx="6" fill="#888888" stroke="#333333" stroke-width="1.5"/>
  <text x="480.0" y="535" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">combined objective</text>
  <text x="480.0" y="553" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">L_n = sum of all head losses</text>
  <text x="480.0" y="591" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="middle">At inference (not shown): by default, only Head 1&#x27;s next-token path is kept; Heads 2-3 are discarded.</text>
</svg>
