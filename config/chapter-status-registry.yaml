# canonical PDF as its asset, and the downloaded asset reproduced
# `sha256` (see scripts/validate_publication_hygiene.py --remote). Until
# then the release_* fields are PREPARED values, not claims. Canonical
# PDFs stay untracked, ignored build products; the release asset is the
# distribution channel.
