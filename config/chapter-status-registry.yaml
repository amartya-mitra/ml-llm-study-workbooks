# --------------------------------------------------------------------
# Publication records (see docs/publication-hygiene.md)
# --------------------------------------------------------------------
# One record per distributable artifact (a workbook or an addendum),
# keyed by artifact id. Lifecycle:
#   planned -> drafting -> review_pending -> accepted_frozen
#           -> canonical_built -> published
