# --------------------------------------------------------------------
# Override mechanism
# --------------------------------------------------------------------
# An override authorizes editing a frozen chapter/workbook ONLY for the
# task named in `granted_for`, and ONLY while the matching entry below
# is present. There is no time-based expiry field on purpose: the
# override is scoped to a task, not a duration, and must be removed
# (by hand, in the same commit that finishes the authorized task) once
# that task's work is committed -- an override left in this list after
# its task is done is itself a defect to fix, not a feature.
#
# scripts/chapter_gate.py, scripts/visual_regression.py, and the
# staged pre-action guard hook (see .claude/hooks/pre_action_guard.py
# and .claude/hooks.staged.json -- staged/inactive by default, see
# docs/chapter-factory-operator-guide.md for activation) all read this
# list fresh on every invocation -- never cached -- and treat a
# frozen-path edit as blocked unless a matching, path-scoped entry
# exists here.
#
# Fields:
#   workbook      -- must match a key under `workbooks:` above.
#   chapter       -- two-digit chapter number, or "*" for a
#                     whole-workbook override (e.g. Workbook 04).
#                     Prefer a specific chapter number; "*" is a
#                     broader grant and should be used only when the
#                     authorized task genuinely spans the whole
#                     workbook.
#   allowed_paths -- REQUIRED, non-empty list of exact repo-relative
#                     paths (or path globs) this override authorizes
#                     editing -- not merely "this chapter in general."
#                     An edit to any frozen path NOT listed here is
#                     still blocked even with a matching workbook/
#                     chapter override. This is the "name exact
#                     allowed paths" / "bounded scope" requirement:
#                     an override grants access to specific files, not
#                     blanket permission over a whole chapter.
#   granted_for   -- REQUIRED. One-sentence description of the exact
#                     task that was given explicit human authorization
#                     to make this edit (e.g. "Chapter 5 all-gather
#                     payload correction pass, 2026-10-03"). This is
#                     the "state the reason" requirement.
#   granted_by    -- REQUIRED, must be the literal string "human" --
#                     this registry does not support a model granting
#                     its own override (see
#                     docs/chapter-factory-operator-guide.md's warning
#                     against permission laundering).
#
# An override NEVER implies push or publication permission on its
# own: scope.push_allowed and scope.release_output_allowed in every
# chapter contract stay false regardless of any active override here,
# unless a separate task explicitly authorizes a push or a release.
#
# Empty by design right now (the default): this infrastructure task is
# explicitly NOT a correction task for any chapter, so it grants no
# override. An override entry left in this list after its authorized
# task is committed is itself a defect -- remove it in that same
# commit.
active_overrides: []

# Illustrative example only -- NOT a real entry, and not parsed by any
# script (everything above `active_overrides:` above is the real,
# live list). Shown so the required shape is unambiguous:
#
# active_overrides:
#   - workbook: 05-llm-training
#     chapter: "05"
#     allowed_paths:
#       - "workbooks/05-llm-training/chapters/05-training-memory-and-communication.qmd"
#       - "workbooks/05-llm-training/solutions/05-training-memory-and-communication-solutions.qmd"
#     granted_for: "Chapter 5 all-gather payload correction pass, 2026-10-03"
#     granted_by: human
