# coarse, whole-workbook, and currently stale -- it still says
# "05-llm-training: not started"). This file is chapter-granular and is
# the one source of truth scripts/chapter_gate.py and the pre-action
# guard hook read to decide whether a path may be edited.
#
# Updated by hand, at the END of whatever task accepts or drafts a
# chapter -- never speculatively. "frozen" here means "accepted and not
# to be re-opened absent an explicit override" -- it does NOT mean
# "cannot ever be corrected"; Workbook 05 Chapter 5's own history
# (accepted, then corrected twice via explicitly-scoped follow-up
# tasks) is exactly the case the override mechanism below exists for.
#
# commit_sha values are the real `git log -1 --format=%H -- <path>`
# result at the time this registry entry was last updated -- not
# invented, and not updated except by actually re-running that command.

