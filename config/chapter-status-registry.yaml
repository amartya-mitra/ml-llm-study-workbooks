# --------------------------------------------------------------------
# Reopenings of accepted content (narrowly scoped, human-instructed)
# --------------------------------------------------------------------
# A reopening moves accepted content back to drafted_pending_human_review
# for one named revision, lists exactly which paths that revision may
# change, and leaves every other accepted path frozen. It never changes a
# published record and never implies push, tag or release permission.
# Close it by hand (status accepted_frozen again, entry marked closed)
# only after independent human review of the revision's PDF.
